    : isKing ? (selCount>=4&&selCount%4===0?[selCount/4]:[])
    : (selCount>=4?Array.from({length:Math.floor(selCount/4)},(_,i)=>i+1):[]);
  useEffect(()=>{
    if(!courtOpts.length) return;
    const def=!isDynamic?fit:dynFitCourts;
    if(!courtOpts.includes(parseInt(courts,10))) setCourts(String(courtOpts.includes(def)?def:courtOpts[0]));
  },[courtOpts.join(','),isDynamic,isKing]); // eslint-disable-line react-hooks/exhaustive-deps
  const dynSetScore=(ri,court,which,val)=>setDynScores(s=>({...s,[`${ri}-${court}`]:{...(s[`${ri}-${court}`]||{}),[which]:val.replace(/[^0-9]/g,'')}}));
  const roundDone=(ri)=>{ const rd=dynRounds[ri]; return !!rd&&rd.games.every(g=>{const sc=dynScores[`${ri}-${g.court}`]||{}; return sc.s1!==''&&sc.s1!=null&&sc.s2!==''&&sc.s2!=null&&!isNaN(parseInt(sc.s1,10))&&!isNaN(parseInt(sc.s2,10));}); };
  const dynStand=React.useMemo(()=>dynStandings(dynRounds,dynScores,dynSortKey),[dynRounds,dynScores,dynSortKey]);
  const startNextRound=()=>{
    setGenErr('');
    if(!dynCourtsValid){ setGenErr(isKing?`King of the court needs exactly 4 players per court — ${selCount} players fits ${dynFitCourts} court${dynFitCourts>1?'s':''} (${4*dynFitCourts} players).`:`Need at least ${4*courtsNum} players for ${courtsNum} court${courtsNum>1?'s':''}.`); return; }
    if(dynRounds.length&&!roundDone(dynRounds.length-1)){ setGenErr('Enter all scores for the current round first.'); return; }
    // King promotes the winning team, so a tied court has no winner to move — block until it's decisive.
    if(isKing&&dynRounds.length){ const ri=dynRounds.length-1;
      const tie=dynRounds[ri].games.find(g=>{const sc=dynScores[`${ri}-${g.court}`]||{}; return parseInt(sc.s1,10)===parseInt(sc.s2,10);});
      if(tie){ setGenErr(`Court ${tie.court} is tied — King of the court needs a winner on each court. Adjust that score, then generate the next round.`); return; }
    }
    const rd=isKing?dynKingRound(order,dynRounds,dynScores,courtsNum):dynGlobalRound(order,dynRounds,dynScores,courtsNum,dynSortKey);
    if(!rd.games.length){ setGenErr('Could not build the round — check player and court numbers.'); return; }
    setDynRounds(r=>[...r,rd]);
    setTimeout(()=>{const el=document.getElementById('soc-rounds'); if(el) el.scrollIntoView({behavior:'smooth',block:'end'});},60);
  };
  const undoLastRound=()=>{ const ri=dynRounds.length-1; if(ri<0) return; setDynRounds(r=>r.slice(0,-1)); setDynScores(s=>{const n={...s}; (dynRounds[ri].games||[]).forEach(g=>delete n[`${ri}-${g.court}`]); return n;}); };
  // Meet-everyone: pre-generate ALL rounds up front (no scores needed), then reuse the
  // round-by-round rendering/slips/save. Re-running re-shuffles the whole night.
  const generateMixer=()=>{
    setGenErr('');
    if(!dynCourtsValid){ setGenErr(`Need at least ${4*courtsNum} players for ${courtsNum} court${courtsNum>1?'s':''}.`); return; }
    const rounds=mixerRounds(order,courtsNum,mixerRoundCount);
    if(!rounds.length||!rounds[0].games.length){ setGenErr('Could not build the rotation — check player and court numbers.'); return; }
    setDynRounds(rounds); setDynScores({});
    setTimeout(()=>{const el=document.getElementById('soc-rounds'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},60);
  };

  const planData=(sched)=>{
    // Never persist a schedule that references players outside the current line-up —
    // keeps plan.attendees and plan.courts/rounds from drifting apart.
    const atSet=new Set(order);
    const srcCourts=sched?sched.courts:(schedule?schedule.courts:[]);
    const courtsClean=(Array.isArray(srcCourts)&&srcCourts.length>0&&srcCourts.every(ct=>(ct.players||[]).every(p=>atSet.has(p.name))))?srcCourts:[];
    const roundsClean=(Array.isArray(dynRounds)&&dynRounds.length>0&&dynRounds.every(rd=>(rd.games||[]).every(g=>[...(g.teamA||[]),...(g.teamB||[]),...(g.sitOut||[])].every(n=>atSet.has(n)))))?dynRounds:[];
    return {
      attendees:order.map(n=>({name:n,rating:ratingOf(n),guest:guestOf(n)})),
      courts:courtsClean,
      court_mode:courtMode, scores, rounds:roundsClean, dynScores, pairs, generatedFor:date,
    };
  };
  const savePlan=async(newStatus)=>{
    setBusy(true); setMsg({type:'',text:'Saving…'});
    const anyPlay=!!schedule||dynRounds.length>0, anyScore=scoredCount>0||Object.keys(dynScores).length>0;
    const st=newStatus||(anyPlay?(anyScore?'live':'planned'):session.status);
    try{
      await sbUpdateSocial(session.id,{plan:planData(),court_mode:courtMode,status:st});
      setStatus(st); setAutoStatus('saved');
      setMsg({type:'ok',text:newStatus==='complete'?'✓ Session marked complete.':'✓ Saved — scores and standings stored.'});
      onSaved&&onSaved();
    }catch(e){ setMsg({type:'error',text:'Save failed: '+(e.message||'are you signed in as admin?')}); }
    setBusy(false);
  };

  const togglePublish=async()=>{
    const next=!published; setBusy(true); setMsg({type:'',text:next?'Publishing…':'Hiding…'});
    try{
      await sbUpdateSocial(session.id,{plan:planData(),court_mode:courtMode,published:next});
      setPublished(next); setAutoStatus('saved');
      setMsg({type:'ok',text:next?'✓ Published — members can now see this on the Social page.':'✓ Hidden — members can no longer see this session.'});
      onSaved&&onSaved();
    }catch(e){ setMsg({type:'error',text:'Failed: '+(e.message||'are you signed in as admin?')}); }
    setBusy(false);
  };

  // Auto-save the plan (attendees, order, court grouping, scores, generated courts) shortly
  // after any change — so added players persist without needing an explicit save. Skipped until
  // the saved plan has hydrated, and only when signed in.
  useEffect(()=>{
    if(!hydrated.current) return;
    setAutoStatus('saving'); // DEMO: open sandbox writes via anon key; sbWrite try/catch handles failures
    const t=setTimeout(async()=>{
      try{ await sbUpdateSocial(session.id,{plan:planData(),court_mode:courtMode}); setAutoStatus('saved'); }
      catch(e){ setAutoStatus('error'); }
    },900);
    return()=>clearTimeout(t);
  },[order,courtMode,scores,schedule,dynRounds,dynScores,pairs]);

  const roundRobin=session.format==='round_robin';
  // Round-robin: only offer games-per-court counts that divide cleanly for the current
  // courts (mirrors the graded builder). Dynamic/mixer formats manage rounds separately.
  const gameOpts=(roundRobin&&courtsValid)?gameOptions(sizesArr):[];
  useEffect(()=>{
    if(!roundRobin||!gameOpts.length) return;
    const cur=parseInt(targetGames,10);
    if(!gameOpts.includes(cur)){ const want=isNaN(cur)?6:cur;
      setTargetGames(String(gameOpts.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a))); }
  },[gameOpts.join(','),roundRobin]); // eslint-disable-line react-hooks/exhaustive-deps
  const autoLabel={saving:'Saving…',saved:'✓ All changes saved',error:'Not saved — sign in as admin',idle:''}[autoStatus];
  return(
    <div className="fixed inset-0 z-50 bg-gray-50 overflow-y-auto">
      <header style={{background:NAVY}} className="sticky top-0 z-10 shadow-lg">
        <div className="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between gap-2">
          <div className="min-w-0">
            <div className="text-white/50 text-xs font-semibold uppercase tracking-widest leading-none truncate">{clubName} · Social session builder — players, courts &amp; scores</div>
            <div className="text-white font-black text-base sm:text-lg leading-tight truncate">{session.name||fmtFull(date)}</div>
          </div>
          <div className="flex items-center gap-2 flex-shrink-0">
            {autoLabel&&<span className="hidden sm:inline text-xs font-semibold" style={{color:autoStatus==='error'?'#fecaca':autoStatus==='saving'?'rgba(255,255,255,0.5)':'rgba(255,255,255,0.75)'}}>{autoLabel}</span>}
            <button onClick={()=>setEditing(true)} className="flex items-center gap-1.5 text-white/80 hover:text-white text-sm font-bold px-3 py-1.5 rounded-lg hover:bg-white/10">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
              Edit
            </button>
            <button onClick={onClose} className="flex items-center gap-1.5 text-white/80 hover:text-white text-sm font-bold px-3 py-1.5 rounded-lg hover:bg-white/10">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
              Close
            </button>
          </div>
        </div>
        <div style={{background:SOCIAL,height:'3px'}}/>
      </header>

      <main className="max-w-4xl mx-auto px-4 py-6 space-y-6">
        {/* Session summary */}
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-4 space-y-2">
          <div className="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
            <span className="font-black" style={{color:INK}}>{fmtFull(date)}</span>
            <span className="text-gray-400">·</span>
            <span className="text-gray-600">{SOCIAL_FORMATS[session.format]||session.format}</span>
            <span className="text-gray-400">·</span>
            <span className="text-gray-600">{scored?(session.format==='mexicano'?`${scoring.target||21} points per game`:`Games to ${scoring.target||11}, win by ${scoring.win_by||2}`):'No scoring'}{scoring.timed?`, ${scoring.round_minutes||15}-min rounds`:''}</span>
            <span className="ml-auto text-[11px] font-bold px-2.5 py-1 rounded-full" style={{background:'rgba(16,185,129,0.10)',color:'#047857'}}>Never affects RDR</span>
          </div>
          <SessionMeta loc={session.location} start={session.start_time} end={session.end_time} host={session.host} taken={order.length} capacity={session.capacity}/>
        </div>
        {isDynamic&&(
          <div className="bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 text-sm text-slate-600">
            <b style={{color:INK}}>{SOCIAL_FORMATS[session.format]}</b> — {isMixer
              ? 'everyone rotates across courts every round to partner & play against as many different people as possible — a pure social mixer. Pick the number of rounds, generate them all, print and play. No scores needed.'
              : session.format==='king'
              ? 'winners move up a court, losers move down; top-court winners stay, bottom-court losers stay. Enter each round’s scores, then generate the next.'
              : session.format==='mexicano'
                ? 'players are re-paired each round by running points so games stay close. Enter scores, then generate the next round.'
                : 'players climb the ladder as they win. Enter each round’s scores, then generate the next round.'} Courts are 2‑v‑2 (4 players each).
          </div>
        )}

        {/* Court setup */}
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 grid sm:grid-cols-3 gap-4">
          {roundRobin&&(
          <div className="sm:col-span-3">
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Court grouping<InfoPopover label="Court grouping" items={GROUPING_INFO}/></label>
            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
              {[['ability','By ability','Strongest on Court 1'],['balanced','Balanced / mixed','Every court evenly matched'],['mixed','Mixed doubles','1 man + 1 woman per pair'],['protect','Protect newcomers','New players spread; each court an anchor'],['random','Random draw','Pure luck of the draw'],['pairs','Keep pairs together','Locked partners always play as a team']].map(([k,l,d])=>(
                <button key={k} onClick={()=>setCourtMode(k)} className={"px-3 py-2 rounded-xl text-sm font-semibold border text-left "+(courtMode===k?'text-white border-transparent':'border-gray-200 text-gray-700')} style={courtMode===k?{background:NAVY}:undefined}>
                  <div>{l}</div><div className={"text-[11px] font-normal "+(courtMode===k?'text-white/70':'text-gray-400')}>{d}</div>
                </button>
              ))}
            </div>
          </div>
          )}
          {roundRobin&&courtMode==='pairs'&&(
          <div className="sm:col-span-3 bg-slate-50 border border-slate-200 rounded-xl p-3">
            <div className="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">Locked pairs</div>
            {order.length<2
              ? <p className="text-[11px] text-gray-500">Add the players you want in the <b>Who's playing</b> list below, then come back here to pick two and tap <b>Link</b> — they'll stay a partnership on the same court all night.</p>
              : (<>
            <div className="flex flex-wrap gap-2 items-center mb-2">
              <select value={pairA} onChange={e=>setPairA(e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm bg-white flex-1 min-w-[120px]">
                <option value="">Player…</option>
                {order.filter(n=>!pairs.some(p=>p.includes(n))).map(n=><option key={n} value={n}>{n}</option>)}
              </select>
              <span className="text-gray-400 font-bold">+</span>
              <select value={pairB} onChange={e=>setPairB(e.target.value)} className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm bg-white flex-1 min-w-[120px]">
                <option value="">Partner…</option>
                {order.filter(n=>n!==pairA&&!pairs.some(p=>p.includes(n))).map(n=><option key={n} value={n}>{n}</option>)}
              </select>
              <button type="button" disabled={!pairA||!pairB||pairA===pairB} onClick={()=>{ setPairs(p=>[...p,[pairA,pairB]]); setPairA(''); setPairB(''); }} className="text-xs font-bold px-3 py-1.5 rounded-lg text-white disabled:opacity-40" style={{background:NAVY}}>Link</button>
            </div>
            {pairs.length>0
              ? <div className="flex flex-wrap gap-1.5">{pairs.map(([a,b],i)=>(<span key={i} className="inline-flex items-center gap-1 text-xs font-semibold bg-white border border-gray-200 rounded-full px-2.5 py-1">{a} &amp; {b}<button type="button" onClick={()=>setPairs(p=>p.filter((_,j)=>j!==i))} className="text-gray-400 hover:text-red-500 font-bold ml-0.5">×</button></span>))}</div>
              : <p className="text-[11px] text-gray-400">Link two players and they'll always play as a team, kept on the same court.</p>}
              </>)}
          </div>
          )}
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Courts{isDynamic?' (4 each)':''} <span className="text-gray-400 normal-case tracking-normal">· fits your players</span></label>
            {courtOpts.length
              ? <select value={courts} onChange={e=>setCourts(e.target.value)} aria-label="Courts" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-orange-400">
                  {courtOpts.map(c=><option key={c} value={c}>{c} court{c>1?'s':''}{c===(isDynamic?dynFitCourts:fit)?' · best fit':''}</option>)}
                </select>
              : <div className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-400 bg-gray-50">{selCount<4?'Select players first':(isKing?'King needs players in multiples of 4':'These players don’t split into courts')}</div>}
          </div>
          {roundRobin&&(
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Games per court <span className="text-gray-400 normal-case tracking-normal">· options that fit</span></label>
            {courtsValid
              ? <select value={targetGames} onChange={e=>setTargetGames(e.target.value)} aria-label="Games per court" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-orange-400">
                  {gameOpts.map(g=><option key={g} value={g}>{gameOptLabel(g,sizesArr)}</option>)}
                </select>
              : <div className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-400 bg-gray-50">Set players &amp; courts first</div>}
          </div>
          )}
          {isMixer&&(
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Rounds <span className="text-gray-400 normal-case tracking-normal">· everyone rotates</span></label>
            <select value={String(Math.min(8,Math.max(1,parseInt(targetGames,10)||6)))} onChange={e=>setTargetGames(e.target.value)} aria-label="Rounds" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-orange-400">
              {[1,2,3,4,5,6,7,8].map(g=><option key={g} value={g}>{g} round{g===1?'':'s'}</option>)}
            </select>
          </div>
          )}
          <div className={"flex items-end "+(isDynamic&&!isMixer?'sm:col-span-2':'')}>
            <p className="text-xs text-gray-500">{selCount<4
              ? <span>Add at least 4 players</span>
              : roundRobin
                ? (range?<span><b style={{color:INK}}>{selCount}</b> in · valid courts <b>{range[0]===range[1]?range[0]:`${range[0]}–${range[1]}`}</b></span>:<span className="text-red-600 font-semibold">{selCount} can’t split into 4–6s</span>)
                : (dynCourtsValid
                    ? <span><b style={{color:INK}}>{selCount}</b> in · {courtsNum} court{courtsNum>1?'s':''} of 4{selCount>4*courtsNum?` · ${selCount-4*courtsNum} sit out each round (rotated)`:''}</span>
                    : <span className="text-red-600 font-semibold">{isKing?`King needs exactly 4 per court — try ${dynFitCourts} court${dynFitCourts>1?'s':''} (${4*dynFitCourts} players)`:`Need ≥ ${4*courtsNum} players for ${courtsNum} courts`}</span>)}</p>
          </div>
        </div>

        {roundRobin&&cRem>0&&cRem<courtsNum&&sizesArr&&(
          <div className="bg-white rounded-2xl shadow-sm border border-gray-100 px-5 py-3">
            <div className="text-[11px] font-semibold text-gray-500 mb-1.5">{cRem} extra player{cRem>1?'s':''} — tap which court{cRem>1?'s':''} take{cRem>1?'':'s'} the +1:</div>
            <div className="flex gap-1.5 flex-wrap">
              {sizesArr.map((sz,i)=>{ const on=bigChoice.includes(i); return(
                <button key={i} type="button" onClick={()=>toggleBig(i)} className={"text-xs font-bold px-2.5 py-1 rounded-lg border transition-colors "+(on?"text-white border-transparent":"bg-white border-gray-200 text-gray-600 hover:bg-gray-50")} style={on?{background:NAVY}:undefined}>Court {i+1}: {sz}</button>
              );})}
            </div>
          </div>
        )}

        {/* Attendees + seed order */}
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
            <h3 className="text-sm font-black flex items-center gap-2" style={{color:INK}}>Who’s playing?
              <span className="text-xs font-black px-2.5 py-1 rounded-full text-white tabular-nums" style={{background:selCount<4?'#94a3b8':(courtsValid?GREEN:NAVY)}}>{selCount} in</span>
            </h3>
            <div className="flex gap-2">
              <button onClick={autoSeed} disabled={selCount<2} className="text-xs font-bold px-3 py-1.5 rounded-lg text-white disabled:opacity-40" style={{background:CORAL_DARK}} title="Order strongest-first by rating">✨ Auto-seed</button>
              <button onClick={clearAll} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700">Clear</button>
            </div>
          </div>
          {overCapacity>0&&(
            <div className="w-full mb-3 flex items-center justify-between gap-3 px-4 py-3 rounded-xl bg-amber-50 border border-amber-200">
              <span className="text-sm font-semibold text-amber-800"><b>{selCount} in</b> — {overCapacity} over the capacity of {capNum}. Walk-in? Bump the capacity or add a court.</span>
              <button onClick={raiseCapacity} className="flex-shrink-0 text-xs font-bold px-3 py-1.5 rounded-lg text-white whitespace-nowrap" style={{background:AMBER}}>Raise to {selCount}</button>
            </div>
          )}
          {(()=>{ const missing=booked.filter(n=>!order.includes(n));
            if(booked.length===0) return null;
            if(missing.length===0) return (
              <div className="w-full mb-3 flex items-center justify-between gap-2 px-4 py-3 rounded-xl text-left" style={{background:'rgba(16,185,129,0.10)',border:'1px solid rgba(16,185,129,0.35)'}}>
                <span className="text-sm font-black" style={{color:'#047857'}}>✓ {booked.length} booked player{booked.length>1?'s':''} auto-added to the line-up</span>
                <span className="text-xs font-semibold" style={{color:'#059669'}}>from the booking page</span>
              </div>
            );
            return (
              <button onClick={()=>setOrder(o=>[...o,...missing])} className="w-full mb-3 flex items-center justify-between gap-2 px-4 py-3 rounded-xl text-white text-left shadow-sm" style={{background:GREEN}}>
                <span className="text-sm font-black">＋ Bring in {missing.length} more who booked</span>
                <span className="text-xs font-semibold opacity-90">signed up on the booking page →</span>
              </button>
            );
          })()}
          <CompAdminsPanel sessionKind="social" sessionId={session.id} onChange={async()=>{ try{ const b=await sbBookedRoster('social',session.id); setBooked(b); setOrder(o=>[...o,...b.filter(n=>!o.includes(n))]); }catch(e){} }}/>

          {/* Seeded (selected) list — drag / up-down to reorder */}
          {selCount>0&&(
            <div className="mb-4">
              <div className="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">Seed order {courtMode==='ability'?'(1 = Court 1)':'(1 = strongest — spread across courts)'} — use ▲▼ or drag to reorder</div>
              <div className="space-y-1.5 max-h-[38vh] overflow-y-auto pr-1">
                {order.map((name,i)=>(
                  <div key={name} draggable
                    onDragStart={e=>{ dragFrom.current=i; setDraggingName(name); try{e.dataTransfer.effectAllowed='move';}catch(_){} }}
                    onDragEnter={()=>{ if(dragFrom.current!=null&&dragFrom.current!==i){ move(dragFrom.current,i); dragFrom.current=i; } }}
                    onDragOver={e=>{ e.preventDefault(); try{e.dataTransfer.dropEffect='move';}catch(_){} }}
                    onDragEnd={()=>{ dragFrom.current=null; setDraggingName(null); }}
                    onDrop={e=>{ e.preventDefault(); dragFrom.current=null; setDraggingName(null); }}
                    className={"flex items-center gap-2 px-2.5 py-2 rounded-xl border bg-white transition-all duration-150 "+(draggingName===name?"border-dashed opacity-40 scale-[0.98]":"border-gray-200")}
                    style={draggingName===name?{borderColor:CORAL_DARK}:undefined}>
                    <span className="cursor-grab text-gray-300 select-none" title="Drag to reorder" aria-hidden="true">⋮⋮</span>
                    <span className="w-6 text-center text-xs font-black tabular-nums flex-shrink-0" style={{color:CORAL_DARK}}>{i+1}</span>
                    <span className="text-sm font-semibold text-gray-800 truncate flex-1 min-w-0">{name}{guestOf(name)&&<span className="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded" style={{background:'#f1f5f9',color:'#64748b'}}>GUEST</span>}</span>
                    <span className="text-xs font-mono font-bold text-gray-400 flex-shrink-0">{fmtR(ratingOf(name))}</span>
                    <div className="flex items-center gap-0.5 flex-shrink-0">
                      {(guestOf(name)||ratingOf(name)==null)&&<button onClick={()=>openManage(name)} className="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:bg-orange-50 hover:text-orange-500" title="Set rating / promote to member" aria-label={`Set rating for ${name}`}>⚙</button>}
                      <button onClick={()=>move(i,i-1)} disabled={i===0} className="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-gray-100 disabled:opacity-30" aria-label="Move up">▲</button>
                      <button onClick={()=>move(i,i+1)} disabled={i===selCount-1} className="w-6 h-6 rounded flex items-center justify-center text-gray-500 hover:bg-gray-100 disabled:opacity-30" aria-label="Move down">▼</button>
                      <button onClick={()=>remove(name)} className="w-6 h-6 rounded flex items-center justify-center text-gray-400 hover:bg-red-50 hover:text-red-500" aria-label={`Remove ${name}`}>✕</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Add guest / new player */}
          <div className="bg-gray-50 rounded-xl p-3 mb-3">
            <div className="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">Add a player or guest</div>
            <div className="flex gap-2 flex-wrap sm:flex-nowrap">
              <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Name" className="flex-1 min-w-[130px] border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-orange-400"/>
              <input value={newRating} onChange={e=>setNewRating(e.target.value)} inputMode="decimal" placeholder="Rating (opt)" className="w-24 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-orange-400"/>
              <select value={newGender} onChange={e=>setNewGender(e.target.value)} title="Gender (optional) — for mixed / men's / women's sessions" className="w-24 border border-gray-200 rounded-xl px-2 py-2 text-sm bg-white focus:outline-none focus:border-orange-400">
                <option value="">Gender…</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
              </select>
              <button onClick={addPlayer} disabled={addBusy} className="px-4 py-2 rounded-xl text-white text-sm font-bold disabled:opacity-50" style={{background:CORAL_DARK}}>{addBusy?'Adding…':'+ Add'}</button>
            </div>
            <label className="flex items-center gap-2 text-xs text-gray-600 mt-2"><input type="checkbox" checked={newGuest} onChange={e=>setNewGuest(e.target.checked)}/> One-off guest / drop-in (leave a rating blank for non-ranked)</label>
            {addErr&&<p className="text-xs text-red-600 mt-1.5">{addErr}</p>}
          </div>

          {/* Roster picker */}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search the roster to add players…" className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm mb-2 focus:outline-none focus:border-orange-400"/>
          <div className="flex items-center gap-1 mb-2 flex-wrap">
            <span className="text-[11px] font-semibold text-gray-400 mr-1">Show</span>
            {[['all','Everyone'],['male',"Men's"],['female',"Women's"]].map(([k,l])=>(
              <button key={k} onClick={()=>setGenderFilter(k)} className={"text-xs font-bold px-3 py-1.5 rounded-lg "+(genderFilter===k?'text-white':'bg-gray-100 text-gray-600 hover:bg-gray-200')} style={genderFilter===k?{background:NAVY}:undefined}>{l}</button>
            ))}
            {genderFilter!=='all'&&<span className="text-[11px] text-gray-400">— only {genderFilter==='male'?'male':'female'} players shown (set gender on the roster to include someone)</span>}
          </div>
          {available.length>0&&<button onClick={addAllShown} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700 mb-2">+ Add all shown ({available.length})</button>}
          {roster===null
            ? <p className="text-sm text-gray-400 py-6 text-center">Loading players…</p>
            : rosterErr
              ? <p className="text-sm text-red-600 py-4 text-center">{rosterErr}</p>
              : (
            <div className="grid sm:grid-cols-2 gap-1.5 max-h-[32vh] overflow-y-auto pr-1">
              {available.map(p=>(
                <button key={p.name} onClick={()=>add(p.name)} className="flex items-center justify-between gap-2 px-3 py-2 rounded-xl border border-gray-200 bg-white hover:bg-gray-50 text-left">
                  <span className="flex items-center gap-2 min-w-0"><span className="text-gray-300 flex-shrink-0">＋</span><span className="text-sm font-semibold text-gray-800 truncate">{p.name}{p.guest&&<span className="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded" style={{background:'#f1f5f9',color:'#64748b'}}>GUEST</span>}{p.gender&&<span className="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded" style={p.gender==='male'?{background:'#dbeafe',color:'#1d4ed8'}:p.gender==='female'?{background:'#fce7f3',color:'#be185d'}:{background:'#f1f5f9',color:'#64748b'}}>{p.gender==='male'?'M':p.gender==='female'?'F':'O'}</span>}</span></span>
                  <span className="text-xs font-mono font-bold text-gray-400 flex-shrink-0">{fmtR(p.rating)}</span>
                </button>
              ))}
              {available.length===0&&<p className="text-sm text-gray-400 py-4 text-center sm:col-span-2">{search?`No one matches “${search}”.`:'Everyone on the roster is already in.'}</p>}
            </div>
          )}

          <div className="mt-4">
            {roundRobin
              ? <button onClick={generate} disabled={!courtsValid} className="w-full py-3 rounded-xl text-white font-black disabled:opacity-40" style={{background:CORAL_DARK}}>{courtsValid?`Generate courts — ${selCount} players · ${courtsNum} court${courtsNum>1?'s':''} →`:'Generate courts →'}</button>
              : isMixer
                ? (dynRounds.length===0
                    ? <button onClick={generateMixer} disabled={!dynCourtsValid} className="w-full py-3 rounded-xl text-white font-black disabled:opacity-40" style={{background:CORAL_DARK}}>{dynCourtsValid?`Generate ${mixerRoundCount} mixer rounds — ${selCount} players · ${courtsNum} court${courtsNum>1?'s':''} →`:'Generate mixer rounds →'}</button>
                    : <button onClick={generateMixer} className="w-full py-3 rounded-xl text-white font-black" style={{background:CORAL_DARK}}>↻ Re-shuffle all {mixerRoundCount} rounds</button>)
                : dynRounds.length===0
                  ? <button onClick={startNextRound} disabled={!dynCourtsValid} className="w-full py-3 rounded-xl text-white font-black disabled:opacity-40" style={{background:CORAL_DARK}}>{dynCourtsValid?`Start round 1 — ${selCount} players · ${courtsNum} court${courtsNum>1?'s':''} →`:'Start round 1 →'}</button>
                  : <p className="text-xs text-gray-400 text-center">Session in progress — manage rounds below. Editing the player list here affects future rounds.</p>}
            {genErr&&<p className="text-sm text-red-600 mt-2 text-center">{genErr}</p>}
          </div>
        </div>

        {/* Generated schedule */}
        {schedule&&(
          <div id="soc-schedule" className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
            <div className="flex items-center justify-between mb-1 gap-2 flex-wrap">
              <h3 className="text-sm font-black" style={{color:INK}}>Courts — {fmtFull(date)}</h3>
              {loadedPlan&&<span className="text-[11px] font-bold px-2 py-0.5 rounded-full" style={{background:'var(--coral-fill)',color:CORAL_DARK}}>Saved plan loaded</span>}
            </div>
            <div className="flex items-center gap-2 mb-4 flex-wrap">
              <p className="text-xs text-gray-500">{courtMode==='ability'?'Court 1 is the strongest group.':'Courts are ability-balanced (a spread on each).'} {scored?'Enter scores as games finish; standings update live.':'Scoring is off — print the slips and play socially.'} <span className="text-gray-400">Someone arrive late or leave? Add/remove them above and re-generate.</span></p>
              <span className="text-[11px] font-bold px-2 py-0.5 rounded-full capitalize ml-auto" style={status==='complete'?{background:'rgba(16,185,129,0.12)',color:'#047857'}:status==='live'?{background:'var(--coral-fill)',color:CORAL_DARK}:{background:'#f1f5f9',color:'#475569'}}>{status}</span>
            </div>
            {scoring.timed&&(
              <div className="mb-5">
                <label className="flex items-center gap-2 text-xs font-semibold text-gray-500 cursor-pointer mb-2 w-fit">
                  <button type="button" onClick={()=>setShowTimer(v=>!v)} role="switch" aria-checked={showTimer} aria-label="Show round timer" className="relative inline-flex h-5 w-9 flex-shrink-0 rounded-full transition-colors" style={{background:showTimer?GREEN:'#cbd5e1'}}>
                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform mt-0.5 ${showTimer?'translate-x-4':'translate-x-0.5'}`}/>
                  </button>
                  Show timer
                </label>
                <div style={{display:showTimer?'block':'none'}}><RoundTimer minutes={scoring.round_minutes||15} scored={scored}/></div>
              </div>
            )}
            <div className="space-y-5">
              {schedule.courts.map(ct=>(
                <div key={ct.court} className="border border-gray-200 rounded-xl overflow-hidden">
                  <div className="px-4 py-2.5 flex items-center justify-between" style={{background:NAVY}}>
                    <span className="text-white font-black text-sm">Court {ct.court}</span>
                    <span className="text-white/70 text-xs font-semibold">{ct.players.length} players · {ct.games.length} games</span>
                  </div>
                  <div className="divide-y divide-gray-100">
                    {ct.games.map(g=>{const k=`${ct.court}-${g.round}`; const sc=scores[k]||{}; return(
                      <div key={g.round} className="px-3 py-2.5 flex items-center gap-2 text-sm flex-wrap">
                        <span className="text-[11px] font-bold text-gray-400 w-7 flex-shrink-0">R{g.round}</span>
                        <span className="font-semibold text-gray-800 flex-1 min-w-[110px] text-right">{g.teamA.join(' & ')}</span>
                        {scored?<>
                          <input value={sc.s1||''} onChange={e=>setScore(k,'s1',e.target.value)} inputMode="numeric" placeholder="—" aria-label={`Court ${ct.court} round ${g.round} — ${g.teamA.join(' & ')} score`} className="w-11 text-center border border-gray-200 rounded-lg px-1 py-1.5 text-sm font-mono font-bold focus:outline-none focus:border-orange-400"/>
                          <span className="text-gray-300 font-bold">–</span>
                          <input value={sc.s2||''} onChange={e=>setScore(k,'s2',e.target.value)} inputMode="numeric" placeholder="—" aria-label={`Court ${ct.court} round ${g.round} — ${g.teamB.join(' & ')} score`} className="w-11 text-center border border-gray-200 rounded-lg px-1 py-1.5 text-sm font-mono font-bold focus:outline-none focus:border-orange-400"/>
                        </>:<span className="text-gray-300 font-bold px-2">vs</span>}
                        <span className="font-semibold text-gray-800 flex-1 min-w-[110px]">{g.teamB.join(' & ')}</span>
                        {Array.isArray(g.sitOut)&&g.sitOut.length>0&&<span className="text-[11px] text-gray-400 w-full text-center">sitting out: <span className="font-semibold text-gray-500">{g.sitOut.join(', ')}</span></span>}
                      </div>
                    );})}
                  </div>
                </div>
              ))}
            </div>

            {/* Live standings */}
            {standings.length>0&&scoredCount>0&&(
              <div className="mt-6">
                <h4 className="text-sm font-black mb-1" style={{color:INK}}>Standings <span className="text-xs font-semibold text-gray-400">— {scoredCount} game{scoredCount>1?'s':''} in · wins, then point difference</span></h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm border-separate" style={{borderSpacing:0}}>
                    <thead><tr className="text-[11px] uppercase tracking-wide text-gray-400">
                      <th className="text-left font-bold py-1.5 pr-2">#</th><th className="text-left font-bold py-1.5 pr-2">Player</th>
                      <th className="text-center font-bold py-1.5 px-1.5">P</th><th className="text-center font-bold py-1.5 px-1.5">W</th>
                      <th className="text-center font-bold py-1.5 px-1.5">L</th><th className="text-center font-bold py-1.5 px-1.5">Diff</th><th className="text-center font-bold py-1.5 px-1.5">Pts</th>
                    </tr></thead>
                    <tbody>
                      {standings.map((p,i)=>(
                        <tr key={p.name} className="border-t border-gray-100">
                          <td className="py-1.5 pr-2 font-black tabular-nums" style={{color:i===0?SOCIAL_DARK:'#94a3b8'}}>{i+1}</td>
                          <td className="py-1.5 pr-2 font-semibold text-gray-800">{p.name}{guestOf(p.name)&&<span className="ml-1.5 text-[9px] font-bold px-1 py-0.5 rounded" style={{background:'#f1f5f9',color:'#64748b'}}>GUEST</span>}</td>
                          <td className="py-1.5 px-1.5 text-center text-gray-500 tabular-nums">{p.games}</td>
                          <td className="py-1.5 px-1.5 text-center font-bold tabular-nums" style={{color:GREEN}}>{p.wins}</td>
                          <td className="py-1.5 px-1.5 text-center text-gray-500 tabular-nums">{p.losses}</td>
                          <td className="py-1.5 px-1.5 text-center font-semibold tabular-nums" style={{color:p.diff>0?GREEN:p.diff<0?'#dc2626':'#94a3b8'}}>{p.diff>0?'+':''}{p.diff}</td>
                          <td className="py-1.5 px-1.5 text-center text-gray-500 tabular-nums">{p.pf}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {msg.text&&<div aria-live="polite" className={`mt-4 px-3 py-2 rounded-xl text-sm ${msg.type==='error'?'bg-red-50 text-red-600':msg.type==='ok'?'bg-green-50 text-green-700':'bg-blue-50 text-blue-700'}`}>{msg.text}</div>}
            {/* Publish to members */}
            <div className="mt-4 flex items-center justify-between gap-3 rounded-xl px-4 py-3 border" style={{borderColor:published?GREEN:'#e2e8f0',background:published?'rgba(16,185,129,0.06)':'#f9fafb'}}>
              <div className="min-w-0">
                <div className="text-sm font-bold flex items-center gap-1.5" style={{color:INK}}>👁 Show members this session {published&&<span className="text-[11px] font-black px-2 py-0.5 rounded-full text-white" style={{background:GREEN}}>LIVE</span>}</div>
                <div className="text-xs text-gray-500">Publishes the line-up{scored?' and results':''} on the public Social page. Nothing shows to members until you do.</div>
              </div>
              <button onClick={togglePublish} disabled={busy} role="switch" aria-checked={published} aria-label="Publish session to members" className="relative inline-flex h-7 w-12 flex-shrink-0 rounded-full transition-colors disabled:opacity-50" style={{background:published?GREEN:'#cbd5e1'}}>
                <span className={`inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform mt-0.5 ${published?'translate-x-5':'translate-x-0.5'}`}/>
              </button>
            </div>
            <div className="mt-4 flex gap-2 flex-wrap items-center">
              <button onClick={()=>setSlipsOpen(true)} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white" style={{background:NAVY}}>🖨️ Print / PDF court slips</button>
              <button onClick={()=>savePlan()} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white disabled:opacity-50" style={{background:CORAL_DARK}}>{busy?'Saving…':(scoredCount>0?'Save scores':'Save plan')}</button>
              {status!=='complete'
                ? <button onClick={()=>savePlan('complete')} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50 ml-auto">Mark complete</button>
                : <button onClick={()=>savePlan('live')} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50 ml-auto">Reopen</button>}
            </div>
            <p className="text-[11px] text-gray-400 text-center mt-3">Social scores stay in this session — they never affect graded RDR ratings.</p>
          </div>
        )}

        {/* Dynamic rounds (king / ladder / mexicano) */}
        {isDynamic&&dynRounds.length>0&&(
          <div id="soc-rounds" className="space-y-4">
            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
              <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
                <h3 className="text-sm font-black" style={{color:INK}}>{SOCIAL_FORMATS[session.format]} — round {dynRounds.length}</h3>
                <span className="text-[11px] font-bold px-2 py-0.5 rounded-full capitalize" style={status==='complete'?{background:'rgba(16,185,129,0.12)',color:'#047857'}:status==='live'?{background:'var(--coral-fill)',color:CORAL_DARK}:{background:'#f1f5f9',color:'#475569'}}>{status}</span>
              </div>
              {scoring.timed&&(
                <div className="mb-4">
                  <label className="flex items-center gap-2 text-xs font-semibold text-gray-500 cursor-pointer mb-2 w-fit">
                    <button type="button" onClick={()=>setShowTimer(v=>!v)} role="switch" aria-checked={showTimer} aria-label="Show round timer" className="relative inline-flex h-5 w-9 flex-shrink-0 rounded-full transition-colors" style={{background:showTimer?GREEN:'#cbd5e1'}}>
                      <span className={`inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform mt-0.5 ${showTimer?'translate-x-4':'translate-x-0.5'}`}/>
                    </button>Show timer
                  </label>
                  <div style={{display:showTimer?'block':'none'}}><RoundTimer minutes={scoring.round_minutes||15} scored={scored}/></div>
                </div>
              )}
              <div className="space-y-4">
                {dynRounds.map((rd,ri)=>{
                  const latest=ri===dynRounds.length-1;
                  return(
                    <div key={ri} className="border rounded-xl overflow-hidden" style={{borderColor:latest?'var(--coral)':'#e5e7eb'}}>
                      <div className="px-4 py-2 flex items-center justify-between gap-2" style={{background:latest?CORAL_DARK:'#64748b'}}>
                        <span className="text-white font-black text-sm">Round {ri+1}{latest?' · current':''}</span>
                        {rd.sitOut&&rd.sitOut.length>0&&<span className="text-white/80 text-[11px] truncate">sitting: {rd.sitOut.join(', ')}</span>}
                      </div>
                      <div className="divide-y divide-gray-100">
                        {rd.games.map(g=>{const k=`${ri}-${g.court}`; const sc=dynScores[k]||{}; return(
                          <div key={g.court} className="px-3 py-2.5 flex items-center gap-2 text-sm flex-wrap">
                            <span className="text-[11px] font-bold text-gray-400 w-14 flex-shrink-0">Court {g.court}</span>
                            <span className="font-semibold text-gray-800 flex-1 min-w-[100px] text-right">{g.teamA.join(' & ')}</span>
                            {scored?<>
                              <input value={sc.s1||''} onChange={e=>dynSetScore(ri,g.court,'s1',e.target.value)} inputMode="numeric" placeholder="—" aria-label={`Round ${ri+1} court ${g.court} — ${g.teamA.join(' & ')} score`} className="w-11 text-center border border-gray-200 rounded-lg px-1 py-1.5 text-sm font-mono font-bold focus:outline-none focus:border-orange-400"/>
                              <span className="text-gray-300 font-bold">–</span>
                              <input value={sc.s2||''} onChange={e=>dynSetScore(ri,g.court,'s2',e.target.value)} inputMode="numeric" placeholder="—" aria-label={`Round ${ri+1} court ${g.court} — ${g.teamB.join(' & ')} score`} className="w-11 text-center border border-gray-200 rounded-lg px-1 py-1.5 text-sm font-mono font-bold focus:outline-none focus:border-orange-400"/>
                            </>:<span className="text-gray-300 font-bold px-2">vs</span>}
                            <span className="font-semibold text-gray-800 flex-1 min-w-[100px]">{g.teamB.join(' & ')}</span>
                          </div>
                        );})}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="mt-4 flex gap-2 flex-wrap items-center">
                <button onClick={()=>setSlipsOpen(true)} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white" style={{background:NAVY}}>🖨️ Print {isMixer?'all '+dynRounds.length+' rounds':'current round'}</button>
                {isMixer
                  ? <button onClick={generateMixer} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white" style={{background:CORAL_DARK}}>↻ Re-shuffle rounds</button>
                  : <button onClick={startNextRound} disabled={scored&&!roundDone(dynRounds.length-1)} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white disabled:opacity-40" style={{background:CORAL_DARK}}>Generate round {dynRounds.length+1} →</button>}
                {dynRounds.length>0&&!isMixer&&<button onClick={undoLastRound} className="px-3 py-2.5 rounded-xl text-sm font-semibold text-gray-500 hover:bg-gray-100 ml-auto">Undo last round</button>}
              </div>
              {scored&&!roundDone(dynRounds.length-1)&&<p className="text-[11px] text-gray-400 mt-2">Enter all of round {dynRounds.length}’s scores to generate the next round.</p>}
              {genErr&&<p className="text-sm text-red-600 mt-2">{genErr}</p>}
            </div>

            {scored&&dynStand.some(p=>p.games>0)&&(
              <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
                <h4 className="text-sm font-black mb-1" style={{color:INK}}>Standings <span className="text-xs font-semibold text-gray-400">— {session.format==='mexicano'?'by points':'by wins'}</span></h4>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm"><thead><tr className="text-[11px] uppercase tracking-wide text-gray-400 text-left">
                    <th className="py-1.5 pr-2">#</th><th className="py-1.5 pr-2">Player</th><th className="py-1.5 px-1.5 text-center">P</th><th className="py-1.5 px-1.5 text-center">W</th><th className="py-1.5 px-1.5 text-center">Diff</th><th className="py-1.5 px-1.5 text-center">Pts</th></tr></thead>
                    <tbody>{dynStand.filter(p=>p.games>0).map((p,i)=>(<tr key={p.name} className="border-t border-gray-100">
                      <td className="py-1.5 pr-2 font-black tabular-nums" style={{color:i===0?SOCIAL_DARK:'#94a3b8'}}>{i+1}</td>
                      <td className="py-1.5 pr-2 font-semibold text-gray-800">{p.name}{guestOf(p.name)&&<span className="ml-1.5 text-[9px] font-bold px-1 py-0.5 rounded" style={{background:'#f1f5f9',color:'#64748b'}}>GUEST</span>}</td>
                      <td className="py-1.5 px-1.5 text-center text-gray-500 tabular-nums">{p.games}</td>
                      <td className="py-1.5 px-1.5 text-center font-bold tabular-nums" style={{color:GREEN}}>{p.wins}</td>
                      <td className="py-1.5 px-1.5 text-center tabular-nums" style={{color:p.diff>0?GREEN:p.diff<0?'#dc2626':'#94a3b8'}}>{p.diff>0?'+':''}{p.diff}</td>
                      <td className="py-1.5 px-1.5 text-center font-semibold tabular-nums" style={{color:INK}}>{p.pf}</td>
                    </tr>))}</tbody>
                  </table>
                </div>
              </div>
            )}

            <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
              {msg.text&&<div aria-live="polite" className={`mb-3 px-3 py-2 rounded-xl text-sm ${msg.type==='error'?'bg-red-50 text-red-600':msg.type==='ok'?'bg-green-50 text-green-700':'bg-blue-50 text-blue-700'}`}>{msg.text}</div>}
              <div className="flex items-center justify-between gap-3 rounded-xl px-4 py-3 border" style={{borderColor:published?GREEN:'#e2e8f0',background:published?'rgba(16,185,129,0.06)':'#f9fafb'}}>
                <div className="min-w-0">
                  <div className="text-sm font-bold flex items-center gap-1.5" style={{color:INK}}>👁 Show members this session {published&&<span className="text-[11px] font-black px-2 py-0.5 rounded-full text-white" style={{background:GREEN}}>LIVE</span>}</div>
                  <div className="text-xs text-gray-500">Publishes the current line-up{scored?' and standings':''} on the public Social page.</div>
                </div>
                <button onClick={togglePublish} disabled={busy} role="switch" aria-checked={published} aria-label="Publish session to members" className="relative inline-flex h-7 w-12 flex-shrink-0 rounded-full transition-colors disabled:opacity-50" style={{background:published?GREEN:'#cbd5e1'}}>
                  <span className={`inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform mt-0.5 ${published?'translate-x-5':'translate-x-0.5'}`}/>
                </button>
              </div>
              <div className="mt-4 flex gap-2 flex-wrap items-center">
                <button onClick={()=>savePlan()} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white disabled:opacity-50" style={{background:CORAL_DARK}}>{busy?'Saving…':'Save'}</button>
                {status!=='complete'
                  ? <button onClick={()=>savePlan('complete')} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50 ml-auto">Mark complete</button>
                  : <button onClick={()=>savePlan('live')} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50 ml-auto">Reopen</button>}
              </div>
              <p className="text-[11px] text-gray-400 text-center mt-3">Social scores stay in this session — they never affect graded RDR ratings.</p>
            </div>
          </div>
        )}

        {!schedule&&dynRounds.length===0&&(
          <div className="flex justify-end">
            <button onClick={()=>savePlan()} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50">{busy?'Saving…':'Save attendees'}</button>
          </div>
        )}
        {!schedule&&dynRounds.length===0&&msg.text&&<div aria-live="polite" className={`px-3 py-2 rounded-xl text-sm ${msg.type==='error'?'bg-red-50 text-red-600':msg.type==='ok'?'bg-green-50 text-green-700':'bg-blue-50 text-blue-700'}`}>{msg.text}</div>}
      </main>
      {slipsOpen&&<PlayslipsOverlay courts={
        roundRobin ? (schedule?schedule.courts:[])
        : (isMixer&&dynRounds.length) ? Array.from({length:dynRounds[0].games.length},(_,i)=>({
            court:i+1,
            players:[...new Set(dynRounds.flatMap(rd=>{const g=rd.games[i];return g?[...g.teamA,...g.teamB]:[];}))].map(n=>({name:n})),
            games:dynRounds.map((rd,ri)=>({round:ri+1,teamA:rd.games[i].teamA,teamB:rd.games[i].teamB,sitOut:rd.sitOut||[]}))
          }))
        : (dynRounds.length?dynRounds[dynRounds.length-1].games.map(g=>({court:g.court,players:[...g.teamA,...g.teamB].map(n=>({name:n})),games:[{round:dynRounds.length,teamA:g.teamA,teamB:g.teamB,sitOut:dynRounds[dynRounds.length-1].sitOut||[]}]})):[])
      } clubName={clubName} date={date} scored={scored} onClose={()=>setSlipsOpen(false)}/>}
      {editing&&<SocialCreateModal session={session} lockFormat={(!!schedule&&schedule.courts.length>0)||dynRounds.length>0} defaultPricePennies={defaultPricePennies} onSaveDefaultPrice={onSaveDefaultPrice} onClose={()=>setEditing(false)} onCreated={(row)=>{ setEditing(false); if(row){ setStatus(row.status||status); onEdited&&onEdited(row); } }}/>}
      {manageName&&(
        <div className="fixed inset-0 z-[55] flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm" onClick={e=>{if(e.target===e.currentTarget)setManageName(null);}}>
          <div role="dialog" aria-modal="true" className="bg-white rounded-3xl shadow-2xl w-full max-w-sm p-6 space-y-4">
            <div className="flex items-center justify-between">
              <h2 className="text-lg font-black" style={{color:INK}}>{manageName}</h2>
              <button onClick={()=>setManageName(null)} aria-label="Close" className="w-9 h-9 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500">✕</button>
            </div>
            <p className="text-xs text-gray-500">{guestOf(manageName)?'A guest / drop-in. Give them a starting rating to keep them on the roster as a member.':'Non-ranked player — set a starting rating so they seed correctly.'}</p>
            <label className="block"><span className="text-xs font-semibold text-gray-600">Starting rating (2–8)</span>
              <input value={manageRating} onChange={e=>setManageRating(e.target.value)} inputMode="decimal" placeholder="e.g. 3.5" className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400"/></label>
            <label className="block"><span className="text-xs font-semibold text-gray-600">Gender (optional)</span>
              <select value={manageGender} onChange={e=>setManageGender(e.target.value)} className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-orange-400">
                <option value="">Not set</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option>
              </select>
              <span className="block text-[11px] text-gray-400 mt-0.5">Used only to arrange mixed / men's / women's sessions.</span></label>
            {manageErr&&<p className="text-sm text-red-600">{manageErr}</p>}
            <div className="flex gap-2">
              <button onClick={()=>saveManage(false)} disabled={manageBusy} className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50">Save</button>
              {guestOf(manageName)&&<button onClick={()=>saveManage(true)} disabled={manageBusy} className="flex-1 py-2.5 rounded-xl text-sm font-bold text-white disabled:opacity-50" style={{background:CORAL_DARK}}>{manageBusy?'Saving…':'Keep as member'}</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── APP ───────────────────────────────────────────────────── */
function App(){
  const[sessions,setSessions]=useState([]);
  const[initialRatings,setInitialRatings]=useState({});
  const[clubName,setClubName]=useState('PBTable');
  const[logoUrl,setLogoUrl]=useState('');
  const[player,setPlayer]=useState('All Players');
  const[page,setPage]=useState('leaderboard'); // 'leaderboard' | 'players' | 'sessions' | 'about'
  const[sessionDate,setSessionDate]=useState('');
  const[adminOpen,setAdminOpen]=useState(false);
  const[builderOpen,setBuilderOpen]=useState(false);
  const[builderDate,setBuilderDate]=useState('');
  // Reactive admin flag for gating the Social UI (create/organise). The real gate is RLS +
  // the admin JWT; this just controls what's shown. Re-checked whenever the Admin panel closes
  // (that's where sign-in / sign-out happen).
  const[isAdmin,setIsAdmin]=useState(!!sbToken());
  const[socialSession,setSocialSession]=useState(null); // the social session open in the builder
  // Deep-links from the booking app: ?admin=1 opens admin; ?graded=<date> opens the
  // graded builder for that session; ?social=<id> opens that social session's builder.
  useEffect(()=>{
    try{
      const q=new URLSearchParams(location.search);
      if(q.get('admin')==='1') setAdminOpen(true);
      const g=q.get('graded');
      if(g){ setBuilderDate(g); setBuilderOpen(true); }
      const s=q.get('social');
      if(s){ (async()=>{ try{ const list=await sbSocialSessions(); const found=(list||[]).find(x=>String(x.id)===String(s)); if(found) setSocialSession(found); }catch(e){} })(); }
    }catch(e){}
  },[]);
  const[settings,setSettings]=useState(DEFAULT_SETTINGS); // per-club display settings (clubs.settings)
  const[publishedPlan,setPublishedPlan]=useState(null);   // latest published next-session line-up (public)
  const[exporting,setExporting]=useState(false);
  const[theme,setThemeState]=useState(()=>{try{return localStorage.getItem('pb_theme')||'bold-sporty';}catch(e){return 'bold-sporty';}});
  const handleTheme=k=>{applyTheme(k);setThemeState(k);}; // persist + re-render (so Chart.js recolours)
  const lastLight=useRef('bold-sporty');
  const toggleDark=()=>{ if(theme==='midnight-court'){handleTheme(lastLight.current||'bold-sporty');} else {lastLight.current=theme;handleTheme('midnight-court');} };
  const[dismissed,setDismissed]=useState(()=>LS.getDismissed());
  const[loadState,setLoadState]=useState('loading');
  const[loadError,setLoadError]=useState('');
  const[bgWarning,setBgWarning]=useState('');

  const loadFromAirtable=useCallback(async(background=false)=>{
    if(!background) setLoadState('loading');
    try{
      // Players table: an optional initial_4dr number field there is the authoritative,
      // shared source of starting ratings (works across devices, unlike localStorage).
      const precs=await atFetchAll(AT_PLAYERS);
      const atRatings={};
      precs.forEach(r=>{
        const f=r.fields||{};
        const n=f.PlayerName, v=Number(f.initial_4dr);
        if(n&&!isNaN(v)&&v>0) atRatings[String(n).trim()]=v;
      });
      // Fetch all Weekly Results (player1-4 are plain text, not linked records)
      const mrecs=await atFetchAll(AT_RESULTS);
      const byDate={};let skipped=0;
      mrecs.forEach(r=>{
        const f=r.fields,iso=normDate(f.playdate);
        const p1=String(f.player1||''),p2=String(f.player2||'');
        const p3=String(f.player3||''),p4=String(f.player4||'');
        const s1=Number(f.score1),s2=Number(f.score2);
        if(!iso||!p1||!p2||!p3||!p4||isNaN(s1)||isNaN(s2)||s1<0||s2<0){skipped++;return;}
        if(!byDate[iso])byDate[iso]=[];
        byDate[iso].push({id:r.id,p1,p2,p3,p4,s1,s2});
      });
      const parsed=Object.entries(byDate)
        .sort(([a],[b])=>a.localeCompare(b))
        .map(([date,matches])=>({date,matches}));
      setSessions(parsed);
      // Starting ratings = the PBR baseline seed (SEED_RATINGS), overridden only by an
      // authoritative per-player Airtable `initial_4dr`. The legacy localStorage override is
      // RETIRED — it could silently shadow the baseline — and any stale copy is purged here so
      // every browser self-heals to the agreed line in the sand.
      try{localStorage.removeItem('pb_initial_ratings');}catch(e){}
      setInitialRatings({...SEED_RATINGS,...atRatings});
      // Club display meta from the DB (name + per-club settings) → propagates to ALL viewers,
      // not just the admin's device. Falls back to the local cache if the fetch fails.
      try{
        const meta=await sbClubMeta();
        const st={...DEFAULT_SETTINGS,...((meta&&meta.settings)||{})};
        setSettings(st);
        setClubName((meta&&meta.name)||LS.getClubName());
        setLogoUrl(st.logo_url||LS.getLogoUrl());
        if(st.theme){ applyTheme(st.theme); setThemeState(st.theme); }
      }catch(e){ setClubName(LS.getClubName()); setLogoUrl(LS.getLogoUrl()); }
      try{ setPublishedPlan(await sbPublishedPlan()); }catch(e){ setPublishedPlan(null); }
      setBgWarning(skipped>0?`${skipped} Airtable record(s) were ignored due to a bad date or score.`:'');
      setLoadState('ready');
    }catch(e){
      if(!background){setLoadError(e.message);setLoadState('error');}
      else setBgWarning('Reload failed — the view may be out of date. Refresh the page to retry.');
    }
  },[]);
  useEffect(()=>{loadFromAirtable();},[]);
  // Per-club browser-tab title + social meta. Crawlers (WhatsApp/Messages) see the static PBTable
  // default in <head>; this fills the club's real name for actual visitors once the club loads.
  useEffect(()=>{
    if(!clubName) return;
    document.title=`${clubName} · PBTable`;
    const set=(sel,val)=>{const el=document.querySelector(sel); if(el) el.setAttribute('content',val);};
    set('meta[name="description"]',`${clubName} — live pickleball ratings, session line-ups and social play on PBTable.`);
    set('meta[property="og:title"]',`${clubName} · PBTable`);
    set('meta[name="twitter:title"]',`${clubName} · PBTable`);
  },[clubName]);

  const computed=useMemo(()=>replayAllSessions(initialRatings,sessions),[initialRatings,sessions]);

  // Default-session logic lives below, after `latestDate` (auto-follow effect).

  const allPlayers=useMemo(()=>{
    // Only players who have actually played a recorded game are selectable.
    const names=new Set(Object.keys(computed.matchLog));
    return['All Players',...Array.from(names).sort()];
  },[computed]);

  const latestDate=computed.snapshots.length?computed.snapshots[computed.snapshots.length-1].date:'';

  // Land on the MOST RECENT session by default, and keep following it as data finishes loading
  // or new sessions are uploaded — until the user manually picks a different session, after which
  // we stop auto-following. (Fixes the bug where it locked onto the empty-load baseline snapshot.)
  const autoSessionDate=useRef('');
  useEffect(()=>{
    if(!latestDate) return;
    if(sessionDate===''||sessionDate===autoSessionDate.current){
      autoSessionDate.current=latestDate;
      if(sessionDate!==latestDate) setSessionDate(latestDate);
    }
  },[latestDate,sessionDate]);

  // ── Routing: the URL hash is the source of truth for which page is shown ──
  //   #/                leaderboard (latest)      #/players          players directory
  //   #/players/<name>  a player profile          #/sessions         sessions list
  //   #/sessions/<date> leaderboard at a session  #/about            how RDR works
  const applyHash=useCallback(()=>{
    // Social-only tier: the whole public app IS the Social page — ignore any graded hash.
    if((settings.tier||'full')==='social'){ setPage('social'); setPlayer('All Players'); return; }
    const raw=location.hash.replace(/^#\/?/,'');
    const slash=raw.indexOf('/');
    const seg=slash<0?raw:raw.slice(0,slash);
    const sub=slash<0?'':decodeURIComponent(raw.slice(slash+1));
    if(seg==='players'&&sub){ if(allPlayers.includes(sub)){setPage('leaderboard');setPlayer(sub);} else setPage('players'); }
    else if(seg==='players'){ setPage('players'); setPlayer('All Players'); }
    else if(seg==='sessions'&&sub){ if(computed.snapshots.find(x=>x.date===sub)){setPage('leaderboard');setPlayer('All Players');setSessionDate(sub);} else setPage('sessions'); }
    else if(seg==='sessions'){ setPage('sessions'); }
    else if(seg==='about'){ setPage('about'); }
    else if(seg==='next'){ setPage('next'); setPlayer('All Players'); }
    else if(seg==='social'){ setPage('social'); setPlayer('All Players'); }
    else { setPage('leaderboard'); setPlayer('All Players'); }
  },[computed,allPlayers,settings.tier]);
  useEffect(()=>{ if(loadState==='ready') applyHash(); },[loadState]);
  useEffect(()=>{
    const onHash=()=>applyHash();
    window.addEventListener('hashchange',onHash);
    return()=>window.removeEventListener('hashchange',onHash);
  },[applyHash]);
  useEffect(()=>{
    if(loadState!=='ready') return;
    let nh='#/';
    if(page==='players') nh='#/players';
    else if(page==='sessions') nh='#/sessions';
    else if(page==='about') nh='#/about';
    else if(page==='next') nh='#/next';
    else if(page==='social') nh='#/social';
    else if(player!=='All Players') nh='#/players/'+encodeURIComponent(player);
    else if(sessionDate&&sessionDate!==latestDate) nh='#/sessions/'+sessionDate;
    if(location.hash!==nh) history.replaceState(null,'',nh);
  },[page,player,sessionDate,loadState,latestDate]);
  // Belt-and-braces: if a social-only club's settings arrive after the first route, snap to Social.
  useEffect(()=>{
    if(loadState==='ready' && (settings.tier||'full')==='social' && page!=='social'){ setPage('social'); setPlayer('All Players'); }
  },[loadState,settings.tier,page]);

  // Single navigation entry point for the nav bar, breadcrumbs and in-page links.
  const go=useCallback((p,opt)=>{
    if(p==='player'){ setPage('leaderboard'); setPlayer(opt); }
    else if(p==='session'){ setPage('leaderboard'); setPlayer('All Players'); setSessionDate(opt); }
    else if(p==='leaderboard'){ setPage('leaderboard'); setPlayer('All Players'); if(latestDate) setSessionDate(latestDate); }
    else { setPage(p); setPlayer('All Players'); }
    if(typeof window!=='undefined') window.scrollTo(0,0);
  },[latestDate]);

  // Which nav tab is highlighted (a profile or an older session still belongs to Players/Sessions).
  const navKey = page!=='leaderboard' ? page
    : (player!=='All Players' ? 'players'
       : (sessionDate&&sessionDate!==latestDate ? 'sessions' : 'leaderboard'));
  // Which "world" is on screen. Graded is everything except the Social section, so all existing
  // graded chrome (nav, breadcrumbs, next-session banner) is gated to graded and stays untouched.
  // Tier gate: a 'social'-tier club has all graded features hidden (a paid upgrade to 'full'
  // unlocks them). Absent/'full' tier ⇒ graded on, so existing clubs are unaffected.
  const gradedEnabled = (settings.tier||'full')!=='social';
  const mode = (!gradedEnabled || page==='social') ? 'social' : 'graded';

  const crumbs = (()=>{
    const home={label:'Home',onClick:()=>go('leaderboard')};
    if(page==='players') return [home,{label:'Players'}];
    if(page==='sessions') return [home,{label:'Sessions'}];
    if(page==='about') return [home,{label:'About'}];
    if(player!=='All Players') return [home,{label:'Players',onClick:()=>go('players')},{label:player}];
    if(sessionDate&&sessionDate!==latestDate) return [home,{label:'Sessions',onClick:()=>go('sessions')},{label:fmtFull(sessionDate)}];
    return [home,{label:'Leaderboard'}];
  })();

  const selectedSnapshot=useMemo(()=>computed.snapshots.find(s=>s.date===sessionDate)||computed.snapshots[computed.snapshots.length-1]||null,[computed,sessionDate]);
  const latestSnap=computed.snapshots[computed.snapshots.length-1]||null;
  // Current rating per player (latest snapshot) → used to rank the next session's courts.
  const ratingsByName=useMemo(()=>{const m={};(latestSnap?.players||[]).forEach(p=>{m[p.name]=p.rating;});return m;},[latestSnap]);

  const knownPlayers=useMemo(()=>{
    const n=new Set(Object.keys(initialRatings));
    sessions.forEach(s=>s.matches.forEach(m=>[m.p1,m.p2,m.p3,m.p4].forEach(p=>n.add(p))));
    return Array.from(n).sort();
  },[initialRatings,sessions]);

  const handleSessions=v=>{setSessions(v);LS.saveSessions(v);if(!v.find(s=>s.date===sessionDate)&&v.length)setSessionDate(v[v.length-1].date);if(!v.length)setSessionDate('');};
  const handleRatings=v=>{setInitialRatings({...SEED_RATINGS,...v});}; // merge over the PBR baseline so an import never drops seeded players; session-only (not persisted to localStorage)
  // Persist a partial settings change to clubs.settings (best-effort; only when signed in as admin).
  const persistSettings=useCallback((partial)=>{
    setSettings(prev=>{ const next={...prev,...partial}; if(sbToken()){ sbSaveClub({settings:next}).catch(()=>{}); } return next; });
  },[]);
  const handleClubName=v=>{setClubName(v);LS.saveClubName(v);if(sbToken())sbSaveClub({name:v}).catch(()=>{});};
  const handleLogoUrl=v=>{setLogoUrl(v);LS.saveLogoUrl(v);persistSettings({logo_url:v});};
  const handleThemePick=k=>{handleTheme(k);persistSettings({theme:k});}; // admin theme picker → persists to club
  const handleSaveSettings=partial=>persistSettings(partial);
  const handleDismiss=id=>{const n=new Set(dismissed);n.add(id);setDismissed(n);LS.saveDismissed(n);};

  const handleExport=async(elementId='lb-export',suffix)=>{
    const el=document.getElementById(elementId);if(!el)return;
    setExporting(true);
    try{await ensureHtml2Canvas();const c=await html2canvas(el,{scale:2,backgroundColor:cssHex('var(--surface)'),logging:false});const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`${clubName.replace(/\s+/g,'-')}-${suffix||sessionDate}.png`;a.click();}
    catch(e){console.error(e);}
    setExporting(false);
  };
  // Native share (mobile): renders the element to PNG and opens the OS share sheet.
  const canShare=typeof navigator!=='undefined'&&!!navigator.share;
  const handleShare=async(elementId,suffix)=>{
    const el=document.getElementById(elementId);if(!el)return;
    setExporting(true);
    try{
      await ensureHtml2Canvas();
      const c=await html2canvas(el,{scale:2,backgroundColor:cssHex('var(--surface)'),logging:false});
      const blob=await new Promise(r=>c.toBlob(r,'image/png'));
      const file=new File([blob],`${clubName.replace(/\s+/g,'-')}-${suffix||sessionDate}.png`,{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[file]})) await navigator.share({files:[file],title:clubName});
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click();}
    }catch(e){ /* user cancelled the share sheet, or render failed */ }
    setExporting(false);
  };

  if(loadState==='loading') return(<div className="min-h-screen bg-gray-50 flex items-center justify-center"><Spinner/></div>);
  if(loadState==='error') return(<div className="min-h-screen bg-gray-50 flex items-center justify-center"><LoadError msg={loadError} onRetry={()=>loadFromAirtable()}/></div>);
  return(
    <ThemeContext.Provider value={theme}>
    <div className="min-h-screen bg-gray-50">
      {/* Header */}
      <header style={{background:NAVY}} className="sticky top-0 z-40 shadow-xl">
        <div className="max-w-6xl mx-auto px-4 py-3.5 flex items-center justify-between">
          <div className="flex items-center gap-3 min-w-0">
            {logoUrl
              ?<img src={logoUrl} alt={`${clubName} logo`} className="h-10 w-10 rounded-full object-cover ring-2 ring-white/20 flex-shrink-0" onError={e=>e.target.style.display='none'}/>
              :<PBLogo size={40}/>
            }
            <div className="min-w-0">
              <div className="text-white/50 text-xs font-semibold uppercase tracking-widest leading-none">{mode==='social'?'Social Play':'Pickleball League'}</div>
              <div className="text-white font-black text-base sm:text-lg leading-tight truncate">{clubName}</div>
            </div>
          </div>
          {gradedEnabled&&<ModeSwitch mode={mode} go={go} bookingEnabled={(settings&&settings.booking_enabled)!==false}/>}
          <div className="flex items-center gap-1 flex-shrink-0 ml-4">
            <button onClick={toggleDark} aria-label={theme==='midnight-court'?'Switch to light mode':'Switch to dark mode'} title={theme==='midnight-court'?'Light mode':'Dark mode'} className="p-2 rounded-lg text-white/70 hover:text-white hover:bg-white/10 transition-colors">
              {theme==='midnight-court'
                ?<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                :<svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>}
            </button>
            <button onClick={()=>setAdminOpen(true)} aria-label="Open admin panel" className="flex items-center gap-1.5 text-white/70 hover:text-white text-sm font-semibold transition-colors px-1">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              <span className="hidden sm:inline">Admin</span>
            </button>
          </div>
        </div>
        {mode==='graded'&&<NavBar navKey={navKey} go={go} showNext={!!publishedPlan} bookingEnabled={(settings&&settings.booking_enabled)!==false}/>}
        <div style={{background:mode==='social'?SOCIAL:CORAL,height:'3px'}}/>
      </header>
      {/* Breadcrumbs (graded only) */}
      {mode==='graded'&&<div className="bg-white border-b border-gray-100"><Breadcrumbs items={crumbs}/></div>}
      {/* Controls — leaderboard page only */}
      {page==='leaderboard'&&(
      <div className="bg-white border-b border-gray-100 shadow-sm">
        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-col sm:flex-row gap-3">
          <div className="flex-1">
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1">Player</label>
            <div className="relative">
              <select value={player} onChange={e=>setPlayer(e.target.value)} aria-label="Select player"
                className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 font-medium focus:outline-none focus:border-orange-400 appearance-none pr-8">
                {allPlayers.map(p=><option key={p} value={p}>{p}</option>)}
              </select>
              <svg className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
          {player==='All Players'&&computed.snapshots.length>0&&(
            <div className="flex-1">
              <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1">Session</label>
              <div className="relative">
                <select value={sessionDate} onChange={e=>setSessionDate(e.target.value)} aria-label="Select session"
                  className="w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-2.5 text-sm text-gray-800 font-medium focus:outline-none focus:border-orange-400 appearance-none pr-8">
                  {[...computed.snapshots].reverse().map(s=><option key={s.date} value={s.date}>{s.baseline?`Baseline — ${fmtFull(s.date)}`:fmtFull(s.date)}</option>)}
                </select>
                <svg className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7"/></svg>
              </div>
            </div>
          )}
        </div>
      </div>
      )}
      {/* Background reload / data warning */}
      {bgWarning&&(
        <div className="max-w-6xl mx-auto px-4 pt-3" role="alert">
          <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-sm text-amber-800 flex items-center justify-between gap-3">
            <span>{bgWarning}</span>
            <button onClick={()=>setBgWarning('')} aria-label="Dismiss notice" className="text-amber-600 hover:text-amber-800 font-black text-lg leading-none flex-shrink-0 px-1">×</button>
          </div>
        </div>
      )}
      {/* Main */}
      <main className="max-w-6xl mx-auto px-4 py-6 pb-12">
        {publishedPlan&&mode==='graded'&&page!=='next'&&(
          <button onClick={()=>go('next')} className="w-full mb-5 flex items-center justify-between gap-3 rounded-2xl px-4 py-3 text-white shadow-sm hover:opacity-95 transition-opacity" style={{background:NAVY}}>
            <span className="flex items-center gap-2 font-bold text-sm min-w-0"><span aria-hidden="true">📋</span><span className="truncate">Next Graded Session is out — see who you’re playing</span></span>
            <span className="text-white/70 flex-shrink-0">→</span>
          </button>
        )}
        {page==='social'&&<h1 className="osw text-2xl sm:text-3xl font-bold mb-4" style={{color:INK}}>Social Sessions</h1>}
        {page==='leaderboard'&&player==='All Players'&&<h1 className="osw text-2xl sm:text-3xl font-bold mb-4" style={{color:INK}}>Leaderboard</h1>}
        {page==='social'
          ?<SocialLanding clubName={clubName} settings={settings}/>
        :page==='next'
          ?<NextSessionPage plan={publishedPlan} clubName={clubName} logoUrl={logoUrl} exporting={exporting} onSaveImage={()=>handleExport('next-scoresheet','next-session-lineup')}/>
        :page==='players'
          ?<PlayersDirectory computed={computed} onSelect={n=>go('player',n)}/>
        :page==='sessions'
          ?<SessionsList sessions={sessions} onSelect={d=>go('session',d)}/>
        :page==='about'
          ?<AboutPage config={settings}/>
        :player==='All Players'
          ?<LeaderboardView snapshot={selectedSnapshot} allSnapshots={computed.snapshots} matchLog={computed.matchLog} clubName={clubName} logoUrl={logoUrl} onSelectPlayer={n=>go('player',n)} onExport={handleExport} onShare={handleShare} canShare={canShare} exporting={exporting} dismissedMilestones={dismissed} onDismiss={handleDismiss} config={settings}/>
          :<PlayerView playerName={player} computed={computed} latestSnap={latestSnap} config={settings}/>
        }
      </main>
      <footer className="max-w-6xl mx-auto px-4 pb-10 pt-2 text-center text-xs text-gray-400">
        <span className="inline-flex items-center gap-1.5">
          <PBMark size={18}/>
          <span>Powered by <span className="osw font-bold tracking-wide" style={{color:CORAL_DARK}}>PB<span style={{color:INK}}>Table</span></span> · RDR rating engine</span>
        </span>
      </footer>
      {adminOpen&&<AdminModal sessions={sessions} initialRatings={initialRatings} clubName={clubName} logoUrl={logoUrl} knownPlayers={knownPlayers}
        theme={theme} onTheme={handleThemePick} settings={settings} gradedEnabled={gradedEnabled} onSaveSettings={handleSaveSettings}
        onReload={()=>loadFromAirtable(true)} onOpenBuilder={(d)=>{setAdminOpen(false);setBuilderDate(d||'');setBuilderOpen(true);}}
        onOpenSocial={(s)=>{setAdminOpen(false);setSocialSession(s);}}
        onClose={()=>{setAdminOpen(false);setIsAdmin(!!sbToken());}} onSessions={handleSessions} onRatings={handleRatings} onClubName={handleClubName} onLogoUrl={handleLogoUrl}/>}
      {builderOpen&&<SessionBuilder sessions={sessions} ratingsByName={ratingsByName} clubName={clubName} logoUrl={logoUrl} initialDate={builderDate}
        defaultPricePennies={settings.default_price_pennies} onSaveDefaultPrice={(p)=>handleSaveSettings({default_price_pennies:p})}
        onReload={()=>loadFromAirtable(true)} onClose={()=>{setBuilderOpen(false);setBuilderDate('');}}/>}
      {socialSession&&<SocialBuilder session={socialSession} clubName={clubName} logoUrl={logoUrl}
        defaultPricePennies={settings.default_price_pennies} onSaveDefaultPrice={(p)=>handleSaveSettings({default_price_pennies:p})}
        onClose={()=>setSocialSession(null)} onSaved={()=>{}} onEdited={(row)=>setSocialSession(prev=>({...prev,...row}))}/>}
    </div>
    </ThemeContext.Provider>
  );
}

// Null-slug boot guard: if the host resolves to no club (an unrecognised apex/www/subdomain in
// prod), show a neutral landing rather than querying slug=eq.null and erroring. Inert on the demo,
// whose slug is always 'demo'.
function ClubNotResolved(){
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',
      background:'#0B1220',color:'#E5E7EB',fontFamily:'system-ui,-apple-system,sans-serif',padding:'24px'}}>
      <div style={{maxWidth:420,textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:12}}>🏓</div>
        <h1 style={{fontSize:22,fontWeight:900,marginBottom:8}}>Which club?</h1>
        <p style={{opacity:.75,lineHeight:1.5}}>Open your club's own PBTable address
          (for example <b>yourclub.pbtable.com</b>) to see its dashboard.</p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(SB_SLUG?<App/>:<ClubNotResolved/>);
</script>

</body>
</html>
