const DEFAULT_TOP_PLAYERS={mode:'rating',value:4.7};
function topPlayerSet(ranked, cfg){
  const list=Array.isArray(ranked)?ranked:[];

/* ─── DATE HELPERS ──────────────────────────────────────────── */
function ddmmToISO(s){ const[d,m,y]=s.trim().split('/'); return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`; }
function fmtShort(iso){ const[y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}); }
function fmtFull(iso){ const[y,m,d]=iso.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }
// Session-detail helpers (Tier 1/2 metadata).
function mapHref(loc){ return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(loc); }
function fmt12(t){ if(!t) return ''; const p=String(t).split(':'); let hh=parseInt(p[0],10); const mm=p[1]||'00'; if(isNaN(hh)) return t; const ap=hh>=12?'pm':'am'; hh=hh%12||12; return hh+(mm&&mm!=='00'?':'+mm:'')+ap; }
function fmtTimeRange(s,e){ if(!s&&!e) return ''; if(s&&e) return fmt12(s)+'–'+fmt12(e); return fmt12(s||e); }
// Renders a session's when/where/host/spots line. `taken`/`capacity` null = hidden.
function SessionMeta({loc,start,end,host,taken,capacity}){
  const time=fmtTimeRange(start,end);
  const cap=(capacity!=null&&capacity!=='')?Number(capacity):null;
  const full=cap!=null&&taken!=null&&taken>=cap;
  const anything=time||loc||host||cap!=null;
  if(!anything) return null;
  return(
    <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-gray-500">

function splitCSVLine(line){
  const out=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else{ if(c==='"') inQ=true; else if(c===',') {out.push(cur);cur='';} else cur+=c; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
// Canonical representation of a match. Each team's players are sorted and the two
// teams ordered deterministically, so the same game entered with sides swapped or
// partners reordered is recognised as the same.
//   identity = date + the four players (NO scores) → "which game was this"
//   full     = identity + scores                   → "this exact recorded result"
function canonMatch(date,m){
  const a={names:[m.p1,m.p2].slice().sort().join('&'),score:m.s1};
  const b={names:[m.p3,m.p4].slice().sort().join('&'),score:m.s2};
  const [x,y]=[a,b].sort((p,q)=>p.names<q.names?-1:1);
  return {identity:`${date}|${x.names}|${y.names}`, full:`${date}|${x.names}=${x.score}|${y.names}=${y.score}`};
}
function matchKey(date,m){ return canonMatch(date,m).full; }
function recordFromMatch(date,m){
  return {fields:{
    playdate:date.split('-').reverse().join('/'),score1:m.s1,score2:m.s2,
    player1:m.p1,player2:m.p2,player3:m.p3,player4:m.p4
  }};
}
// UPLOAD path — upsert by match identity. For each matchup present in the upload:
//   • identical result already in Airtable → no change
//   • same matchup, different score (a correction) → old record(s) deleted, new written
//   • matchup not seen before → created
// Matchups NOT in the upload are left untouched (so a partial upload never deletes
// other games). This is what lets a corrected score REPLACE the old one instead of
// creating a duplicate, without needing to delete the whole session first.
function reconcileMatches(existingSessions,candidateSessions){
  const existing=new Map(); // identity → [{id,full}]
  (existingSessions||[]).forEach(s=>(s.matches||[]).forEach(m=>{
    const c=canonMatch(s.date,m);
    if(!existing.has(c.identity)) existing.set(c.identity,[]);
    existing.get(c.identity).push({id:m.id,full:c.full});
  }));
  const cand=new Map(); // identity → [{date,m,full}]
  (candidateSessions||[]).forEach(s=>(s.matches||[]).forEach(m=>{
    const c=canonMatch(s.date,m);
    if(!cand.has(c.identity)) cand.set(c.identity,[]);
    cand.get(c.identity).push({date:s.date,m,full:c.full});
  }));
  const toCreate=[],toDeleteIds=[];let unchanged=0;
  cand.forEach((uList,identity)=>{
    const eList=existing.get(identity)||[];
    const eFull=eList.map(e=>e.full).sort().join('||');
    const uFull=uList.map(u=>u.full).sort().join('||');
    if(eFull===uFull){unchanged+=uList.length;return;} // identical → nothing to do
    eList.forEach(e=>{if(e.id)toDeleteIds.push(e.id);});       // replace: drop old…
    uList.forEach(u=>toCreate.push(recordFromMatch(u.date,u.m))); // …write new
  });
  return {toCreate,toDeleteIds,unchanged};
}
// IMPORT path — additive only. Creates matches whose identity isn't already present;
// never deletes or overwrites (a backup restore shouldn't clobber newer corrections).
function buildNewMatchRecords(existingSessions,candidateSessions){
  const seen=new Set((existingSessions||[]).flatMap(s=>(s.matches||[]).map(m=>canonMatch(s.date,m).identity)));
  const records=[];
  (candidateSessions||[]).forEach(sess=>(sess.matches||[]).forEach(m=>{
    const id=canonMatch(sess.date,m).identity;
    if(seen.has(id)) return;
    seen.add(id);
    records.push(recordFromMatch(sess.date,m));
  }));
  return records;
}

/* ─── CSV PARSERS ───────────────────────────────────────────── */
function parseMatchCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l=>l.trim() && l.replace(/,/g,'').trim());
  if (lines.length < 2) throw new Error('CSV needs a header and at least one data row');
  const headers = splitCSVLine(lines[0]).map(h=>h.toLowerCase());
  const req = ['playdate','player1','player2','score1','score2','player3','player4'];
  const miss = req.filter(r=>!headers.includes(r));
  if (miss.length) throw new Error(`Missing columns: ${miss.join(', ')}`);
  const rows = [];
  for (let i=1;i<lines.length;i++){
    const v=splitCSVLine(lines[i]);
    if(v.length<7) throw new Error(`Row ${i+1}: too few values`);
    const o={}; headers.forEach((h,j)=>o[h]=v[j]);
    const s1=parseInt(o.score1,10), s2=parseInt(o.score2,10);
    if(isNaN(s1)||isNaN(s2)) throw new Error(`Row ${i+1}: invalid score`);
    rows.push({ date:ddmmToISO(o.playdate), player1:o.player1, player2:o.player2, score1:s1, score2:s2, player3:o.player3, player4:o.player4 });
  }
  // Group by date
  const byDate={};
  rows.forEach(r=>{
    if(!byDate[r.date]) byDate[r.date]=[];
    byDate[r.date].push({p1:r.player1,p2:r.player2,p3:r.player3,p4:r.player4,s1:r.score1,s2:r.score2});
  });
  return Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).map(([date,matches])=>({date,matches}));
}

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();

}

const MATCHES_TEMPLATE='playdate,player1,player2,score1,score2,player3,player4\n12/06/2026,Jane Smith,John Doe,11,7,Sam Lee,Pat Kerr\n12/06/2026,Jane Smith,Sam Lee,9,11,John Doe,Pat Kerr\n';

function parseInitialRatingsCSV(text) {
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) throw new Error('CSV needs header + data');
  const headers=splitCSVLine(lines[0]).map(h=>h.toLowerCase());
  if(!headers.includes('name')||!headers.includes('initial_4dr')) throw new Error('Missing columns: name, initial_4dr');
  const result={};

/* ─── LEVENSHTEIN + FUZZY MATCH ────────────────────────────── */
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function fuzzyMatch(name,known,threshold=3){
  const nl=name.toLowerCase().trim();
  const exact=known.find(k=>k.toLowerCase()===nl);
  if(exact) return {match:exact,exact:true};
  let best=null,bestD=Infinity;
  known.forEach(k=>{const d=levenshtein(nl,k.toLowerCase()); if(d<bestD){bestD=d;best=k;}});
  if(bestD<=threshold) return {match:best,exact:false,distance:bestD};
  return {match:null,exact:false};
}

/* ─── RATING ENGINE CONSTANTS ───────────────────────────────── */
// D=1.1: calibrated so 0.1 diff→55%, 0.5 diff→74%, 1.0 diff→89%
const R_D=1.1, R_KMIN=0.04, R_KMAX=0.12, R_KHALF=30, R_ALPHA=1.2;
// Dynamic K: high for new players, stabilises for veterans
function ratingK(n){return R_KMIN+(R_KMAX-R_KMIN)*R_KHALF/(n+R_KHALF);}

/* ─── RATING ENGINE + SESSION REPLAY ────────────────────────── */
function replayAllSessions(initialRatings, sessions) {
  let ratings={...initialRatings};
  const matchCounts={}; // track per-player match count for dynamic K
  const matchLog={};
  const snapshots=[];

  const addLog=(p,partner,o1,o2,ms,ts,rb,ra,date)=>{
    if(!matchLog[p]) matchLog[p]=[];
    matchLog[p].push({date,partner,opp1:o1,opp2:o2,myScore:ms,theirScore:ts,won:ms>ts,rBefore:rb,rAfter:ra,delta:ra-rb});
  };

  // Build a ranked snapshot from the CURRENT ratings, measured against the previous one.
  const buildSnapshot=(date,playedInSession,extra={})=>{
    const prev=snapshots.length?snapshots[snapshots.length-1]:null;
    const prevPos=prev?Object.fromEntries(prev.players.map(p=>[p.name,p.position])):{};
    const prevRat=prev?Object.fromEntries(prev.players.map(p=>[p.name,p.rating])):{};
    const players=Object.entries(ratings)
      // Rank everyone with a rating: players who've played + seeded players yet to play (PBR parity).
      .filter(([name])=>matchCounts[name]>0 || initialRatings[name]!==undefined)
      .sort(([,a],[,b])=>b-a)
      .map(([name,rating],i)=>({
        name,rating,position:i+1,
        pos_change: prevPos[name]!==undefined ? prevPos[name]-(i+1) : 0,
        rating_change: prevRat[name]!==undefined ? parseFloat((rating-prevRat[name]).toFixed(4)) : 0,
      }));
    snapshots.push({date,players,playedInSession,...extra});
  };

  // The baseline snapshot freezes the PBR standings at BASELINE_DATE. Pushed exactly once —
  // right before the first post-baseline session, or at the very end if none exist yet.
  let baselineDone=false;
  const pushBaseline=()=>{ if(BASELINE_DATE && !baselineDone){ buildSnapshot(BASELINE_DATE,new Set(),{baseline:true}); baselineDone=true; } }; // demo: no-op when BASELINE_DATE is off

  sessions.forEach(sess=>{
    // On/before the line in the sand we ADOPT the PBR seed: count games (so K-maturity,
    // confidence and "has played" stay accurate) and keep each match in the player's log
    // for W–L history, but DO NOT move ratings. Everyone sits exactly at their PBR number.
    if(sess.date<=BASELINE_DATE){
      sess.matches.forEach(({p1,p2,p3,p4,s1,s2})=>{
        [p1,p2,p3,p4].forEach(p=>{
          if(ratings[p]===undefined) ratings[p]=NEW_PLAYER_START;
          if(matchCounts[p]===undefined) matchCounts[p]=0;
        });
        const r1=ratings[p1],r2=ratings[p2],r3=ratings[p3],r4=ratings[p4];
        [p1,p2,p3,p4].forEach(p=>matchCounts[p]++);
        addLog(p1,p2,p3,p4,s1,s2,r1,r1,sess.date); // rBefore===rAfter → frozen, Δ0
        addLog(p2,p1,p3,p4,s1,s2,r2,r2,sess.date);
        addLog(p3,p4,p1,p2,s2,s1,r3,r3,sess.date);
        addLog(p4,p3,p1,p2,s2,s1,r4,r4,sess.date);
      });
      return; // no per-session snapshot before the baseline
    }
    pushBaseline(); // lock in PBR standings the moment real (post-baseline) play begins
    sess.matches.forEach(({p1,p2,p3,p4,s1,s2})=>{
      [p1,p2,p3,p4].forEach(p=>{
        if(ratings[p]===undefined) ratings[p]=NEW_PLAYER_START;
        if(matchCounts[p]===undefined) matchCounts[p]=0;
      });
      const r1=ratings[p1],r2=ratings[p2],r3=ratings[p3],r4=ratings[p4];
      const avg1=(r1+r2)/2, avg2=(r3+r4)/2;

      // Expected score proportion (calibrated logistic, D=1.1)
      const exp1=1/(1+Math.pow(10,-(avg1-avg2)/R_D));

      // Actual score proportion (DUPR-style)
      const tot=s1+s2, act1=tot>0?s1/tot:0.5;

      // Margin factor: diminishing returns via exponential saturation
      // 11-9→1.20, 11-5→1.39, 11-0→1.47
      const scoreDiff=Math.abs(s1-s2);
      const mf=1+0.5*(1-Math.exp(-scoreDiff/4));

      // Error terms with asymmetric penalty (α=1.2 for underperformance)
      const err1=act1-exp1;
      const adj1=err1<0?R_ALPHA*err1:err1;
      const err2=-err1;
      const adj2=err2<0?R_ALPHA*err2:err2;

      // Per-player dynamic K and rating updates
      const k1=ratingK(matchCounts[p1]),k2=ratingK(matchCounts[p2]);
      const k3=ratingK(matchCounts[p3]),k4=ratingK(matchCounts[p4]);
      const clamp=v=>Math.max(RATING_MIN,Math.min(RATING_MAX,v));
      ratings[p1]=clamp(r1+k1*mf*adj1); ratings[p2]=clamp(r2+k2*mf*adj1);
      ratings[p3]=clamp(r3+k3*mf*adj2); ratings[p4]=clamp(r4+k4*mf*adj2);

      [p1,p2,p3,p4].forEach(p=>matchCounts[p]++);

      addLog(p1,p2,p3,p4,s1,s2,r1,ratings[p1],sess.date);
      addLog(p2,p1,p3,p4,s1,s2,r2,ratings[p2],sess.date);
      addLog(p3,p4,p1,p2,s2,s1,r3,ratings[p3],sess.date);
      addLog(p4,p3,p1,p2,s2,s1,r4,ratings[p4],sess.date);
    });
    const playedInSession=new Set(sess.matches.flatMap(({p1,p2,p3,p4})=>[p1,p2,p3,p4]));
    buildSnapshot(sess.date,playedInSession);
  });
  pushBaseline(); // ensure the baseline exists even when no post-baseline games are in yet
  return {snapshots, matchLog, currentRatings:{...ratings}};
}

/* ─── ANALYTICS ────────────────────────────────────────────── */
function computeHotStreaks(snapshots,hotMin=3){
  if(snapshots.length<3) return new Set();
  const hist={};
  snapshots.forEach(s=>s.players.forEach(p=>(hist[p.name]=hist[p.name]||[]).push(p.position)));
  const hot=new Set();
  Object.entries(hist).forEach(([name,pos])=>{
    if(pos.length<3) return;
    let streak=1;
    for(let i=pos.length-1;i>0;i--){if(pos[i]<pos[i-1])streak++;else break;}
    if(streak>=hotMin) hot.add(name);
  });
  return hot;
}

function computeHighlights(snapshot){
  if(!snapshot) return null;
  const imp=snapshot.players.filter(p=>p.rating_change>0);
  if(!imp.length&&snapshot.players.every(p=>p.pos_change===0)) return null;
  const maxRC=imp.length?Math.max(...imp.map(p=>p.rating_change)):0;
  const mostImproved=imp.filter(p=>Math.abs(p.rating_change-maxRC)<0.00001);
  const moverPlayers=snapshot.players.filter(p=>p.pos_change>0);
  const maxPC=moverPlayers.length?Math.max(...moverPlayers.map(p=>p.pos_change)):0;
  const biggestMover=moverPlayers.filter(p=>p.pos_change===maxPC);
  return {mostImproved,biggestMover,maxRC,maxPC};
}

function computeRisersFallers(snapshot,allSnapshots){
  if(allSnapshots.length<2||!snapshot) return null;
  if(snapshot.players.every(p=>p.pos_change===0)) return null;
  return {
    risers:[...snapshot.players].filter(p=>p.pos_change>0).sort((a,b)=>b.pos_change-a.pos_change).slice(0,3),
    fallers:[...snapshot.players].filter(p=>p.pos_change<0).sort((a,b)=>a.pos_change-b.pos_change).slice(0,3),
  };
}

function computeMilestones(snapshots,thresholdsArg){
  const ms=[];
  const thresholds=thresholdsArg||MILESTONE_THRESHOLDS;
  const met={};
  // A milestone is only awarded for a genuine CROSSING: the player must have been
  // observed below the threshold in an earlier snapshot. (Starting above it — e.g.
  // via seed ratings on the first session — does not count as "reaching" it.)
  const lastSeen={};
  snapshots.forEach(s=>{
    thresholds.forEach(t=>{
      const k=`thr_${t}`;
      if(!met[k]){
        const a=s.players.find(p=>p.rating>=t&&lastSeen[p.name]!==undefined&&lastSeen[p.name]<t);
        if(a){met[k]=true;ms.push({id:k,text:`${a.name} first to reach ${t.toFixed(1)}`,sub:`${a.rating.toFixed(3)} on ${fmtFull(s.date)}`});}
      }
    });
    s.players.forEach(p=>{lastSeen[p.name]=p.rating;});
  });
  // Longest run at #1
  const streakMap={};let curN=null,curL=0;
  snapshots.forEach(s=>{const top=s.players[0];if(!top){curN=null;curL=0;return;}curL=top.name===curN?curL+1:1;curN=top.name;if(!streakMap[top.name]||curL>streakMap[top.name])streakMap[top.name]=curL;});
  const best=Object.entries(streakMap).sort(([,a],[,b])=>b-a)[0];
  if(best&&best[1]>=2) ms.push({id:`top1_${best[0].replace(/\s/g,'_')}`,text:`${best[0]}: ${best[1]} sessions at #1`,sub:'Longest consecutive reign at the top'});
  // Most consecutive improvement
  const pHist={};
  snapshots.forEach(s=>s.players.forEach(p=>(pHist[p.name]=pHist[p.name]||[]).push(p.position)));
  let bPlayer=null,bLen=0;
  Object.entries(pHist).forEach(([name,pos])=>{let streak=1,max=1;for(let i=1;i<pos.length;i++){if(pos[i]<pos[i-1]){streak++;max=Math.max(max,streak);}else streak=1;}if(max>bLen){bLen=max;bPlayer=name;}});
  if(bPlayer&&bLen>=3) ms.push({id:`improve_${bPlayer.replace(/\s/g,'_')}`,text:`${bPlayer}: ${bLen} sessions of improvement`,sub:'Most sustained position rise'});
  return ms;
}

function computeConsistencyScore(ratings){
  if(ratings.length<3) return null;
  const mean=ratings.reduce((s,r)=>s+r,0)/ratings.length;
  const sd=Math.sqrt(ratings.reduce((s,r)=>s+(r-mean)**2,0)/ratings.length);
  return {score:Math.max(0,Math.min(10,Math.round((1-sd/CONSISTENCY_SD_SCALE)*10))),sd};
}

// DUPR-style reliability/confidence (0–100%): how much to trust a player's rating.
// Experience climbs with games played; Recency decays with consecutive missed sessions.
function confidenceScore(games,missed){
  if(!games) return {pct:0,label:'No data'};
  const experience=1-Math.exp(-games/CONF_EXP_K);
  const recency=Math.exp(-(missed||0)/CONF_REC_K);
  const pct=Math.round(100*experience*recency);
  let label;
  if(games<5) label='Provisional';
  else if(pct>=80) label='High';
  else if(pct>=50) label='Moderate';
  else label='Low';
  return {pct,label};
}
function confColor(c){
  if(c.label==='Provisional') return 'var(--conf-none)';
  if(c.pct>=80) return 'var(--conf-high)';
  if(c.pct>=50) return 'var(--conf-mid)';
  return 'var(--conf-low)';
}

function getPlayerRatingHistory(matchLog,snapshots,name){
  const log=matchLog[name]||[];
  const playedDates=[...new Set(log.map(m=>m.date))].sort();
  return playedDates.map(d=>{
    const s=snapshots.find(x=>x.date===d);
    const p=s?.players.find(x=>x.name===name);
    return p?{date:d,rating:p.rating,position:p.position}:null;
  }).filter(Boolean);
}

function getHeadToHead(log){
  const h={};
  log.forEach(m=>[m.opp1,m.opp2].forEach(opp=>{
    if(!h[opp]) h[opp]={w:0,l:0};
    m.won?h[opp].w++:h[opp].l++;
  }));
  return Object.entries(h).map(([name,{w,l}])=>({name,w,l,total:w+l})).sort((a,b)=>b.total-a.total).slice(0,3);
}

function getOnesToCatch(latestSnap,name){
  if(!latestSnap) return {isTop:false,players:[]};
  const p=latestSnap.players.find(x=>x.name===name);
  if(!p) return {isTop:false,players:[]};
  if(p.position===1) return {isTop:true,players:[],playerRating:p.rating};
  const list=[1,2,3].map(n=>p.position-n).filter(pos=>pos>0)
    .map(pos=>{const t=latestSnap.players.find(x=>x.position===pos);return t?{...t,gap:(t.rating-p.rating).toFixed(3)}:null;})
    .filter(Boolean);
  return {isTop:false,players:list,playerRating:p.rating};
}

function LineChart({labels,data,color,invertY,integerY,ariaLabel}){

  useEffect(()=>{
    if(!ref.current||!data.length) return;
    const col=cssHex(color), navy=cssHex(NAVY), muted=cssHex('var(--text-muted)'), grid=cssHex('var(--grid)'), surf=cssHex('var(--surface)');

/* ─── COUNT-UP NUMBER ───────────────────────────────────────── */
// Animates a numeric value into place (eased), re-animating when the value changes.
function CountUp({value,decimals=0,duration=700}){
  const[disp,setDisp]=useState(value);
  const prev=useRef(null);
  useEffect(()=>{
    const from=prev.current===null?0:prev.current;
    prev.current=value;
    if(from===value){setDisp(value);return;}
    const t0=performance.now();let raf;
    const tick=now=>{
      const k=Math.min(1,(now-t0)/duration);
      const e=1-Math.pow(1-k,3); // ease-out cubic
      setDisp(from+(value-from)*e);
      if(k<1) raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[value,duration]);
  return <>{disp.toFixed(decimals)}</>;
}

function Spark({data}){
  if(!data||data.length<2) return <span className="text-gray-300">—</span>;
  const w=56,h=18,min=Math.min(...data),max=Math.max(...data),rng=(max-min)||0.001;
  const pts=data.map((v,i)=>`${((i/(data.length-1))*w).toFixed(1)},${(h-2-((v-min)/rng)*(h-4)).toFixed(1)}`).join(' ');
  const up=data[data.length-1]>=data[0];
  return(
    <svg width={w} height={h} aria-hidden="true" className="inline-block align-middle">
      <polyline points={pts} fill="none" stroke={up?GREEN:RED} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
    </svg>
  );
}

/* ─── AIRTABLE HELPERS (via Netlify Function proxy) ─────────────
   Every request goes through AT_PROXY; the API token stays server-side. */
// ─── Supabase read layer (ported atFetchAll) ───────────────────────────
let _sbClubId=null;
async function sbClubId(){
  if(_sbClubId) return _sbClubId;
  const r=await fetch(`${SB_URL}/rest/v1/clubs?select=id&slug=eq.${encodeURIComponent(SB_SLUG)}`,
    {headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error(`Supabase clubs ${r.status}`);
  const rows=await r.json();
  if(!rows.length) throw new Error(`No club with slug "${SB_SLUG}"`);
  return (_sbClubId=rows[0].id);
}
async function sbGetAll(pathAndQuery){
  const out=[]; const page=1000;
  for(let from=0;;from+=page){
    const r=await fetch(`${SB_URL}/rest/v1/${pathAndQuery}`,
      {headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`,Range:`${from}-${from+page-1}`}});
    if(!r.ok) throw new Error(`Supabase ${r.status}: ${await r.text()}`);
    const batch=await r.json(); out.push(...batch);
    if(batch.length<page) break;
  }
  return out;
}
// Drop-in replacement for the Airtable proxy read. Returns Airtable-shaped
// records ({id, fields:{...}}) ordered (played_on, seq) so the engine replays
// in exactly the same order as the live app — the rest of the app is unchanged.
async function atFetchAll(table){
  const club=await sbClubId();
  if(table===AT_PLAYERS){
    const rows=await sbGetAll(`players?select=id,name,initial_rdr&club_id=eq.${club}`);
    return rows.map(r=>({id:r.id, fields:{PlayerName:r.name,
      ...(r.initial_rdr!=null?{initial_4dr:r.initial_rdr}:{})}}));
  }
  if(table===AT_RESULTS){
    const rows=await sbGetAll(`matches?select=id,played_on,seq,p1,p2,p3,p4,s1,s2&club_id=eq.${club}&order=played_on.asc,seq.asc`);
    return rows.map(r=>({id:r.id, fields:{playdate:r.played_on,
      player1:r.p1, player2:r.p2, player3:r.p3, player4:r.p4,
      score1:r.s1, score2:r.s2}}));
  }
  return []; // Activity etc. aren't read on load
}
function atError(status,respText){
  // The proxy now returns sanitised {error} messages; fall back gracefully.
  let msg=`Request failed (${status})`;
  try{ const j=JSON.parse(respText); if(j&&j.error) msg=typeof j.error==='string'?j.error:(j.error.message||msg); }catch{}
  return new Error(msg);
}
/* ─── SUPABASE AUTH (magic link) ──────────────────────────────────────
   Admin sign-in is passwordless: POST /auth/v1/otp emails a magic link; the
   link returns here with #access_token=… which we capture into a session. All
   writes carry that JWT and are gated by Row-Level Security (admin-of-this-club
   only). The service_role key is never present. */
const SB_SESSION_KEY='pb_sb_session';
function sbSaveSession(s){ try{ if(s) localStorage.setItem(SB_SESSION_KEY,JSON.stringify(s)); else localStorage.removeItem(SB_SESSION_KEY); }catch{} }
function sbLoadSession(){ try{ return JSON.parse(localStorage.getItem(SB_SESSION_KEY)||'null'); }catch{ return null; } }
// Capture a magic-link session from the URL hash on load, then strip it from the URL.
function sbCaptureHash(){
  if(!location.hash || location.hash.indexOf('access_token')<0) return null;
  const h=new URLSearchParams(location.hash.replace(/^#/,''));
  const at=h.get('access_token');
  if(!at) return null;
  const s={access_token:at, refresh_token:h.get('refresh_token'), obtained:Date.now(), expires_in:Number(h.get('expires_in')||3600)};
  sbSaveSession(s);
  history.replaceState(null,'',location.pathname+location.search);
  return s;
}
let _session = sbCaptureHash() || sbLoadSession();
function sbToken(){ return _session ? _session.access_token : null; }
function sbSignOut(){ _session=null; sbSaveSession(null); }
// Email a one-time 6-digit code. No redirect_to: we verify the code in-page (below),
// so there's no clickable link for Outlook/Safe-Link scanners to consume, and no
// dependency on the Supabase Site URL / redirect allow-list.
async function sbSignInWithOtp(email){
  const r=await fetch(`${SB_URL}/auth/v1/otp`,{
    method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
    body:JSON.stringify({email, create_user:false})  // create_user:false → only known admins
  });
  if(!r.ok){ throw new Error(`Could not send the sign-in code (${r.status}).`); }
  return true;
}
// Verify the 6-digit email code → establishes the admin session in-page.
// signInWithOtp on an EXISTING user stores the code as a recovery/magiclink token,
// so the matching verify "type" can be 'email', 'magiclink' or 'recovery' depending on
// the GoTrue version. Try them in order; a wrong type returns "not found" without
// consuming the code, so the right one still succeeds.
async function sbVerifyOtp(email, code){
  let lastErr='That code is invalid or has expired.';
  for(const type of ['magiclink','recovery','email']){
    const r=await fetch(`${SB_URL}/auth/v1/verify`,{
      method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({type, email, token:code})
    });
    const b=await r.json().catch(()=>({}));
    if(r.ok && b.access_token){
      _session={access_token:b.access_token, refresh_token:b.refresh_token, obtained:Date.now(), expires_in:b.expires_in||3600};
      sbSaveSession(_session);
      return true;
    }
    lastErr=b.error_description||b.msg||b.error||lastErr;
  }
  throw new Error(lastErr);
}
async function sbRefresh(){
  if(!_session||!_session.refresh_token) return false;
  const r=await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`,{
    method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:_session.refresh_token})
  });
  if(!r.ok){ sbSignOut(); return false; }
  const b=await r.json();
  _session={access_token:b.access_token, refresh_token:b.refresh_token, obtained:Date.now(), expires_in:b.expires_in||3600};
  sbSaveSession(_session); return true;
}
// DEMO: open admin sandbox — no JWT required. Writes fall back to the publishable (anon) key;
// the demo_sandbox_* RLS policies let anon read/write freely. (Production requires the admin JWT.)
async function sbWrite(method,pathAndQuery,body,prefer){
  const doFetch=(tok)=>fetch(`${SB_URL}/rest/v1/${pathAndQuery}`,{method,
    headers:{apikey:SB_KEY,Authorization:`Bearer ${tok}`,'Content-Type':'application/json',Prefer:prefer||'return=representation'},
    body:body!==undefined?JSON.stringify(body):undefined});
  // The admin JWT expires (~1h). Refresh proactively when it's past/near expiry so a long
  // editing session never dies mid-save.
  if(_session&&_session.access_token&&(Date.now()-_session.obtained)>(((_session.expires_in||3600)-60)*1000)){ await sbRefresh(); }
  let r=await doFetch(sbToken()||SB_KEY);
  // Safety net: if a write still 401s on a stored session, refresh once and retry; if the
  // refresh token is dead too, fall back to the anon key (the demo's RLS permits it).
  if(r.status===401&&sbToken()){ r=(await sbRefresh())?await doFetch(sbToken()):await doFetch(SB_KEY); }
  return r;
}

// Drop-in replacements for the old Airtable write helpers — same names/signatures
// (the trailing secret arg is ignored; auth now comes from the admin JWT) so every
// call-site (CSV upload, court-side entry, session delete, JSON import) is unchanged.
async function atVerifyAdmin(){ return !!sbToken(); }

async function atPostBatch(table,records){
  const club=await sbClubId();
  if(table===AT_RESULTS){
    // Group by date; assign seq AFTER the current max seq for that date (unique per club+date).
    const byDate={};
    records.forEach(rec=>{ const f=rec.fields; const d=normDate(f.playdate); (byDate[d]=byDate[d]||[]).push(f); });
    for(const d of Object.keys(byDate)){
      const ex=await sbGetAll(`matches?select=seq&club_id=eq.${club}&played_on=eq.${d}&order=seq.desc&limit=1`);
      let seq=ex.length?ex[0].seq:0;
      const rows=byDate[d].map(f=>({club_id:club,played_on:d,seq:++seq,
        p1:f.player1,p2:f.player2,p3:f.player3,p4:f.player4,s1:Number(f.score1),s2:Number(f.score2)}));
      for(let i=0;i<rows.length;i+=200){
        const r=await sbWrite('POST','matches',rows.slice(i,i+200));
        if(!r.ok) throw atError(r.status,await r.text());
      }
    }
    return;
  }
  if(table==='Activity'){
    const rows=records.map(rec=>({club_id:club,action:rec.fields.action,detail:rec.fields.detail}));
    const r=await sbWrite('POST','activity',rows,'return=minimal'); if(!r.ok) throw atError(r.status,await r.text());
    return;
  }
  if(table===AT_PLAYERS){
    const rows=records.map(rec=>({club_id:club,name:rec.fields.PlayerName,
      ...(rec.fields.initial_4dr!=null?{initial_rdr:Number(rec.fields.initial_4dr)}:{})}));
    const r=await sbWrite('POST','players?on_conflict=club_id,name',rows,'resolution=merge-duplicates,return=minimal');
    if(!r.ok) throw atError(r.status,await r.text());
    return;
  }
}
async function atDeleteBatch(table,ids){
  if(!ids||!ids.length) return;
  // ids are matches row uuids (from atFetchAll). Delete in chunks via an IN filter.
  for(let i=0;i<ids.length;i+=100){
    const list=ids.slice(i,i+100).map(encodeURIComponent).join(',');
    const r=await sbWrite('DELETE',`matches?id=in.(${list})`,undefined,'return=minimal');
    if(!r.ok) throw atError(r.status,await r.text());
  }
}
// Audit trail: best-effort log of admin actions to the Supabase `activity` table.
// Never blocks the actual operation if it fails.
async function atLogActivity(action,detail){
  try{ await atPostBatch('Activity',[{fields:{action,detail}}]); }catch(e){}
}
function normDate(d){
  if(!d) return null;
  d=String(d).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(d)) return d.slice(0,10); // ISO
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(d)) return ddmmToISO(d); // D/M/YYYY or DD/MM/YYYY (ddmmToISO zero-pads)
  return null;
}

    setCfgTopMode(tp.mode||'rating'); setCfgTopValue(String(tp.value??4.7));
    setCfgShowFallers((settings&&settings.show_fallers)!==false);
    setCfgSocialStats((settings&&settings.social_stats)!==false);
    setCfgGuestPrivacy(!!(settings&&settings.guest_privacy));
    const lb=(settings&&settings.social_leaderboard)||{};
    setCfgLeaderboard(!!lb.enabled); setCfgLbSince(lb.since||'');
  },[settings]);
  const saveClubSettings=()=>{
    const inact=parseInt(cfgInactive,10), hot=parseInt(cfgHot,10);
    const miles=cfgMiles.split(',').map(s=>parseFloat(s.trim())).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
    if(isNaN(inact)||inact<1||isNaN(hot)||hot<2){ setCfgMsg({type:'error',text:'Inactive must be ≥1 and HOT streak ≥2.'}); return; }
    // Record-from-activation: stamp `since` the first time the leaderboard is switched on.
    const since=cfgLeaderboard?(cfgLbSince||todayISO2):(cfgLbSince||null);
    const topVal=cfgTopMode==='count'?Math.max(0,Math.round(parseFloat(cfgTopValue)||0)):(parseFloat(cfgTopValue)||0);
    onSaveSettings&&onSaveSettings({inactive_after_missed:inact,hot_streak_min:hot,milestone_thresholds:miles,top_players:{mode:cfgTopMode,value:topVal},show_fallers:cfgShowFallers,social_stats:cfgSocialStats,guest_privacy:cfgGuestPrivacy,social_leaderboard:{enabled:cfgLeaderboard,since}});
    setCfgMsg({type:'ok',text:'✓ Saved — applies to everyone viewing the board.'});
    setTimeout(()=>setCfgMsg({type:'',text:''}),2600);
  };

  useEffect(()=>{
    const onKey=e=>{if(e.key==='Escape')onClose();};
    document.addEventListener('keydown',onKey);
    return()=>document.removeEventListener('keydown',onKey);
  },[onClose]);

  const sendCode=async e=>{
    e.preventDefault();setPwErr('');setVerifying(true);
    try{ await sbSignInWithOtp(email.trim()); setCodeSent(true); }
    catch(err){ setPwErr(err.message||'Could not send the sign-in code.'); }
    setVerifying(false);
  };
  const verifyCode=async e=>{
    e.preventDefault();setPwErr('');setVerifying(true);
    try{ await sbVerifyOtp(email.trim(), code.trim()); setStep('panel'); }
    catch(err){ setPwErr(err.message||'That code is invalid or has expired.'); }
    setVerifying(false);
  };
  const signOut=()=>{ sbSignOut(); setCodeSent(false); setCode(''); setStep('pw'); };
  const saveCN=()=>{onClubName(cn);setCnSaved(true);setTimeout(()=>setCnSaved(false),2000);};
  const handleLogoFile=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>2*1024*1024){alert('Image is too large (max 2 MB). Please resize it first.');return;}
    const r=new FileReader();
    r.onload=ev=>{setLu(ev.target.result);onLogoUrl(ev.target.result);setLuSaved(true);setTimeout(()=>setLuSaved(false),2500);};
    r.readAsDataURL(f);e.target.value='';
  };
  const removeLogo=()=>{setLu('');onLogoUrl('');setLuSaved(false);};

  // Shared entry point for both CSV upload and court-side score entry: runs fuzzy
  // name checks, then routes into the review/confirm pipeline.
  const startReview=parsed=>{
    const allNames=[...new Set(parsed.flatMap(s=>s.matches.flatMap(m=>[m.p1,m.p2,m.p3,m.p4])))];
    const issues=[],newP=[];
    allNames.forEach(name=>{
      const res=fuzzyMatch(name,knownPlayers);
      if(res.exact) return;
      if(res.match) issues.push({rawName:name,suggested:res.match,distance:res.distance});
      else newP.push(name);
    });
    if(issues.length>0){
      setPendingSession({parsed,allNames,issues,newPlayers:newP,autoResolutions:{}});
      setMatchStep('reviewing');
    } else {
      setPendingSession({parsed,allNames,issues:[],newPlayers:newP,autoResolutions:Object.fromEntries(allNames.map(n=>[n,n]))});
      setMatchStep('confirming');
    }
  };

  const handleMatchUpload=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{ startReview(parseMatchCSV(ev.target.result)); }
      catch(err){setMatchMsg({type:'error',text:err.message});}
    };
    r.readAsText(f);e.target.value='';
  };

  const addEntry=()=>{
    setEntryErr('');
    const names=[entry.p1,entry.p2,entry.p3,entry.p4].map(n=>n.trim());
    if(names.some(n=>!n)){setEntryErr('All four player names are required.');return;}
    const lower=names.map(n=>n.toLowerCase());
    if(new Set(lower).size!==4){setEntryErr('Player names must be four different people.');return;}
    const s1=parseInt(entry.s1,10),s2=parseInt(entry.s2,10);
    if(isNaN(s1)||isNaN(s2)||s1<0||s2<0){setEntryErr('Scores must be non-negative whole numbers.');return;}
    if(!entryDate){setEntryErr('Pick a session date.');return;}
    setEntryList(list=>[...list,{date:entryDate,p1:names[0],p2:names[1],p3:names[2],p4:names[3],s1,s2}]);
    setEntry(e=>({...e,s1:'',s2:''})); // keep the players for quick repeat entry; clear scores
  };
  const removeEntry=idx=>setEntryList(list=>list.filter((_,i)=>i!==idx));
  const processEntries=()=>{
    if(!entryList.length) return;
    const byDate={};
    entryList.forEach(m=>{(byDate[m.date]=byDate[m.date]||[]).push({p1:m.p1,p2:m.p2,p3:m.p3,p4:m.p4,s1:m.s1,s2:m.s2});});
    const parsed=Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).map(([date,matches])=>({date,matches}));
    setEntryList([]);
    startReview(parsed);
  };

  const handleFuzzyResolved=decisions=>{
    setPendingSession(prev=>({...prev,autoResolutions:decisions}));
    setMatchStep('confirming');
  };

  const processSession=async()=>{
    const{parsed,autoResolutions}=pendingSession;
    const resolved=parsed.map(sess=>({
      date:sess.date,
      matches:sess.matches.map(m=>({
        p1:autoResolutions[m.p1]||m.p1,p2:autoResolutions[m.p2]||m.p2,
        p3:autoResolutions[m.p3]||m.p3,p4:autoResolutions[m.p4]||m.p4,
        s1:m.s1,s2:m.s2
      }))
    }));
    // Upsert against existing Airtable records: new matchups are created, a changed
    // score for an existing matchup replaces it (no duplicate), identical games are skipped.
    const{toCreate,toDeleteIds,unchanged}=reconcileMatches(sessions,resolved);
    if(!toCreate.length&&!toDeleteIds.length){setMatchMsg({type:'error',text:`No changes \u2014 ${unchanged} match(es) already recorded with these scores.`});return;}
    setMatchMsg({type:'',text:'Saving to Airtable\u2026'});
    try{
      // Create-first, then delete the superseded records \u2014 a failure can leave a
      // recoverable duplicate, never lost data.
      if(toCreate.length) await atPostBatch(AT_RESULTS,toCreate,adminSecret);
      if(toDeleteIds.length) await atDeleteBatch(AT_RESULTS,toDeleteIds,adminSecret);
      atLogActivity('Matches saved',`${toCreate.length} written, ${toDeleteIds.length} replaced`,adminSecret);
      const note=toDeleteIds.length?` (${toDeleteIds.length} corrected result(s) replaced)`:'';
      setMatchMsg({type:'ok',text:`\u2713 ${toCreate.length} match(es) written${note}. Reloading\u2026`});
      setMatchStep('idle');setPendingSession(null);
      setTimeout(()=>onReload(),1000);
    }catch(err){
      setMatchMsg({type:'error',text:`Write failed: ${err.message}. Reloading to re-sync\u2026`});
      setTimeout(()=>onReload(),1500);
    }
  };

  const handleRatingsUpload=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const parsed=parseInitialRatingsCSV(ev.target.result);
        const count=Object.keys(parsed).length;
        if(!count) throw new Error('No valid players found in file');
        if(!confirm(`This will set initial ratings for ${count} players and recalculate all sessions. Continue?`)) return;
        onRatings(parsed);
        setRatingsMsg({type:'ok',text:`Imported ${count} initial ratings.`});
      }catch(err){setRatingsMsg({type:'error',text:err.message});}
    };
    r.readAsText(f);e.target.value='';
  };

  const delSession=async date=>{
    const sess=sessions.find(s=>s.date===date);
    const count=sess?sess.matches.length:0;
    if(!confirm(`Delete the session on ${fmtFull(date)}?\n\nThis permanently removes its ${count} match(es) from Airtable and recalculates all later ratings. Consider exporting a JSON backup first. This cannot be undone.`)) return;
    const ids=sess?sess.matches.map(m=>m.id).filter(Boolean):[];
    if(!ids.length){ onSessions(sessions.filter(s=>s.date!==date)); return; }
    setBusyMsg({type:'',text:`Deleting ${fmtFull(date)} from Airtable…`});
    try{
      await atDeleteBatch(AT_RESULTS,ids,adminSecret);
      atLogActivity('Session deleted',`${fmtFull(date)} — ${ids.length} matches removed`,adminSecret);
      setBusyMsg({type:'ok',text:'✓ Session deleted. Reloading…'});
      setTimeout(()=>onReload(),800);
    }catch(err){
      setBusyMsg({type:'error',text:`Delete failed: ${err.message}`});
    }
  };

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify({sessions,initialRatings,clubName,logoUrl},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spc-backup.json';a.click();
  };

  const importJSON=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.sessions||!data.initialRatings) throw new Error('Invalid backup file');
        if(!confirm('This writes any matches from the backup that are missing into Airtable, and restores club name/logo on this browser. Existing Airtable matches are left untouched. Continue?')) return;
        if(data.initialRatings) onRatings(data.initialRatings);
        if(data.clubName) onClubName(data.clubName);
        if(data.logoUrl) onLogoUrl(data.logoUrl);
        const records=buildNewMatchRecords(sessions,data.sessions||[]);
        if(!records.length){setBusyMsg({type:'ok',text:'✓ Club name/logo restored. No new matches to write.'});return;}
        setBusyMsg({type:'',text:`Writing ${records.length} match(es) to Airtable…`});
        await atPostBatch(AT_RESULTS,records,adminSecret);
        atLogActivity('Backup imported',`${records.length} matches restored from JSON`,adminSecret);
        setBusyMsg({type:'ok',text:`✓ Restored ${records.length} match(es). Reloading…`});
        setTimeout(()=>onReload(),900);

    r.readAsText(f);e.target.value='';

            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          </div>
        </div>
        <div className="p-6">
          {step==='pw'&&(
            codeSent ? (
              <form onSubmit={verifyCode} className="space-y-4">
                <div className="flex items-start gap-3 rounded-xl bg-amber-50 border border-amber-200 p-4">
                  <svg className="w-5 h-5 flex-shrink-0 mt-0.5" style={{color:CORAL_DARK}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 4.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  <div>
                    <p className="text-sm font-bold" style={{color:INK}}>Enter your code</p>
                    <p className="text-sm text-gray-600 mt-1">We've emailed an 8-digit sign-in code to <span className="font-semibold">{email}</span>. Enter it below — it expires after a few minutes.</p>
                  </div>
                </div>
                <input inputMode="numeric" autoComplete="one-time-code" pattern="[0-9]*" maxLength={8} value={code} onChange={e=>setCode(e.target.value.replace(/\D/g,''))} placeholder="12345678" autoFocus aria-label="Sign-in code" className="w-full border border-gray-200 rounded-xl px-3 py-3 text-center text-lg font-bold tracking-[0.3em] focus:outline-none focus:ring-2"/>
                {pwErr&&<p className="text-sm text-red-600" role="alert">{pwErr}</p>}
                <button type="submit" disabled={verifying||code.trim().length<8} className="w-full py-3 rounded-xl text-white font-bold text-sm disabled:opacity-60" style={{background:CORAL_DARK}}>{verifying?'Verifying…':'Verify & sign in'}</button>

                {pwErr&&<p className="text-sm text-red-600" role="alert">{pwErr}</p>}
                <button type="submit" disabled={verifying||!email.trim()} className="w-full py-3 rounded-xl text-white font-bold text-sm disabled:opacity-60" style={{background:CORAL_DARK}}>{verifying?'Sending…':'Email me a sign-in code'}</button>
              </form>

          {step==='panel'&&(

                {[['graded','Graded'],['social','Social']].map(([k,label])=>{
                  const on=adminTab===k;
                  return <button key={k} role="tab" aria-selected={on} onClick={()=>setAdminTab(k)}
                    className={"flex-1 px-4 py-2 rounded-full text-sm font-black transition-colors "+(on?'text-white':'text-gray-500 hover:text-gray-700')}
                    style={on?{background:k==='social'?SOCIAL:CORAL}:undefined}>{label}</button>;
                })}
              </div>
              )}

              {adminTab==='graded'&&(<>
              {/* Session planner launcher */}
              <section>
                <button onClick={()=>onOpenBuilder&&onOpenBuilder()} className="w-full flex items-center justify-between gap-3 px-4 py-3.5 rounded-2xl text-white text-left shadow-sm" style={{background:NAVY}}>
                  <span className="flex items-center gap-3">
                    <span className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0" style={{background:'rgba(255,255,255,0.15)'}}>
                      <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"/></svg>
                    </span>

                      <span className="block text-xs text-white/60">Pick players, set courts, print playslips</span>
                    </span>
                  </span>
                  <svg className="w-5 h-5 text-white/70 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7"/></svg>
                </button>

              <section>
                <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">View / Edit Saved Planned Sessions</h3>
                {plans===null
                  ? <p className="text-xs text-gray-400 py-3 text-center bg-gray-50 rounded-xl">Loading…</p>
                  : plans.length===0
                    ? <p className="text-gray-500 text-sm text-center py-3 bg-gray-50 rounded-xl">No saved plans yet — use “Plan next session” above.</p>

                            <div className="min-w-0">
                              <span className="text-sm font-semibold text-gray-800">{fmtFull(p.played_on)}</span>
                              <span className="text-xs text-gray-500 ml-2">{p.courts} court{p.courts===1?'':'s'} · {p.status==='completed'?'✓ results in':'planned'}</span>
                              {p.published&&<span className="text-[10px] font-black px-1.5 py-0.5 rounded-full text-white ml-2 align-middle" style={{background:GREEN}}>LIVE</span>}
                            </div>
                            <div className="flex gap-1 flex-shrink-0">
                              <button onClick={()=>onOpenBuilder&&onOpenBuilder(p.played_on)} className="text-xs font-bold px-3 py-1.5 rounded-lg text-white" style={{background:NAVY}}>View / edit</button>
                              <button onClick={()=>delPlan(p.played_on)} aria-label={`Delete plan for ${fmtFull(p.played_on)}`} className="text-xs font-semibold text-red-600 hover:bg-red-50 px-2 py-1.5 rounded-lg">Delete</button>
                            </div>
                          </div>
                        ))}
                      </div>}
              </section>
              </>)}

              {adminTab==='social'&&(<>
              {/* Social sessions */}

                </div>
                <p className="text-[11px] text-gray-400 mb-2 -mt-1">Organise any club night (social play never affects graded RDR). Members see published sessions on the Social page.</p>
                {socialList===null
                  ? <p className="text-xs text-gray-400 py-3 text-center bg-gray-50 rounded-xl">Loading…</p>
                  : socialList.length===0
                    ? <p className="text-gray-500 text-sm text-center py-3 bg-gray-50 rounded-xl">No social sessions yet — use “+ New”.</p>
                    : <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                        {socialList.map(s=>(
                          <div key={s.id} className="flex items-center justify-between bg-gray-50 rounded-xl px-4 py-2.5 gap-2">
                            <div className="min-w-0">
                              <div className="text-sm font-semibold text-gray-800 truncate">{s.name||fmtFull(s.played_on)}</div>
                              <div className="text-xs text-gray-500">{fmtFull(s.played_on)} · {SOCIAL_FORMATS[s.format]||s.format}
                                {(()=>{ const today=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
                                  const past=s.played_on<today;
                                  const label=s.status==='complete'?'Complete':past?'Past':s.status==='live'?'Live':'Planned';
                                  const style=(s.status==='complete')?{background:'rgba(16,185,129,0.12)',color:'#047857'}:past?{background:'#f1f5f9',color:'#475569'}:socStatusColor(s.status);
                                  return (<><span className="ml-1.5 text-[10px] font-bold px-1.5 py-0.5 rounded-full capitalize align-middle" style={style}>{label}</span>
                                    {s.published&&!past&&<span className="ml-1 text-[10px] font-black px-1.5 py-0.5 rounded-full text-white align-middle" style={{background:GREEN}}>LIVE</span>}</>);
                                })()}

                            </div>
                            <div className="flex gap-1 flex-shrink-0">
                              <button onClick={()=>onOpenSocial&&onOpenSocial(s)} className="text-xs font-bold px-3 py-1.5 rounded-lg text-white" style={{background:NAVY}}>Open</button>
                              <button onClick={()=>delSocial(s.id,s.name||fmtFull(s.played_on))} aria-label="Delete social session" className="text-xs font-semibold text-red-600 hover:bg-red-50 px-2 py-1.5 rounded-lg">Delete</button>
                            </div>

              </section>

              {/* Sessions list */}
              <section>

        </div>

    </div>
  );

/* ─── LEADERBOARD VIEW ──────────────────────────────────────── */
// A player counts as "not recently played" once they've missed this many consecutive sessions.
const INACTIVE_AFTER_MISSED=4;

function LeaderboardView({snapshot,allSnapshots,matchLog,clubName,logoUrl,onSelectPlayer,onExport,onShare,canShare,exporting,dismissedMilestones,onDismiss,config}){
  const INACT=(config&&config.inactive_after_missed)||INACTIVE_AFTER_MISSED;
  const HOTMIN=(config&&config.hot_streak_min)||3;
  const MILES=(config&&config.milestone_thresholds&&config.milestone_thresholds.length)?config.milestone_thresholds:MILESTONE_THRESHOLDS;
  const showFallers=!(config&&config.show_fallers===false); // per-club: hide the Top Fallers column
  const [view,setView]=useState('leaderboard'); // 'leaderboard' | 'snapshot'
  const [showAll,setShowAll]=useState(true); // include seeded-never-played + inactive players inline
  const [query,setQuery]=useState('');
  // Leaderboard filters (whitespace above the table)
  const [hotOnly,setHotOnly]=useState(false);
  const [confBand,setConfBand]=useState('all');   // all | high | moderate | low | provisional
  const [minGames,setMinGames]=useState(0);
  const [ratingMin,setRatingMin]=useState('');
  const [ratingMax,setRatingMax]=useState('');
  const bounds=useMemo(()=>{const rs=snapshot?snapshot.players.map(p=>p.rating):[];return rs.length?{lo:Math.min(...rs),hi:Math.max(...rs)}:{lo:2,hi:8};},[snapshot]);
  const anyFilter=!!(query||hotOnly||confBand!=='all'||minGames>0||ratingMin!==''||ratingMax!=='');
  const clearFilters=()=>{setQuery('');setHotOnly(false);setConfBand('all');setMinGames(0);setRatingMin('');setRatingMax('');};
  const hot=useMemo(()=>computeHotStreaks(allSnapshots,HOTMIN),[allSnapshots,HOTMIN]);
  const highlights=useMemo(()=>computeHighlights(snapshot),[snapshot]);
  const rf=useMemo(()=>snapshot?computeRisersFallers(snapshot,allSnapshots):null,[snapshot,allSnapshots]);
  // The session immediately before the one being viewed — pos_change is measured against it,
  // so Risers & Fallers covers "since this date". Skips the synthetic baseline if present.
  const rfPrevDate=useMemo(()=>{
    if(!snapshot) return null;
    const i=allSnapshots.findIndex(s=>s.date===snapshot.date);
    for(let j=i-1;j>=0;j--){ if(!allSnapshots[j].baseline) return allSnapshots[j].date; }
    return null;
  },[snapshot,allSnapshots]);

  // Consecutive most-recent sessions (up to & including the selected one) each ranked
  // player has MISSED. 0 = played the selected session. (Seeded players who've never played
  // count every session as missed, but are exempted from hiding below — see everPlayed.)
  const missedCount=useMemo(()=>{
    const m={};
    if(!snapshot) return m;
    // Exclude the synthetic baseline (empty attendance) so it doesn't read as a missed session.
    const upTo=allSnapshots.filter(s=>s.date<=snapshot.date&&!s.baseline);
    snapshot.players.forEach(p=>{
      let c=0;
      for(let i=upTo.length-1;i>=0;i--){
        if(upTo[i].playedInSession&&upTo[i].playedInSession.has(p.name)) break;
        c++;
      }
      m[p.name]=c;
    });
    return m;
  },[snapshot,allSnapshots]);

  // "Core active" = has played at least once AND not missed too many recent sessions.
  // Everyone else is a "reserve": a seeded player yet to play (e.g. a retained member), or a
  // player not seen in INACTIVE_AFTER_MISSED+ sessions. The showAll toggle folds reserves into
  // the ranked board (PBR-style) or hides them for a clean active-only view.
  const everPlayed=name=>!!(matchLog[name]&&matchLog[name].length>0);
  const coreActive=useMemo(()=>
    snapshot?snapshot.players.filter(p=>everPlayed(p.name)&&(missedCount[p.name]||0)<INACT):[]
  ,[snapshot,missedCount,matchLog]);
  const reserveCount=snapshot?snapshot.players.length-coreActive.length:0;
  // Board contents: all players (ranked inline) when showAll, else core-active only.
  const visiblePlayers=useMemo(()=>
    snapshot?(showAll?snapshot.players:coreActive):[]
  ,[snapshot,coreActive,showAll]);
  const activeCount=coreActive.length; // summary cards always reflect TRUE active players
  // Display rank = position within the list currently shown, so hiding reserves renumbers 1..N
  // (rather than showing club-wide positions that skip the hidden players).
  const rankOf=useMemo(()=>{const m={};visiblePlayers.forEach((p,i)=>{m[p.name]=i+1;});return m;},[visiblePlayers]);
  // The club's "top players" per its configurable bar — computed from the full ranked list
  // (not the search-filtered subset) so the crown is a club-wide fact.
  const topSet=useMemo(()=>topPlayerSet(visiblePlayers,(config&&config.top_players)),[visiblePlayers,config]);
  // Type-to-filter for the leaderboard table (hero/summary stay unfiltered).
  const filteredPlayers=useMemo(()=>{
    const q=query.trim().toLowerCase();
    const rmin=ratingMin===''?null:parseFloat(ratingMin);
    const rmax=ratingMax===''?null:parseFloat(ratingMax);
    const bandOf=(name)=>{const g=(matchLog[name]||[]).length; if(g<5) return 'provisional';
      const c=(1-Math.exp(-g/CONF_EXP_K))*Math.exp(-(missedCount[name]||0)/CONF_REC_K)*100;
      return c>=80?'high':c>=50?'moderate':'low';};
    return visiblePlayers.filter(p=>{
      if(q&&!p.name.toLowerCase().includes(q)) return false;
      if(hotOnly&&!hot.has(p.name)) return false;
      if(rmin!=null&&!isNaN(rmin)&&p.rating<rmin) return false;
      if(rmax!=null&&!isNaN(rmax)&&p.rating>rmax) return false;
      if(minGames>0&&((matchLog[p.name]||[]).length<minGames)) return false;
      if(confBand!=='all'&&bandOf(p.name)!==confBand) return false;
      return true;
    });
  },[visiblePlayers,query,hotOnly,ratingMin,ratingMax,minGames,confBand,hot,matchLog,missedCount]);
  // Per-player rating trend over the last 6 sessions up to the selected one (for sparklines).
  const sparkMap=useMemo(()=>{
    const m={};
    if(!snapshot) return m;
    allSnapshots.filter(s=>s.date<=snapshot.date).slice(-6)
      .forEach(s=>s.players.forEach(p=>{(m[p.name]=m[p.name]||[]).push(p.rating);}));
    return m;
  },[snapshot,allSnapshots]);
  const milestones=useMemo(()=>computeMilestones(allSnapshots,MILES),[allSnapshots,MILES]);
  const avg=useMemo(()=>{if(!coreActive.length)return null;const s=coreActive.reduce((a,p)=>a+p.rating,0);return s/coreActive.length;},[coreActive]);
  // Players who actually played the selected session, re-ranked 1..N among themselves,
  // with their W/L that night (from the match log).
  const attendees=useMemo(()=>{
    if(!snapshot||!snapshot.playedInSession) return [];
    return snapshot.players.filter(p=>snapshot.playedInSession.has(p.name)).map((p,i)=>{
      const log=((matchLog&&matchLog[p.name])||[]).filter(m=>m.date===snapshot.date);
      const w=log.filter(m=>m.won).length;
      return {...p,localRank:i+1,w,l:log.length-w,games:log.length};
    });
  },[snapshot,matchLog]);
  // Session achievement call-outs derived from the night's attendees.
  const snapStats=useMemo(()=>{
    const played=attendees.filter(a=>a.games>0);
    if(!played.length) return null;
    const totalGames=Math.round(played.reduce((s,a)=>s+a.games,0)/4);
    const unbeaten=played.filter(a=>a.games>=2&&a.l===0);          // won every game (2+)
    const topGainP=[...played].sort((a,b)=>b.rating_change-a.rating_change)[0];
    const topGain=topGainP&&topGainP.rating_change>0?topGainP:null;
    const topClimber=[...played].filter(a=>a.pos_change>0).sort((a,b)=>b.pos_change-a.pos_change)[0]||null;
    const mostActiveP=[...played].sort((a,b)=>b.games-a.games)[0];
    const mostActive=mostActiveP&&mostActiveP.games>=3?mostActiveP:null;
    let bestWin=null;
    played.forEach(a=>(((matchLog&&matchLog[a.name])||[]).filter(m=>m.date===snapshot.date&&m.won)).forEach(m=>{
      const margin=m.myScore-m.theirScore;
      if(margin>=5&&(!bestWin||margin>bestWin.margin)) bestWin={name:a.name,margin,score:`${m.myScore}–${m.theirScore}`};
    }));
    return {totalGames,unbeaten,topGain,topClimber,mostActive,bestWin};
  },[attendees,matchLog,snapshot]);
  const hasMulti=allSnapshots.length>=2;
  const visible=milestones.filter(m=>!dismissedMilestones.has(m.id));

  if(!snapshot) return <div className="text-center py-20 text-gray-500"><p className="font-medium">No sessions yet</p><p className="text-sm mt-1">Upload match data via Admin to get started.</p></div>;

  return(
    <div className="fade space-y-5">
      {/* View toggle — hidden on the synthetic baseline snapshot (not a real session) */}
      {!snapshot?.baseline&&(
      <div className="inline-flex rounded-xl border border-gray-200 bg-white p-1 text-sm font-semibold">
        <button onClick={()=>setView('leaderboard')} aria-pressed={view==='leaderboard'} className={`px-3 py-1.5 rounded-lg transition-colors ${view==='leaderboard'?'text-white':'text-gray-600 hover:text-gray-900'}`} style={view==='leaderboard'?{background:NAVY}:undefined}>Active leaderboard</button>
        <button onClick={()=>setView('snapshot')} aria-pressed={view==='snapshot'} className={`px-3 py-1.5 rounded-lg transition-colors ${view==='snapshot'?'text-white':'text-gray-600 hover:text-gray-900'}`} style={view==='snapshot'?{background:NAVY}:undefined}>Session snapshot</button>
      </div>
      )}
      {view==='snapshot'&&!snapshot?.baseline?(
        <>
          {/* Session snapshot — only the players who played, re-ranked 1..N */}
          <div id="snap-export" className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div className="px-5 py-4 flex items-center gap-3" style={{background:NAVY}}>
              {logoUrl
                ?<img src={logoUrl} alt="" className="h-9 w-9 rounded-full object-cover ring-2 ring-white/20 flex-shrink-0"/>
                :<PBLogo size={36}/>}
              <div className="min-w-0">
                <div className="text-white font-black text-sm uppercase tracking-wider leading-tight truncate">{clubName}</div>
                <div className="text-white/60 text-xs">Session snapshot · {fmtFull(snapshot.date)} · {attendees.length} played{snapStats?` · ${snapStats.totalGames} games`:''}</div>
              </div>
            </div>
            {snapStats&&(snapStats.unbeaten.length>0||snapStats.topGain||snapStats.topClimber||snapStats.bestWin||snapStats.mostActive)&&(
              <div className="px-4 py-3 bg-gray-50 border-b border-gray-100 flex flex-wrap gap-2">
                {snapStats.unbeaten.length>0&&<span className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-green-100 text-green-800 border border-green-200"><b className="text-[9px] font-black uppercase tracking-wider opacity-70">Unbeaten</b> {snapStats.unbeaten.map(a=>a.name).join(', ')}</span>}
                {snapStats.topGain&&<span className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-orange-100 border border-orange-200" style={{color:CORAL_DARK}}><b className="text-[9px] font-black uppercase tracking-wider opacity-70">Top gain</b> {snapStats.topGain.name} +{snapStats.topGain.rating_change.toFixed(3)}</span>}
                {snapStats.topClimber&&<span className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full border" style={{background:'var(--coral-fill)',color:INK,borderColor:'var(--border)'}}><b className="text-[9px] font-black uppercase tracking-wider opacity-70">Climber</b> {snapStats.topClimber.name} ▲{snapStats.topClimber.pos_change}</span>}
                {snapStats.bestWin&&<span className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-amber-100 text-amber-800 border border-amber-200"><b className="text-[9px] font-black uppercase tracking-wider opacity-70">Biggest win</b> {snapStats.bestWin.score} ({snapStats.bestWin.name})</span>}
                {snapStats.mostActive&&<span className="inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1 rounded-full bg-gray-100 text-gray-700 border border-gray-200"><b className="text-[9px] font-black uppercase tracking-wider opacity-70">Most active</b> {snapStats.mostActive.name} ({snapStats.mostActive.games})</span>}
              </div>
            )}
            {/* Podium */}
            {attendees.length>=3&&(
              <div className="flex items-end justify-center gap-2 px-4 pt-5 pb-1">
                {[attendees[1],attendees[0],attendees[2]].map((p,i)=>{
                  const real=i===1?1:i===0?2:3;
                  const ht=real===1?'h-16':real===2?'h-12':'h-9';
                  const bg=real===1?GOLD:real===2?SILVER:BRONZE;
                  return(
                    <div key={p.name} className="flex flex-col items-center w-1/4 min-w-0">
                      <div className="text-[11px] font-bold text-gray-700 truncate max-w-full">{p.name.split(' ')[0]}</div>
                      <div className="osw text-sm font-semibold mb-1" style={{color:INK}}>{p.rating.toFixed(3)}</div>
                      <div className={`w-full ${ht} rounded-t-lg flex items-start justify-center pt-1`} style={{background:bg}}>
                        <span className="osw text-white font-bold text-sm">{real}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
            {attendees.length===0
              ?<div className="px-5 py-10 text-center text-gray-500 text-sm">No players recorded for this session.</div>
              :<>
              {/* Mobile card list */}
              <div className="sm:hidden divide-y divide-gray-100">
                {attendees.map(p=>(
                  <div key={p.name} className="flex items-center gap-3 px-4 py-3">
                    {p.localRank<=3
                      ?<span className="inline-flex items-center justify-center w-7 h-7 rounded-xl text-sm osw font-bold text-white flex-shrink-0" style={{background:p.localRank===1?GOLD:p.localRank===2?SILVER:BRONZE}}>{p.localRank}</span>
                      :<span className="osw w-7 text-center text-gray-500 font-semibold flex-shrink-0">{p.localRank}</span>}
                    <div className="flex-1 min-w-0">
                      <button onClick={()=>onSelectPlayer&&onSelectPlayer(p.name)} className="font-semibold text-gray-900 text-left truncate block max-w-full">{p.name}</button>
                      <div className="text-[11px] text-gray-500 mt-0.5">
                        {p.games?`${p.w}–${p.l}`:'—'} · #{p.position} overall
                        {p.games>=2&&p.l===0&&<span className="ml-1.5 text-[9px] font-black px-1.5 py-0.5 rounded-full bg-green-100 text-green-800 border border-green-200">UNBEATEN</span>}
                      </div>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <div className="osw text-lg font-semibold leading-none" style={{color:INK}}>{p.rating.toFixed(3)}</div>
                      <div className="text-[11px] font-mono font-bold mt-0.5" style={{color:p.rating_change>0?GREEN:p.rating_change<0?RED:'var(--text-muted)'}}>{p.rating_change>0?'+':''}{p.rating_change?p.rating_change.toFixed(3):'—'}</div>
                    </div>
                  </div>
                ))}
              </div>
              {/* Desktop table */}
              <div className="hidden sm:block overflow-x-auto"><table className="w-full text-sm">
                <thead><tr className="bg-gray-50 border-b border-gray-100">
                  <th className="px-4 py-2.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-10">#</th>
                  <th className="px-4 py-2.5 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Player</th>
                  <th className="px-3 py-2.5 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">W–L</th>
                  <th className="px-4 py-2.5 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">RDR</th>
                  <th className="px-3 py-2.5 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Δ Session</th>
                  <th className="px-4 py-2.5 text-right text-xs font-bold text-gray-500 uppercase tracking-wider pr-5">Overall</th>
                </tr></thead>
                <tbody>
                  {attendees.map((p,i)=>(
                    <tr key={p.name} className={`border-t border-gray-50 ${i%2===1?'bg-gray-50/40':'bg-white'}`}>
                      <td className="px-4 py-3">
                        {p.localRank<=3
                          ?<span className="inline-flex items-center justify-center w-7 h-7 rounded-xl text-sm osw font-bold text-white" style={{background:p.localRank===1?GOLD:p.localRank===2?SILVER:BRONZE}}>{p.localRank}</span>
                          :<span className="text-gray-500 font-semibold">{p.localRank}</span>}
                      </td>
                      <td className="px-4 py-3">
                        <div className="flex items-center gap-2 flex-wrap">
                          <button onClick={()=>onSelectPlayer&&onSelectPlayer(p.name)} className="font-semibold text-gray-900 hover:text-orange-600 hover:underline text-left">{p.name}</button>
                          {p.games>=2&&p.l===0&&<span className="text-[10px] font-black px-1.5 py-0.5 rounded-full bg-green-100 text-green-800 border border-green-200" title="Won all games this session">UNBEATEN</span>}
                        </div>
                      </td>
                      <td className="px-3 py-3 text-center font-mono text-gray-600">{p.games?`${p.w}–${p.l}`:'—'}</td>
                      <td className="px-4 py-3 text-right osw text-base font-semibold" style={{color:INK}}>{p.rating.toFixed(3)}</td>
                      <td className="px-3 py-3 text-right font-mono font-bold" style={{color:p.rating_change>0?GREEN:p.rating_change<0?RED:'var(--text-muted)'}}>
                        {p.rating_change>0?'+':''}{p.rating_change?p.rating_change.toFixed(3):'—'}
                      </td>
                      <td className="px-4 py-3 text-right pr-5 whitespace-nowrap">
                        <span className="text-gray-500 font-semibold">#{p.position}</span>
                        {p.pos_change!==0&&<span className="ml-1.5 text-xs font-bold" style={{color:p.pos_change>0?GREEN:RED}}>{p.pos_change>0?`▲${p.pos_change}`:`▼${Math.abs(p.pos_change)}`}</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table></div>
              </>}
          <PBStamp/>
          </div>
          <p className="text-xs text-gray-500">Ranked among players who played this session. <span className="font-semibold">Δ Session</span> is the RDR change that night; <span className="font-semibold">Overall</span> is club-wide position. Tap a name for full stats.</p>
          <div className="flex justify-end gap-2">
            {canShare&&(
              <button onClick={()=>onShare('snap-export',`session-${snapshot.date}`)} disabled={exporting||attendees.length===0} className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-bold text-sm hover:opacity-90 disabled:opacity-50" style={{background:CORAL_DARK}}>
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8.684 13.342a3 3 0 100-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 9.316a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684zm0-9.316a3 3 0 105.368-2.684 3 3 0 00-5.368 2.684z"/></svg>
                Share
              </button>
            )}
            <button onClick={()=>onExport('snap-export',`session-${snapshot.date}`)} disabled={exporting||attendees.length===0} className="flex items-center gap-2 px-5 py-2.5 rounded-xl text-white font-bold text-sm hover:opacity-90 disabled:opacity-50" style={{background:NAVY}}>
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
              {exporting?'Exporting…':'Export PNG'}
            </button>
          </div>
        </>
      ):(<>
      {/* Baseline explainer — the all-zero baseline view reads as intentional, not a bug */}
      {snapshot.baseline&&(
        <div className="rounded-2xl px-4 py-3 flex items-start gap-3 border" style={{background:'var(--coral-fill)',borderColor:'var(--border)'}}>
          <svg className="w-5 h-5 flex-shrink-0 mt-0.5" style={{color:CORAL_DARK}} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          <div className="text-sm" style={{color:'var(--text-soft)'}}>
            <span className="font-bold" style={{color:'var(--text)'}}>Baseline standings.</span> The club's ratings adopted on {fmtFull(snapshot.date)} — the agreed starting line. Ratings only start moving once sessions are logged after this date, so there's no week-on-week movement to show yet.
          </div>
        </div>
      )}
      {/* Milestones */}
      {visible.length>0&&(
        <div>
          <div className="text-xs font-bold text-amber-700 uppercase tracking-widest mb-2">Club Milestones</div>
          <div className="flex gap-3 overflow-x-auto pb-1">
            {visible.map(m=>(
              <div key={m.id} className="flex-shrink-0 bg-amber-50 border border-amber-200 rounded-2xl px-4 py-3 flex items-start gap-3 min-w-[200px]">
                <div className="flex-1"><div className="text-sm font-bold text-amber-900 leading-snug">{m.text}</div><div className="text-xs text-amber-700 mt-0.5">{m.sub}</div></div>
                <button onClick={()=>onDismiss(m.id)} aria-label="Dismiss milestone" className="text-amber-500 hover:text-amber-700 -mt-0.5 -mr-1 p-1.5 flex-shrink-0">
                  <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
              </div>
            ))}
          </div>
        </div>
      )}
      {/* Summary cards */}
      <div className={`grid gap-3 ${hasMulti?'grid-cols-3':'grid-cols-2'}`}>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 card-hover" style={{borderTop:`3px solid ${CORAL}`}}>
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Avg RDR (Active)</div>
          <div className="osw text-3xl font-bold" style={{color:INK}}>{avg===null?'—':<CountUp value={avg} decimals={3}/>}</div>
          <div className="text-xs text-gray-500 mt-0.5">Across active players</div>
        </div>
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 card-hover" style={{borderTop:`3px solid ${NAVY}`}}>
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Active Players</div>
          <div className="osw text-3xl font-bold" style={{color:INK}}><CountUp value={activeCount}/></div>
          <div className="text-xs text-gray-500 mt-0.5">Played in last {INACT} sessions</div>
        </div>
        {hasMulti&&<div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 card-hover" style={{borderTop:`3px solid ${AMBER}`}}>
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Hot Streaks</div>
          <div className="osw text-3xl font-bold" style={{color:CORAL_DARK}}><CountUp value={hot.size}/></div>
          <div className="text-xs text-gray-500 mt-0.5">Rising 3+ sessions</div>
        </div>}
      </div>
      {/* Highlights */}
      {highlights&&(highlights.mostImproved.length>0||highlights.biggestMover.length>0)&&(
        <div>
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">This Session's Highlights</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {highlights.mostImproved.length>0&&(
              <div className="rounded-2xl p-4 text-white relative overflow-hidden" style={{background:`linear-gradient(135deg,${CORAL_DARK},#9a3412)`}}>
                <div className="text-xs font-black uppercase tracking-widest opacity-75 mb-2">Most Improved</div>
                {highlights.mostImproved.map(p=>(
                  <div key={p.name}><div className="text-lg font-black">{p.name}</div>
                  <div className="text-2xl font-black">+{p.rating_change.toFixed(4)}</div>
                  <div className="text-xs opacity-75 mt-1">rating · now #{p.position}</div></div>
                ))}
                <div className="absolute -right-3 -bottom-3 text-white/10 text-8xl font-black select-none">▲</div>
              </div>
            )}
            {highlights.biggestMover.length>0&&(
              <div className="rounded-2xl p-4 text-white relative overflow-hidden" style={{background:`linear-gradient(135deg,${NAVY},#2d4a7a)`}}>
                <div className="text-xs font-black uppercase tracking-widest opacity-75 mb-2">Biggest Mover</div>
                {highlights.biggestMover.map(p=>(
                  <div key={p.name}><div className="text-lg font-black">{p.name}</div>
                  <div className="text-2xl font-black">+{p.pos_change} places</div>
                  <div className="text-xs opacity-75 mt-1">now #{p.position} · {p.rating.toFixed(3)}</div></div>
                ))}
                <div className="absolute -right-3 -bottom-3 text-white/10 text-8xl font-black select-none">★</div>
              </div>
            )}
          </div>
        </div>
      )}
      {/* Top-of-club hero */}
      {visiblePlayers.length>0&&(
        <div className="rounded-2xl p-5 text-white relative overflow-hidden card-hover" style={{background:`linear-gradient(120deg,${CORAL_DARK},${CORAL})`}}>
          <div className="flex items-center gap-1.5 text-[10px] uppercase tracking-[0.25em] font-bold opacity-90">
            <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="M3 7l4 4 5-6 5 6 4-4v11a1 1 0 01-1 1H4a1 1 0 01-1-1V7z"/></svg>
            Top of the club
