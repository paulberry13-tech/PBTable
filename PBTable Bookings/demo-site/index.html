/* ─── PLAYER VIEW ───────────────────────────────────────────── */
function PlayerView({playerName,computed,latestSnap,config}){
  const log=computed.matchLog[playerName]||[];
  const ratingHistory=useMemo(()=>getPlayerRatingHistory(computed.matchLog,computed.snapshots,playerName),[computed,playerName]);
  const catchData=useMemo(()=>getOnesToCatch(latestSnap,playerName),[latestSnap,playerName]);
  const h2h=useMemo(()=>getHeadToHead(log),[log]);
  // Best partners (v1): who this player performs best alongside — by win rate, then points margin.
  const partners=useMemo(()=>{
    const m={};
    log.forEach(g=>{ const k=g.partner; if(!k) return; if(!m[k]) m[k]={name:k,games:0,wins:0,pf:0,pa:0}; m[k].games++; if(g.won)m[k].wins++; m[k].pf+=g.myScore; m[k].pa+=g.theirScore; });
    return Object.values(m)
      .map(p=>({name:p.name,games:p.games,wins:p.wins,losses:p.games-p.wins,winPct:Math.round(p.wins/p.games*100),avgMargin:(p.pf-p.pa)/p.games}))
      .filter(p=>p.games>=2)
      .sort((a,b)=> b.winPct-a.winPct || b.avgMargin-a.avgMargin || b.games-a.games);
  },[log]);
  const consistency=useMemo(()=>computeConsistencyScore(ratingHistory.map(r=>r.rating)),[ratingHistory]);
  // Consecutive most-recent sessions missed (for the DUPR-style confidence score).
  const missedSessions=useMemo(()=>{
    const snaps=computed.snapshots.filter(s=>!s.baseline);let c=0;
    for(let i=snaps.length-1;i>=0;i--){ if(snaps[i].playedInSession&&snaps[i].playedInSession.has(playerName)) break; c++; }
    return c;
  },[computed,playerName]);
  const confidence=useMemo(()=>confidenceScore(log.length,missedSessions),[log,missedSessions]);

  if(!latestSnap) return <div className="text-center py-20 text-gray-500">No session data available.</div>;
  const currentData=latestSnap.players.find(p=>p.name===playerName);
  if(!currentData) return <div className="text-center py-20 text-gray-500">No data found for {playerName}.</div>;

  const wins=log.filter(m=>m.won).length;
  const losses=log.filter(m=>!m.won).length;
  const gamesPlayed=log.length;
  const winPct=gamesPlayed?Math.round(wins/gamesPlayed*100):0;
  const peakRating=ratingHistory.length?Math.max(...ratingHistory.map(r=>r.rating)):currentData.rating;
  const peakPosition=ratingHistory.length?Math.min(...ratingHistory.map(r=>r.position)):currentData.position;
  const hasHistory=ratingHistory.length>=2;
  const last5=[...log].slice(-5);
  const seasonMove=ratingHistory.length>=2?ratingHistory[0].position-ratingHistory[ratingHistory.length-1].position:null;
  // Current streak from ratingHistory positions
  let streakType='neutral',streakCount=0;
  if(ratingHistory.length>=2){
    const pos=ratingHistory.map(r=>r.position);
    const n=pos.length;
    const d=pos[n-1]-pos[n-2];
    if(d===0){streakType='steady';}
    else{const rising=d<0;streakType=rising?'rising':'falling';streakCount=1;for(let i=n-2;i>0;i--){const dd=pos[i]-pos[i-1];if(rising?dd<0:dd>0)streakCount++;else break;}}
  }
  const topPercent=Math.max(1,Math.round(currentData.position/latestSnap.players.length*100));
  const isTopPlayer=topPlayerSet(latestSnap.players,(config&&config.top_players)).has(playerName);
  const chartLabels=ratingHistory.map(r=>fmtShort(r.date));
  const ratingData=ratingHistory.map(r=>r.rating);
  const posData=ratingHistory.map(r=>r.position);
  const recentMatches=[...log].slice(-10).reverse();

  const streakBadge=()=>{
    if(streakType==='neutral'||streakType==='steady') return {text:'Holding steady',color:'var(--text-muted)'};
    if(streakType==='rising') return {text:`Rising ${streakCount} session${streakCount===1?'':'s'} 🔥`,color:GREEN};
    return {text:`Falling ${streakCount} session${streakCount===1?'':'s'}`,color:RED};
  };
  const sb=streakBadge();

  return(
    <div className="space-y-5 fade">
      {/* Hero */}
      <div className="rounded-2xl p-6 text-white relative overflow-hidden" style={{background:`linear-gradient(135deg,${NAVY},#2d4a7a)`}}>
        <div className="flex items-start justify-between gap-4">
          <div>
            <div className="text-xs font-bold uppercase tracking-widest opacity-60 mb-1">Player Profile</div>
            <div className="osw text-2xl sm:text-3xl font-bold uppercase tracking-wide leading-tight">{playerName}{isTopPlayer&&<span title="Top player" className="ml-2 align-middle">👑</span>}</div>
            <div className="osw text-4xl font-bold mt-2" style={{color:CORAL}}><CountUp value={currentData.rating} decimals={3}/></div>
            <div className="text-sm opacity-70 mt-1">RDR Rating</div>
          </div>
          <div className="text-right flex-shrink-0">
            <div className="osw text-5xl font-bold opacity-20">#{currentData.position}</div>
            {currentData.rating_change!==0&&(
              <div className="text-lg font-black mt-1" style={{color:currentData.rating_change>0?GREEN:RED}}>
                {currentData.rating_change>0?'+':''}{currentData.rating_change.toFixed(4)}
              </div>
            )}
            <div className="text-xs opacity-60">this session</div>
          </div>
        </div>
      </div>

      {/* Stats grid */}
      <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Current Rank</div>
          <div className="osw text-3xl font-bold leading-none" style={{color:INK}}>#{currentData.position}</div>
          <div className="text-xs text-gray-500 mt-1">Top {topPercent}% of club</div>
        </div>
        <StatCard label="Games Played" value={gamesPlayed} sub={gamesPlayed?`${wins}W · ${losses}L`:undefined}/>
        <StatCard label="Win Rate" value={gamesPlayed?`${winPct}%`:'—'} valueColor={winPct>=50?GREEN:winPct>0?RED:undefined}/>
        <StatCard label="Peak Rating" value={peakRating.toFixed(3)} sub="All time" valueColor={CORAL_DARK}/>
        <StatCard label="Peak Position" value={`#${peakPosition}`} sub="All time" valueColor={INK}/>
        {consistency?<div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Consistency</div>
          <div className="osw text-3xl font-bold" style={{color:consistency.score>=7?GREEN:consistency.score>=4?AMBER:RED}}>{consistency.score}<span className="text-base text-gray-500">/10</span></div>
          <div className="text-xs text-gray-500 mt-1">Lower volatility = higher</div>
        </div>:<div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Consistency</div>
          <div className="text-xs text-gray-500 mt-3">Need 3+ sessions</div>
        </div>}
        <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Confidence</div>
          <div className="osw text-3xl font-bold" style={{color:confColor(confidence)}}>{confidence.pct}<span className="text-base text-gray-500">%</span></div>
          <div className="text-xs text-gray-500 mt-1">{confidence.label} · rating reliability</div>
        </div>
        {seasonMove!==null&&<div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
          <div className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Season Movement</div>
          <div className="osw text-2xl font-bold" style={{color:seasonMove>0?GREEN:seasonMove<0?RED:'var(--text-muted)'}}>
            {seasonMove>0?`▲ ${seasonMove}`:seasonMove<0?`▼ ${Math.abs(seasonMove)}`:'—'}
          </div>
          <div className="text-xs text-gray-500 mt-1">positions since first session</div>

/* ─── LAZY LOADER ───────────────────────────────────────────── */
// html2canvas is only needed for the admin Export PNG; load it on first use so
// public visitors don't download ~150KB up front.
function ensureHtml2Canvas(){
  if(window.html2canvas) return Promise.resolve();
  return new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
    s.onload=()=>res();
    s.onerror=()=>rej(new Error('Failed to load the export library.'));
    document.head.appendChild(s);
  });
}

/* ─── SESSION PLANNER: court scheduler (pure) ────────────────────
   Ranking decides which COURT a player is on (Court 1 = strongest). Court sizes
   are 4–6 (so a court count C needs 4·C ≤ players ≤ 6·C). Each court plays a TARGET
   number of games (default 6); within a court we balance sit-outs (everyone sits an
   equal number ±1) and vary partnerships (avoid repeats until forced). 4-player
   courts have no sit-out; 5 = 1 resting per game; 6 = 2 resting per game. */
// Generate `targetGames` rounds for a court of n players (indices 0..n-1, ranked).
function genRotation(n,targetGames,opts){
  const G=(opts&&opts.mixed&&opts.genders)?opts.genders:null; // gender per court index → prefer 1M+1F teams
  const L=(opts&&opts.locked&&opts.locked.length)?opts.locked:null; // [[i,j],…] court-index pairs to keep partnered
  const sit=Array(n).fill(0), partner={}, pk=(a,b)=>a<b?a+'-'+b:b+'-'+a, numSit=n-4, rounds=[];
  for(let r=0;r<targetGames;r++){
    const order=[...Array(n).keys()].sort((a,b)=>sit[a]-sit[b]||a-b); // sit the least-sat first
    const sitters=order.slice(0,numSit), playing=order.slice(numSit).sort((a,b)=>a-b);
    sitters.forEach(i=>sit[i]++);
    const [p,q,s,t]=playing;
    const splits=[[[p,q],[s,t]],[[p,s],[q,t]],[[p,t],[q,s]]];
    let best=splits[0],bestC=Infinity;
    for(const sp of splits){ let c=(partner[pk(sp[0][0],sp[0][1])]||0)+(partner[pk(sp[1][0],sp[1][1])]||0);
      if(G) c+=(teamNotMixed(G[sp[0][0]],G[sp[0][1]])+teamNotMixed(G[sp[1][0]],G[sp[1][1]]))*1000;
      if(L) for(const [li,lj] of L){ const a=sp[0].includes(li)?0:(sp[1].includes(li)?1:-1), b=sp[0].includes(lj)?0:(sp[1].includes(lj)?1:-1); if(a>=0&&b>=0&&a!==b) c+=5000; } // keep locked pairs partnered
      if(c<bestC){bestC=c;best=sp;} }
    partner[pk(best[0][0],best[0][1])]=(partner[pk(best[0][0],best[0][1])]||0)+1;
    partner[pk(best[1][0],best[1][1])]=(partner[pk(best[1][0],best[1][1])]||0)+1;
    rounds.push({teamA:best[0],teamB:best[1],sit:sitters.slice()});
  }
  return rounds;
}
// Court sizes for P players across C courts (each 4–6), larger courts first.
function courtSizes(P,C){ const base=Math.floor(P/C),rem=P%C,s=[]; for(let i=0;i<C;i++) s.push(i<rem?base+1:base); return s; }
// Plain-English description of what `g` games does on a court of `n` players.
function courtCoverage(n,g){
  const total=n*(n-1)/2;
  const onceGames=(n*(n-1))%4===0 ? n*(n-1)/4 : null; // whole games for "each pairing exactly once" (null if it never divides evenly, e.g. n=6)
  const pk=(a,b)=>a<b?a+'-'+b:b+'-'+a, pc={};
  const rounds=genRotation(n,g);
  rounds.forEach(r=>[r.teamA,r.teamB].forEach(t=>{const k=pk(t[0],t[1]);pc[k]=(pc[k]||0)+1;}));
  const counts=Object.values(pc), played=counts.length, max=counts.length?Math.max(...counts):0, min=counts.length?Math.min(...counts):0;
  const sit={}; for(let i=0;i<n;i++)sit[i]=0; rounds.forEach(r=>r.sit.forEach(s=>sit[s]++));
  const sv=[...new Set(Object.values(sit))].sort((a,b)=>a-b);
  const sitTxt = n===4 ? 'nobody sits out' : `each player sits out ${sv.join('–')}×`;
  let summary;
  if(played<total) summary=`only ${played} of the ${total} possible pairings get to play — ${total-played} pair${total-played>1?'s':''} never meet`;
  else if(max===min) summary=`everyone partners everyone exactly ${max===1?'once':(max===2?'twice':max+'×')}`;
  else { const atMax=counts.filter(c=>c===max).length; summary=`everyone partners everyone — ${atMax} pair${atMax>1?'s':''} ${max}×, the rest ${min===1?'once':min+'×'}`; }

function courtOptions(P){ const r=validCourtRange(P); if(!r) return []; const o=[]; for(let c=r[0];c<=r[1];c++)o.push(c); return o; }
// Fair games for a court of n players, snapped to the nearest even cycle around the
// admin's target: a 4-player court repeats fully every 3 games, a 5-player court every
// 5 — so each pairing (and each rest) comes out even. 6+ has no small clean cycle, so
// we honour the target there and let the coverage summary explain it.
function fairGamesForCourt(n,target){
  target=Math.max(1,target||6);
  const block = n===4?3 : n===5?5 : null;
  if(!block) return target;
  return Math.max(block, Math.round(target/block)*block);
}
// Games-per-court values worth offering for a set of court sizes. Each size has a fair
// cadence (a 4-player court repeats every 3 games, a 5-player every 5; a 6-player court
// has no clean cycle, so we offer a steady 4). We take multiples 1–4 of each present
// size, dedupe, sort and cap at 16 — so the dropdown only ever shows counts that come
// out even for the courts the admin actually has.
function gameOptions(sizes){
  const set=new Set();
  [...new Set(sizes)].forEach(n=>{ const b=n===4?3:n===5?5:4; for(let k=1;k<=4;k++) set.add(b*k); });
  return [...set].filter(g=>g>=1&&g<=16).sort((a,b)=>a-b);

// Short dropdown label; flags a whole round-robin when every court is the same size.
function gameOptLabel(g,sizes){
  const d=[...new Set(sizes)];
  if(d.length===1){ const n=d[0], once=(n*(n-1))%4===0?n*(n-1)/4:null;
    if(once&&g%once===0){ const x=g/once; return `${g} games · full round-robin${x>1?' ×'+x:''}`; } }
  return `${g} game${g===1?'':'s'}`;

// players: array sorted STRONGEST FIRST, each {name,rating}. targetGames: guide games per court (auto-adjusted per court size for fairness).
function buildSchedule(players,numCourts,targetGames,sizesOverride,opts){
  const P=players.length, C=numCourts;
  if(C<1) return {ok:false,error:'Pick at least one court.'};
  if(P<4*C||P>6*C) return {ok:false,error:`With ${C} court${C>1?'s':''} you need between ${4*C} and ${6*C} players — you have ${P}.`};
  const tg=Math.max(1,targetGames||6);
  // admin can choose which courts hold the extra player(s); else default (larger courts first)
  const okOverride=Array.isArray(sizesOverride)&&sizesOverride.length===C&&sizesOverride.every(s=>s>=4&&s<=6)&&sizesOverride.reduce((a,b)=>a+b,0)===P;
  const sizes=okOverride?sizesOverride:courtSizes(P,C);
  const courts=[]; let idx=0;
  for(let c=0;c<C;c++){
    const size=sizes[c], group=players.slice(idx,idx+size); idx+=size;
    const cg=fairGamesForCourt(size,tg); // each court plays the fair count for its size
    const gopts={};
    if(opts&&opts.mixed){ gopts.mixed=true; gopts.genders=group.map(p=>p.gender); }
    if(opts&&opts.pairs&&opts.pairs.length){ const idxOf=nm=>group.findIndex(p=>p.name===nm);
      gopts.locked=opts.pairs.map(([a,b])=>[idxOf(a),idxOf(b)]).filter(([i,j])=>i>=0&&j>=0); }
    const games=genRotation(size,cg,(gopts.mixed||gopts.locked)?gopts:undefined).map((g,ri)=>({round:ri+1,
      teamA:[group[g.teamA[0]].name,group[g.teamA[1]].name],
      teamB:[group[g.teamB[0]].name,group[g.teamB[1]].name],
      sitOut:g.sit.map(i=>group[i].name)})); // sitOut is an array (0–2 names)
    courts.push({court:c+1,size,players:group.map(p=>({name:p.name,rating:p.rating})),games});
  }
  return {ok:true,courts};
}

// Balanced court assignment: take a strongest-first ordered list and snake-distribute it into
// C courts (sizes 4–6, largest first) so each court holds a spread of abilities. Returns a flat
// array whose contiguous slices (per courtSizes) are the balanced courts — ready for buildSchedule.
function balancedSeed(orderedPlayers,C){
  const sizes=courtSizes(orderedPlayers.length,C);         // e.g. [6,5,5]
  const buckets=sizes.map(()=>[]);
  let ci=0, dir=1;                                          // serpentine across courts
  for(const p of orderedPlayers){
    // skip full buckets while snaking
    let guard=0;
    while(buckets[ci].length>=sizes[ci] && guard++<=C*2){ ci+=dir; if(ci>=C){ci=C-1;dir=-1;} else if(ci<0){ci=0;dir=1;} }
    buckets[ci].push(p);
    ci+=dir; if(ci>=C){ci=C-1;dir=-1;} else if(ci<0){ci=0;dir=1;}
  }
  return buckets.flat();
}
// RANDOM DRAW: pure luck of the draw (Fisher–Yates). Courts are whoever falls where.
function randomSeed(players){ const a=[...players]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
// PROTECT THE NEWCOMERS: snake the rated players across courts (so every court has an
// experienced anchor, spread by strength) then spread the unrated/new players round-robin
// so beginners are never clustered onto one court.
function protectSeed(players,C){
  const sizes=courtSizes(players.length,C), buckets=sizes.map(()=>[]);
  const rated=players.filter(p=>p.rating!=null).sort((a,b)=>b.rating-a.rating);
  const unrated=players.filter(p=>p.rating==null);
  let ci=0,dir=1; const step=()=>{ci+=dir; if(ci>=C){ci=C-1;dir=-1;} else if(ci<0){ci=0;dir=1;}};
  for(const p of rated){ let g=0; while(buckets[ci].length>=sizes[ci]&&g++<=C*2)step(); buckets[ci].push(p); step(); }
  ci=0; for(const p of unrated){ let g=0; while(buckets[ci].length>=sizes[ci]&&g++<=C*2)ci=(ci+1)%C; buckets[ci].push(p); ci=(ci+1)%C; }
  return buckets.flat();
}
// MIXED DOUBLES seed: interleave men & women so every contiguous court slice is
// gender-balanced; 'other'/unset players (wildcards) go last. Pair-mixing happens in
// genRotation via the mixed preference below.
function mixedSeed(players){
  const M=players.filter(p=>p.gender==='male'), F=players.filter(p=>p.gender==='female'), O=players.filter(p=>p.gender!=='male'&&p.gender!=='female');
  const out=[], mx=Math.max(M.length,F.length);
  for(let i=0;i<mx;i++){ if(M[i])out.push(M[i]); if(F[i])out.push(F[i]); }
  return [...out,...O];
}
// A doubles team of two same-gender players (both male or both female) is "not mixed";
// a male+female or anyone paired with an 'other'/unset wildcard counts as mixed.
function teamNotMixed(gi,gj){ return (gi&&gj&&gi!=='other'&&gj!=='other'&&gi===gj)?1:0; }
// KEEP PAIRS TOGETHER: seed so both members of each locked pair land in the SAME court
// (as a 2-slot unit), snake-distributed by combined strength; singles fill the rest.
// genRotation then keeps each pair partnered via opts.locked.
function keepPairsSeed(players, C, pairs){
  const byName=Object.fromEntries(players.map(p=>[p.name,p]));
  const inPair=new Set(), units=[];
  (pairs||[]).forEach(([a,b])=>{ if(byName[a]&&byName[b]&&!inPair.has(a)&&!inPair.has(b)){ inPair.add(a);inPair.add(b); units.push({members:[byName[a],byName[b]],size:2,rating:((byName[a].rating||0)+(byName[b].rating||0))/2}); }});
  players.forEach(p=>{ if(!inPair.has(p.name)) units.push({members:[p],size:1,rating:p.rating||0}); });
  units.sort((a,b)=>b.rating-a.rating);
  const sizes=courtSizes(players.length,C), buckets=sizes.map(()=>[]);
  let ci=0,dir=1; const step=()=>{ci+=dir; if(ci>=C){ci=C-1;dir=-1;} else if(ci<0){ci=0;dir=1;}};
  for(const u of units){ let g=0; while(buckets[ci].length+u.size>sizes[ci]&&g++<=C*3)step();
    if(buckets[ci].length+u.size>sizes[ci]){ const k=buckets.findIndex((b,i)=>b.length+u.size<=sizes[i]); if(k>=0)ci=k; }
    u.members.forEach(m=>buckets[ci].push(m)); step();
  }
  return buckets.flat();
}
// Live standings from entered scores. Ranked wins → point difference → points scored → name.
// A game counts only when BOTH scores are entered; higher score wins, equal = a draw.
function computeStandings(courts,scores){
  const st={}; const ensure=n=>st[n]||(st[n]={name:n,games:0,wins:0,draws:0,losses:0,pf:0,pa:0});
  (courts||[]).forEach(ct=>ct.games.forEach(g=>{
    const k=`${ct.court}-${g.round}`, sc=scores[k]||{};
    const s1=parseInt(sc.s1,10), s2=parseInt(sc.s2,10);
    if(isNaN(s1)||isNaN(s2)) return;
    const A=[g.teamA[0],g.teamA[1]], B=[g.teamB[0],g.teamB[1]];
    A.forEach(n=>{const p=ensure(n);p.games++;p.pf+=s1;p.pa+=s2;});
    B.forEach(n=>{const p=ensure(n);p.games++;p.pf+=s2;p.pa+=s1;});
    if(s1>s2){A.forEach(n=>ensure(n).wins++);B.forEach(n=>ensure(n).losses++);}
    else if(s2>s1){B.forEach(n=>ensure(n).wins++);A.forEach(n=>ensure(n).losses++);}
    else{A.concat(B).forEach(n=>ensure(n).draws++);}
  }));
  return Object.values(st).map(p=>({...p,diff:p.pf-p.pa}))
    .sort((a,b)=>b.wins-a.wins||b.diff-a.diff||b.pf-a.pf||a.name.localeCompare(b.name));
}

/* ─── DYNAMIC FORMAT ENGINES (king / ladder / mexicano) ──────────
   These formats are round-by-round: each new round is computed from the entered scores
   of the rounds so far. Courts are 2v2. A round = {games:[{court,teamA:[n,n],teamB:[n,n]}],
   sitOut:[n]}; dynamic scores are keyed `${roundIndex}-${court}` → {s1,s2}. All Node-tested. */
function dynAggregate(rounds,scores){
  const st={}; const ensure=n=>st[n]||(st[n]={name:n,games:0,wins:0,losses:0,draws:0,pf:0,pa:0,sat:0});
  (rounds||[]).forEach((rd,ri)=>{
    (rd.sitOut||[]).forEach(n=>ensure(n).sat++);
    (rd.games||[]).forEach(g=>{
      const sc=(scores||{})[`${ri}-${g.court}`]||{};
      const s1=parseInt(sc.s1,10), s2=parseInt(sc.s2,10);
      if(isNaN(s1)||isNaN(s2)) return;
      const A=g.teamA, B=g.teamB;
      A.forEach(n=>{const p=ensure(n);p.games++;p.pf+=s1;p.pa+=s2;});
      B.forEach(n=>{const p=ensure(n);p.games++;p.pf+=s2;p.pa+=s1;});
      if(s1>s2){A.forEach(n=>ensure(n).wins++);B.forEach(n=>ensure(n).losses++);}
      else if(s2>s1){B.forEach(n=>ensure(n).wins++);A.forEach(n=>ensure(n).losses++);}
      else{A.concat(B).forEach(n=>ensure(n).draws++);}
    });
  });
  Object.values(st).forEach(p=>p.diff=p.pf-p.pa);
  return st;
}
function dynStandings(rounds,scores,sortKey){
  const arr=Object.values(dynAggregate(rounds,scores));
  arr.sort((a,b)=> sortKey==='points'
    ? (b.pf-a.pf)||(b.wins-a.wins)||(b.diff-a.diff)||a.name.localeCompare(b.name)
    : (b.wins-a.wins)||(b.diff-a.diff)||(b.pf-a.pf)||a.name.localeCompare(b.name));
  return arr;
}
function pairCourt(q){ return {teamA:[q[0],q[3]], teamB:[q[1],q[2]]}; } // balanced 1&4 vs 2&3
// Mexicano (points) / Ladder (wins): re-rank everyone, reform courts of 4 by rank, fair sit-out rotation.
function dynGlobalRound(orderNames, rounds, scores, C, sortKey){
  const agg=dynAggregate(rounds,scores); const idx=n=>orderNames.indexOf(n);
  const ranked=[...orderNames].sort((a,b)=>{
    const A=agg[a]||{}, B=agg[b]||{};
    return sortKey==='points'
      ? (B.pf||0)-(A.pf||0)||(B.wins||0)-(A.wins||0)||(B.diff||0)-(A.diff||0)||idx(a)-idx(b)
      : (B.wins||0)-(A.wins||0)||(B.diff||0)-(A.diff||0)||(B.pf||0)-(A.pf||0)||idx(a)-idx(b);
  });
  const need=orderNames.length-4*C; let sitOut=[];
  if(need>0){ const rrank=n=>ranked.indexOf(n);
    sitOut=[...orderNames].sort((a,b)=>((agg[a]||{}).sat||0)-((agg[b]||{}).sat||0)||rrank(b)-rrank(a)).slice(0,need); }
  const playing=ranked.filter(n=>!sitOut.includes(n)), games=[];
  for(let c=0;c<C;c++){ const q=playing.slice(c*4,c*4+4); if(q.length<4) break; const pr=pairCourt(q); games.push({court:c+1,teamA:pr.teamA,teamB:pr.teamB}); }
  return {games, sitOut};
}
// King of the court: winners up a court, losers down; top winners stay, bottom losers stay;
// re-mix the relegated & promoted pairs. Needs exactly 4 players per court (no sit-outs).
function dynKingRound(orderNames, rounds, scores, C){
  if(rounds.length===0){
    const games=[];
    for(let c=0;c<C;c++){ const q=orderNames.slice(c*4,c*4+4); const pr=pairCourt(q); games.push({court:c+1,teamA:pr.teamA,teamB:pr.teamB}); }
    return {games, sitOut:[]};
  }
  const last=rounds[rounds.length-1], N=last.games.length, ri=rounds.length-1, winners=[], losers=[];
  for(let c=0;c<N;c++){
    const g=last.games[c], sc=(scores||{})[`${ri}-${g.court}`]||{};
    const s1=parseInt(sc.s1,10), s2=parseInt(sc.s2,10);
    if(s2>s1){ winners[c]=g.teamB.slice(); losers[c]=g.teamA.slice(); } else { winners[c]=g.teamA.slice(); losers[c]=g.teamB.slice(); }
  }
  const games=[];
  for(let c=0;c<N;c++){
    let high, low;
    if(N===1){ high=winners[0]; low=losers[0]; }
    else if(c===0){ high=winners[0]; low=winners[1]; }
    else if(c===N-1){ high=losers[c-1]; low=losers[c]; }
    else { high=losers[c-1]; low=winners[c+1]; }
    games.push({court:c+1, teamA:[high[0],low[0]], teamB:[high[1],low[1]]});
  }
  return {games, sitOut:[]};
}
// MEET-EVERYONE MIXER: pre-generate R rounds that reshuffle everyone across courts each
// round so players partner & oppose as many different people as possible (no scoring needed).
// Returns [{games:[{court,teamA,teamB}], sitOut:[]}] — the same shape the dynamic rounds use,
// so it reuses the round-by-round rendering, slips and save wholesale.
function mixerRounds(names, C, R){
  const N=names.length, perRound=4*C, nsit=Math.max(0,N-perRound);
  const sit=Object.fromEntries(names.map(n=>[n,0])), partner={}, opp={};
  const key=(a,b)=>a<b?a+'|'+b:b+'|'+a, fam=(a,b)=>(partner[key(a,b)]||0)*3+(opp[key(a,b)]||0);
  const rounds=[];
  for(let r=0;r<R;r++){
    let sitters=[];
    if(nsit>0) sitters=[...names].sort((a,b)=>sit[a]-sit[b]||((names.indexOf(a)+r)%N)-((names.indexOf(b)+r)%N)).slice(0,nsit);
    sitters.forEach(n=>sit[n]++);
    let pool=names.filter(n=>!sitters.includes(n));
    pool=[...pool.slice(r%pool.length),...pool.slice(0,r%pool.length)]; // rotate seed so courts differ each round
    const remaining=[...pool], courts=[];
    for(let c=0;c<C;c++){ const court=[remaining.shift()];
      while(court.length<4){ let best=null,bs=Infinity; for(const p of remaining){let s=0;for(const q of court)s+=fam(p,q); if(s<bs){bs=s;best=p;}} court.push(best); remaining.splice(remaining.indexOf(best),1); }
      courts.push(court);
    }
    const games=courts.map((q,i)=>{
      const splits=[[[q[0],q[1]],[q[2],q[3]]],[[q[0],q[2]],[q[1],q[3]]],[[q[0],q[3]],[q[1],q[2]]]];
      let best=splits[0],bc=Infinity;
      for(const s of splits){const c=(partner[key(s[0][0],s[0][1])]||0)+(partner[key(s[1][0],s[1][1])]||0); if(c<bc){bc=c;best=s;}}
      partner[key(best[0][0],best[0][1])]=(partner[key(best[0][0],best[0][1])]||0)+1;
      partner[key(best[1][0],best[1][1])]=(partner[key(best[1][0],best[1][1])]||0)+1;
      for(const a of best[0])for(const b of best[1])opp[key(a,b)]=(opp[key(a,b)]||0)+1;
      return {court:i+1,teamA:best[0],teamB:best[1]};
    });
    rounds.push({games, sitOut:sitters});
  }
  return rounds;
}
// Friendly, non-competitive participation stats across published social sessions. Attendance and
// mixing only — never win-rates — so nobody looks bad and it conveys the club's social vibe.
function socialStats(sessions,nowISO){
  const attend={}, partners={}, firstSeen={}; let totalGames=0, biggest={n:0,name:''};
  (sessions||[]).forEach(s=>{
    const plan=s.plan||{}, names=(plan.attendees||[]).map(a=>a.name);
    names.forEach(n=>{ attend[n]=(attend[n]||0)+1; if(!firstSeen[n]||s.played_on<firstSeen[n]) firstSeen[n]=s.played_on; });
    if(names.length>biggest.n) biggest={n:names.length,name:s.name||fmtFull(s.played_on),date:s.played_on};
    // Games live in plan.courts (round-robin) or plan.rounds (king/ladder/mexicano) — count both.
    const gameList = (Array.isArray(plan.courts)&&plan.courts.length)
      ? plan.courts.flatMap(ct=>ct.games||[])
      : (Array.isArray(plan.rounds)?plan.rounds.flatMap(rd=>rd.games||[]):[]);
    gameList.forEach(g=>{
      totalGames++;
      const pair=(a,b)=>{ if(!a||!b) return; (partners[a]=partners[a]||new Set()).add(b); (partners[b]=partners[b]||new Set()).add(a); };
      if(g.teamA) pair(g.teamA[0],g.teamA[1]); if(g.teamB) pair(g.teamB[0],g.teamB[1]);
    });
  });
  const top=(obj,val)=>{ let bn='',bv=0; Object.keys(obj).forEach(n=>{ const v=val(obj[n]); if(v>bv){bv=v;bn=n;} }); return bn?{name:bn,value:bv}:null; };
  // "New faces": first-ever social appearance within the last 30 days.
  const cutoff=new Date(nowISO); cutoff.setDate(cutoff.getDate()-30); const cut=cutoff.toISOString().slice(0,10);
  const newFaces=Object.keys(firstSeen).filter(n=>firstSeen[n]>=cut);
  return {
    sessionsCount:(sessions||[]).length,
    playersCount:Object.keys(attend).length,
    totalGames,
    mostAttended:top(attend,v=>v),
    mostPartners:top(partners,s=>s.size),
    biggest:biggest.n?biggest:null,
    newFaces,
  };
}
// Per-player results for ONE social session (both round-robin and dynamic). Returns a map
// name → {games,wins,losses,pf,pa,diff}. Only games with both scores count.
function aggregateSession(s){
  const plan=s.plan||{};
  if(Array.isArray(plan.rounds)&&plan.rounds.length) return dynAggregate(plan.rounds,plan.dynScores||{});
  const st={}; const ensure=n=>st[n]||(st[n]={name:n,games:0,wins:0,losses:0,draws:0,pf:0,pa:0,sat:0});
  (plan.courts||[]).forEach(ct=>(ct.games||[]).forEach(g=>{
    const sc=(plan.scores||{})[`${ct.court}-${g.round}`]||{};
    const s1=parseInt(sc.s1,10), s2=parseInt(sc.s2,10);
    if(isNaN(s1)||isNaN(s2)) return;
    const A=g.teamA, B=g.teamB;
    A.forEach(n=>{const p=ensure(n);p.games++;p.pf+=s1;p.pa+=s2;});
    B.forEach(n=>{const p=ensure(n);p.games++;p.pf+=s2;p.pa+=s1;});
    if(s1>s2){A.forEach(n=>ensure(n).wins++);B.forEach(n=>ensure(n).losses++);}
    else if(s2>s1){B.forEach(n=>ensure(n).wins++);A.forEach(n=>ensure(n).losses++);}
    else{A.concat(B).forEach(n=>ensure(n).draws++);}
  }));
  Object.values(st).forEach(p=>p.diff=p.pf-p.pa);
  return st;
}
// Persistent social ladder: aggregate completed sessions from `sinceISO` onward (no backfill).
// Ranked wins → point diff → points. Also tracks distinct partners and sessions attended.
function socialLeaderboard(sessions,sinceISO){
  const tot={}, partners={}; const ensure=n=>tot[n]||(tot[n]={name:n,sessions:0,games:0,wins:0,losses:0,pf:0,pa:0});
  (sessions||[]).filter(s=>s.status==='complete'&&(!sinceISO||s.played_on>=sinceISO)).forEach(s=>{
    const agg=aggregateSession(s), played=new Set();
    Object.values(agg).forEach(p=>{ if(p.games>0){ const t=ensure(p.name); t.games+=p.games;t.wins+=p.wins;t.losses+=p.losses;t.pf+=p.pf;t.pa+=p.pa; played.add(p.name); }});
    played.forEach(n=>ensure(n).sessions++);
    const plan=s.plan||{};
    const gl=(Array.isArray(plan.courts)&&plan.courts.length)?plan.courts.flatMap(ct=>ct.games||[]):(Array.isArray(plan.rounds)?plan.rounds.flatMap(rd=>rd.games||[]):[]);
    gl.forEach(g=>{ const pr=(a,b)=>{ if(!a||!b)return; (partners[a]=partners[a]||new Set()).add(b); (partners[b]=partners[b]||new Set()).add(a); }; if(g.teamA)pr(g.teamA[0],g.teamA[1]); if(g.teamB)pr(g.teamB[0],g.teamB[1]); });
  });
  return Object.values(tot).map(p=>({...p,diff:p.pf-p.pa,partners:(partners[p.name]||new Set()).size}))
    .sort((a,b)=>b.wins-a.wins||b.diff-a.diff||b.pf-a.pf||a.name.localeCompare(b.name));
}
// Self-contained round countdown. minutes null/0 → the caller doesn't render it. At 0 the
// score on court stands (spec §6) — we just flag it; the admin still enters the final score.
function RoundTimer({minutes,scored=true}){
  const total=Math.max(1,(minutes||15))*60;
  const[left,setLeft]=useState(total);
  const[running,setRunning]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{ setLeft(total); setRunning(false); },[total]);
  useEffect(()=>{
    if(!running) return;
    ref.current=setInterval(()=>setLeft(l=>{ if(l<=1){ clearInterval(ref.current); setRunning(false); return 0; } return l-1; }),1000);
    return()=>clearInterval(ref.current);
  },[running]);
  const mm=String(Math.floor(left/60)).padStart(2,'0'), ss=String(left%60).padStart(2,'0');
  const expired=left===0;
  return(
    <div className="flex items-center gap-3 rounded-xl px-4 py-3 border flex-wrap" style={{borderColor:expired?CORAL_DARK:'#e2e8f0',background:expired?'var(--coral-fill)':'#f9fafb'}}>
      <div className="text-3xl font-black tabular-nums" style={{color:expired?CORAL_DARK:INK}}>{mm}:{ss}</div>
      <div className="flex gap-2">
        <button onClick={()=>setRunning(r=>!r)} className="px-3 py-1.5 rounded-lg text-sm font-bold text-white" style={{background:running?'#64748b':GREEN}}>{running?'Pause':(left===total?'Start round':'Resume')}</button>
        <button onClick={()=>{setRunning(false);setLeft(total);}} className="px-3 py-1.5 rounded-lg text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700">Reset</button>
      </div>
      <div className="text-xs font-semibold" style={{color:expired?CORAL_DARK:'#64748b'}}>{expired?(scored?'⏰ Time! The score on court stands.':'⏰ Time! Rotate courts.'):`${minutes}-min round · all courts finish together`}</div>
    </div>
  );
}

        setSelected(new Set([...saved,...bookedNames]));
        if(p.courts) setCourts(String(p.courts));
        setTargetGames(p.max_rounds!=null?String(p.max_rounds):'6');
        setPublished(!!p.published); setPlanStatus(p.status||'planned');
        setGLoc(p.location||''); setGStart(p.start_time||''); setGEnd(p.end_time||''); setGHost(p.host||''); setGCap(p.capacity!=null?String(p.capacity):''); setGName(p.name||''); setGPrice(p.price_pennies!=null?penceToPounds(p.price_pennies):penceToPounds(defaultPricePennies));
        if(data.courts) { setSchedule({ok:true,courts:data.courts}); setLoadedPlan(true); }
      }catch(e){ /* not signed in or none saved — fine, start fresh */ }
    })();
    return()=>{cancel=true;};
  },[date]);

  const pool=React.useMemo(()=>{
    const base=(roster||[]).map(p=>({name:p.name, rating:ratingOf(p.name)}));
    const known=new Set(base.map(p=>p.name));
    // Booked players who aren't rated club members yet (e.g. a new member or guest)
    // still need to play — include them as unrated (they seed last) so they show in
    // the list and get placed on a court instead of being silently dropped.
    const extras=(booked||[]).filter(n=>!known.has(n)).map(n=>({name:n, rating:ratingOf(n)}));
    return [...base, ...extras];
  },[roster,ratingOf,booked]);
  const filtered=pool.filter(p=>p.name.toLowerCase().includes(search.trim().toLowerCase()));
  const selCount=selected.size;
  // Capacity = online booking cap (players can't pay past it; only the admin can add
  // walk-ins here). Flag the overage; "Raise" bumps the capacity field (saved with the plan).
  const gCapNum=(gCap!==''&&!isNaN(parseInt(gCap,10)))?parseInt(gCap,10):null;
  const overCapacity=gCapNum!=null?Math.max(0,selCount-gCapNum):0;
  const raiseCapacity=()=>setGCap(String(selCount));
  const range=selCount>=4?validCourtRange(selCount):null;
  const fit=selCount>=4?bestFitCourts(selCount):null;
  const courtsNum=parseInt(courts,10);
  const courtsValid=!isNaN(courtsNum)&&range&&courtsNum>=range[0]&&courtsNum<=range[1];
  // Guided courts: only offer counts that fit, and default to the best fit as soon as
  // players are chosen — so the admin lands on a valid setup with no typing.
  const courtOpts=selCount>=4?courtOptions(selCount):[];
  useEffect(()=>{
    if(!courtOpts.length) return;
    if(!courtOpts.includes(parseInt(courts,10))) setCourts(String(fit||courtOpts[0]));
  },[courtOpts.join(','),fit]); // eslint-disable-line react-hooks/exhaustive-deps
  // Which court(s) hold the extra player(s) when players don't divide evenly. Default
  // is the strongest courts (Court 1 first); the admin can move the +1 to any court.
  const[bigChoice,setBigChoice]=useState([]);
  const cRem=courtsValid?selCount%courtsNum:0;
  useEffect(()=>{
    if(!courtsValid) return;
    const rem=selCount%courtsNum;
    setBigChoice(prev=>(prev.length===rem&&prev.every(i=>i<courtsNum))?prev:Array.from({length:rem},(_,i)=>i));
  },[selCount,courtsNum,courtsValid]);
  const sizesArr=courtsValid?Array.from({length:courtsNum},(_,i)=>Math.floor(selCount/courtsNum)+(bigChoice.includes(i)?1:0)):null;
  const toggleBig=(i)=>setBigChoice(prev=>{ const rem=selCount%courtsNum; if(prev.includes(i)) return prev.length<=rem?prev:prev.filter(x=>x!==i); const next=[...prev,i]; while(next.length>rem) next.shift(); return next; });
  // Only offer games-per-court counts that come out even for the current courts, and keep
  // the current pick valid as players/courts change (snap to the nearest still-valid option).
  const gameOpts=courtsValid?gameOptions(sizesArr):[];
  useEffect(()=>{
    if(!gameOpts.length) return;
    const cur=parseInt(targetGames,10);
    if(!gameOpts.includes(cur)){ const want=isNaN(cur)?6:cur;
      setTargetGames(String(gameOpts.reduce((a,b)=>Math.abs(b-want)<Math.abs(a-want)?b:a))); }
  },[gameOpts.join(',')]); // eslint-disable-line react-hooks/exhaustive-deps

  const toggle=(name)=>setSelected(s=>{const n=new Set(s); n.has(name)?n.delete(name):n.add(name); return n;});
  const selectAllFiltered=()=>setSelected(s=>{const n=new Set(s); filtered.forEach(p=>n.add(p.name)); return n;});
  const clearAll=()=>setSelected(new Set());

  const addPlayer=async()=>{
    setAddErr('');
    const nm=newName.trim(); const rt=parseFloat(newRating);
    if(!nm){ setAddErr('Enter a name.'); return; }
    if((roster||[]).some(p=>p.name.toLowerCase()===nm.toLowerCase())){ setAddErr('That player already exists.'); return; }
    if(isNaN(rt)||rt<2||rt>8){ setAddErr('Starting rating must be between 2 and 8.'); return; }
    setAddBusy(true);
    try{
      await atPostBatch(AT_PLAYERS,[{fields:{PlayerName:nm,initial_4dr:rt}}]);
      await loadRoster();
      setSelected(s=>{const n=new Set(s); n.add(nm); return n;});
      setNewName(''); setNewRating('');
    }catch(e){ setAddErr(e.message||'Could not add the player — are you signed in as admin?'); }
    setAddBusy(false);
  };

  const generate=()=>{
    setGenErr(''); setMsg({type:'',text:''});
    const players=pool.filter(p=>selected.has(p.name))
      .sort((a,b)=>((b.rating==null?-1e9:b.rating)-(a.rating==null?-1e9:a.rating))||a.name.localeCompare(b.name));
    const res=buildSchedule(players,courtsNum,targetGames?parseInt(targetGames,10):6,sizesArr);
    if(!res.ok){ setGenErr(res.error); setSchedule(null); return; }
    setSchedule(res); setScores({}); setLoadedPlan(false);
    setTimeout(()=>{const el=document.getElementById('sb-schedule'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},50);
  };

  const planData=()=>({
    attendees:pool.filter(p=>selected.has(p.name)).map(p=>({name:p.name,rating:p.rating})),
    courts:schedule.courts, generatedFor:date,
  });
  const savePlan=async()=>{
    if(!schedule) return; setBusy(true); setMsg({type:'',text:'Saving plan…'});
    try{ await sbSavePlan(date,schedule.courts.length,targetGames?parseInt(targetGames,10):6,planData(),'planned',published,details());
      setMsg({type:'ok',text:'✓ Plan saved — you can reprint or enter results any time.'}); }
    catch(e){ setMsg({type:'error',text:'Save failed: '+(e.message||'are you signed in as admin?')}); }
    setBusy(false);
  };
  const togglePublish=async()=>{
    if(!schedule){ setMsg({type:'error',text:'Generate the schedule first, then publish it.'}); return; }
    const next=!published; setBusy(true); setMsg({type:'',text:next?'Publishing line-up…':'Hiding line-up…'});
    try{
      await sbSavePlan(date,schedule.courts.length,targetGames?parseInt(targetGames,10):6,planData(),planStatus,next,details());
      setPublished(next);
      setMsg({type:'ok',text:next?'✓ Published — players can now see this on the “Next Graded Session” page.':'✓ Hidden — players can no longer see this line-up.'});
      onReload&&onReload();
    }catch(e){ setMsg({type:'error',text:'Failed: '+(e.message||'are you signed in as admin?')}); }
    setBusy(false);
  };

  const saveResults=async()=>{
    if(!schedule) return;
    const matches=[];
    schedule.courts.forEach(ct=>ct.games.forEach(g=>{
      const k=`${ct.court}-${g.round}`, sc=scores[k]||{};
      const s1=parseInt(sc.s1,10), s2=parseInt(sc.s2,10);
      if(isNaN(s1)||isNaN(s2)) return; // only completed games
      matches.push({p1:g.teamA[0],p2:g.teamA[1],p3:g.teamB[0],p4:g.teamB[1],s1,s2});
    }));
    if(!matches.length){ setMsg({type:'error',text:'Enter at least one game’s scores first.'}); return; }
    setBusy(true); setMsg({type:'',text:`Saving ${matches.length} result(s)…`});
    try{
      const resolved=[{date,matches}];
      const{toCreate,toDeleteIds}=reconcileMatches(sessions,resolved);
      if(toCreate.length) await atPostBatch(AT_RESULTS,toCreate);
      if(toDeleteIds.length) await atDeleteBatch(AT_RESULTS,toDeleteIds);
      atLogActivity('Session results saved',`${fmtFull(date)} — ${matches.length} game(s) from the planner`);
      setPlanStatus('completed');
      try{ await sbSavePlan(date,schedule.courts.length,targetGames?parseInt(targetGames,10):6,planData(),'completed',published,details()); }catch(e){}
      setMsg({type:'ok',text:`✓ ${matches.length} result(s) saved. Reloading the board…`});
      setTimeout(()=>{ onReload&&onReload(); },1100);
    }catch(e){ setMsg({type:'error',text:'Save failed: '+(e.message||'are you signed in as admin?')}); }
    setBusy(false);
  };

  const setScore=(k,which,val)=>setScores(s=>({...s,[k]:{...(s[k]||{}),[which]:val.replace(/[^0-9]/g,'')}}));
  const fmtR=r=>r==null?'—':Number(r).toFixed(2);

  return(
    <div className="fixed inset-0 z-50 bg-gray-50 overflow-y-auto">
      {/* Header */}
      <header style={{background:NAVY}} className="sticky top-0 z-10 shadow-lg">
        <div className="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
          <div className="min-w-0">
            <div className="text-white/50 text-xs font-semibold uppercase tracking-widest leading-none truncate">{clubName} · Graded session builder — players, courts &amp; scores</div>
            <div className="text-white font-black text-base sm:text-lg leading-tight truncate">{gName||'Graded session'}</div>
          </div>
          <button onClick={onClose} className="flex items-center gap-1.5 text-white/80 hover:text-white text-sm font-bold px-3 py-1.5 rounded-lg hover:bg-white/10">
            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12"/></svg>
            Close
          </button>
        </div>
        <div style={{background:CORAL,height:'3px'}}/>
      </header>

      <main className="max-w-4xl mx-auto px-4 py-6 space-y-6">
        {/* Setup row */}
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 grid sm:grid-cols-3 gap-4">
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Session date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-orange-400"/>
          </div>
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Courts available <span className="text-gray-400 normal-case tracking-normal">· fits your players</span></label>
            {courtOpts.length
              ? <select value={courts} onChange={e=>setCourts(e.target.value)} aria-label="Courts available" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-orange-400">
                  {courtOpts.map(c=><option key={c} value={c}>{c} court{c>1?'s':''}{c===fit?' · best fit':''}</option>)}
                </select>
              : <div className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-400 bg-gray-50">{selCount>=4?'These players don’t split into 4–6s':'Select players first'}</div>}
          </div>
          <div>
            <label className="text-xs font-bold text-gray-500 uppercase tracking-widest block mb-1.5">Games per court <span className="text-gray-400 normal-case tracking-normal">· options that fit</span></label>
            {courtsValid
              ? <select value={targetGames} onChange={e=>setTargetGames(e.target.value)} aria-label="Games per court" className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:border-orange-400">
                  {gameOpts.map(g=><option key={g} value={g}>{gameOptLabel(g,sizesArr)}</option>)}
                </select>
              : <div className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm text-gray-400 bg-gray-50">Set players &amp; courts first</div>}
          </div>
          <div className="sm:col-span-3 -mt-1">
            {selCount>=4
              ? (range
                  ? <p className="text-xs text-gray-500"><b style={{color:INK}}>{selCount}</b> players selected · valid courts: <b>{range[0]===range[1]?range[0]:`${range[0]}–${range[1]}`}</b> (best fit {fit}). {courts&&!courtsValid&&<span className="text-red-600 font-semibold">Choose {range[0]===range[1]?range[0]:`${range[0]}–${range[1]}`} courts for {selCount} players.</span>}</p>
                  : <p className="text-xs text-red-600 font-semibold">{selCount} players can’t be split into courts of 4–6. Add or remove a player (1, 2, 3 and 7 don’t fit).</p>)
              : <p className="text-xs text-gray-500">Select at least 4 players to build a session.</p>}
            {courtsValid&&(()=>{
              const sizes=sizesArr||courtSizes(selCount,courtsNum);
              const tg=targetGames?parseInt(targetGames,10):6;
              const distinct=[...new Set(sizes)].sort((a,b)=>a-b);
              const allSame=distinct.length===1, cnt=n=>sizes.filter(s=>s===n).length;
              const ideals=distinct.map(n=>({n,once:(n*(n-1))%4===0?n*(n-1)/4:null})).filter(x=>x.once);
              return(
                <div className="mt-2 rounded-xl bg-slate-50 border border-slate-200 p-3 text-xs space-y-1.5">
                  <div className="font-bold" style={{color:INK}}>{courtsNum} court{courtsNum>1?'s':''} → {allSame?`${sizes[0]} players per court`:sizes.join(', ')+' players'}</div>
                  {cRem>0&&cRem<courtsNum&&(
                    <div className="pt-0.5">
                      <div className="text-[11px] text-gray-500 mb-1">{cRem} extra player{cRem>1?'s':''} — tap which court{cRem>1?'s':''} take{cRem>1?'':'s'} the +1:</div>
                      <div className="flex gap-1.5 flex-wrap">
                        {sizes.map((sz,i)=>{ const on=bigChoice.includes(i); return(
                          <button key={i} type="button" onClick={()=>toggleBig(i)} className={"text-xs font-bold px-2.5 py-1 rounded-lg border transition-colors "+(on?"text-white border-transparent":"bg-white border-gray-200 text-gray-600 hover:bg-gray-50")} style={on?{background:NAVY}:undefined}>Court {i+1}: {sz}</button>
                        );})}
                      </div>
                    </div>
                  )}
                  {distinct.map(n=>{ const cg=fairGamesForCourt(n,tg); const cov=courtCoverage(n,cg); return(
                    <div key={n} className="text-gray-600 flex gap-1.5">
                      <span className="text-gray-400 flex-shrink-0">•</span>
                      <span>{allSame?'':`${cnt(n)}× ${n}-player court${cnt(n)>1?'s':''}: `}<b>{cg} game{cg===1?'':'s'}</b> → {cov.summary}; {cov.sitTxt}.</span>
                    </div>
                  );})}
                  {ideals.length>0&&<div className="text-[11px] pt-0.5 font-semibold" style={{color:CORAL_DARK}}>💡 For a full round-robin (everyone partners everyone once): {ideals.map(x=>`${x.n}-player ${cnt(x.n)>1?'courts':'court'} = ${x.once} games`).join(' · ')}.</div>}
                </div>
              );
            })()}
          </div>
        </div>

        {/* Session details (location / time / host / capacity) */}
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-3">Session details</h3>
          <div className="grid sm:grid-cols-4 gap-3">
            <label className="block"><span className="text-xs font-semibold text-gray-600">Start time</span>
              <input type="time" value={gStart} onChange={e=>setGStart(e.target.value)} className="mt-1 w-full border border-gray-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:border-orange-400"/></label>
            <label className="block"><span className="text-xs font-semibold text-gray-600">End time</span>
              <input type="time" value={gEnd} onChange={e=>setGEnd(e.target.value)} className="mt-1 w-full border border-gray-200 rounded-xl px-2 py-2 text-sm focus:outline-none focus:border-orange-400"/></label>
            <label className="block"><span className="text-xs font-semibold text-gray-600">Host (optional)</span>
              <input value={gHost} onChange={e=>setGHost(e.target.value)} placeholder="Who's running it" className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400"/></label>
            <label className="block"><span className="text-xs font-semibold text-gray-600">Capacity / spots</span>
              <input value={gCap} onChange={e=>setGCap(e.target.value.replace(/[^0-9]/g,''))} inputMode="numeric" placeholder="e.g. 24" className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400"/></label>
            <label className="block"><span className="text-xs font-semibold text-gray-600">Price (£)</span>
              <input value={gPrice} onChange={e=>setGPrice(e.target.value.replace(/[^0-9.]/g,''))} inputMode="decimal" placeholder="e.g. 6" className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400"/>
              {onSaveDefaultPrice&&priceToPennies(gPrice)!=null&&priceToPennies(gPrice)!==defaultPricePennies&&(
                <button type="button" onClick={()=>onSaveDefaultPrice(priceToPennies(gPrice))} className="mt-1 text-[11px] font-bold hover:underline" style={{color:CORAL_DARK}}>Set as club default</button>
              )}</label>
            <label className="block sm:col-span-3"><span className="text-xs font-semibold text-gray-600">Location</span>
              <input value={gLoc} onChange={e=>setGLoc(e.target.value)} placeholder="Venue or address (adds a map link for players)" className="mt-1 w-full border border-gray-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-orange-400"/></label>
          </div>
          <p className="text-[11px] text-gray-400 mt-2">Shown to players on the “Next Graded Session” page. Capacity shows a spots/full indicator against who’s selected. Price is drawn from the member’s wallet at booking{defaultPricePennies!=null?` — blank uses the club default of £${(defaultPricePennies/100).toFixed(2).replace(/\.00$/,'')}`:''}.</p>
        </div>

        {/* Attendees */}
        <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-5">
          <div className="flex items-center justify-between mb-3 gap-2 flex-wrap">
            <h3 className="text-sm font-black flex items-center gap-2" style={{color:INK}}>Who’s playing?
              <span className="text-xs font-black px-2.5 py-1 rounded-full text-white tabular-nums" style={{background:selCount<4?'#94a3b8':(courtsValid?GREEN:NAVY)}}>{selCount} selected</span>
            </h3>
            <div className="flex gap-2">
              <button onClick={selectAllFiltered} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700">Select shown</button>
              <button onClick={clearAll} className="text-xs font-bold px-3 py-1.5 rounded-lg bg-gray-100 hover:bg-gray-200 text-gray-700">Clear</button>
            </div>
          </div>
          {overCapacity>0&&(
            <div className="w-full mb-3 flex items-center justify-between gap-3 px-4 py-3 rounded-xl bg-amber-50 border border-amber-200">
              <span className="text-sm font-semibold text-amber-800"><b>{selCount} selected</b> — {overCapacity} over the capacity of {gCapNum}. Walk-in? Bump the capacity or add a court.</span>
              <button onClick={raiseCapacity} className="flex-shrink-0 text-xs font-bold px-3 py-1.5 rounded-lg text-white whitespace-nowrap" style={{background:AMBER}}>Raise to {selCount}</button>
            </div>
          )}
          {(()=>{ const missing=booked.filter(n=>!selected.has(n));
            if(booked.length===0) return null;
            if(missing.length===0) return (
              <div className="w-full mb-3 flex items-center justify-between gap-2 px-4 py-3 rounded-xl text-left" style={{background:'rgba(16,185,129,0.10)',border:'1px solid rgba(16,185,129,0.35)'}}>
                <span className="text-sm font-black" style={{color:'#047857'}}>✓ {booked.length} booked player{booked.length>1?'s':''} auto-added to the line-up</span>
                <span className="text-xs font-semibold" style={{color:'#059669'}}>from the booking page</span>
              </div>
            );
            return (
              <button onClick={()=>setSelected(s=>new Set([...s,...booked]))} className="w-full mb-3 flex items-center justify-between gap-2 px-4 py-3 rounded-xl text-white text-left shadow-sm" style={{background:GREEN}}>
                <span className="text-sm font-black">＋ Bring in {missing.length} more who booked</span>
                <span className="text-xs font-semibold opacity-90">signed up on the booking page →</span>
              </button>
            );
          })()}
          <CompAdminsPanel sessionKind="graded" sessionId={planId} onChange={async()=>{ if(planId){ try{ const b=await sbBookedRoster('graded',planId); setBooked(b); setSelected(prev=>new Set([...prev,...b])); }catch(e){} } }}/>
          {/* Add new player */}
          <div className="bg-gray-50 rounded-xl p-3 mb-3">
            <div className="text-[11px] font-bold text-gray-500 uppercase tracking-widest mb-2">Add a new player to the club</div>
            <div className="flex gap-2 flex-wrap sm:flex-nowrap">
              <input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Player name" className="flex-1 min-w-[140px] border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-orange-400"/>
              <input value={newRating} onChange={e=>setNewRating(e.target.value)} inputMode="decimal" placeholder="Start (2–8)" className="w-28 border border-gray-200 rounded-xl px-3 py-2 text-sm bg-white focus:outline-none focus:border-orange-400"/>
              <button onClick={addPlayer} disabled={addBusy} className="px-4 py-2 rounded-xl text-white text-sm font-bold disabled:opacity-50" style={{background:CORAL_DARK}}>{addBusy?'Adding…':'+ Add'}</button>
            </div>
            {addErr&&<p className="text-xs text-red-600 mt-1.5">{addErr}</p>}
          </div>
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search players…" className="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm mb-3 focus:outline-none focus:border-orange-400"/>
          {roster===null
            ? <p className="text-sm text-gray-400 py-6 text-center">Loading players…</p>
            : rosterErr
              ? <p className="text-sm text-red-600 py-4 text-center">{rosterErr}</p>
              : (
            <div className="grid sm:grid-cols-2 gap-1.5 max-h-[42vh] overflow-y-auto pr-1">
              {filtered.map(p=>{const on=selected.has(p.name);return(
                <button key={p.name} onClick={()=>toggle(p.name)} className={`flex items-center justify-between gap-2 px-3 py-2 rounded-xl border text-left transition-colors ${on?'border-transparent text-white':'border-gray-200 bg-white hover:bg-gray-50'}`} style={on?{background:NAVY}:undefined}>
                  <span className="flex items-center gap-2 min-w-0">
                    <span className={`w-4 h-4 rounded flex items-center justify-center flex-shrink-0 ${on?'bg-white/20':'border border-gray-300'}`}>{on&&<svg className="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M5 13l4 4L19 7"/></svg>}</span>
                    <span className="text-sm font-semibold truncate">{p.name}</span>
                  </span>
                  <span className={`text-xs font-mono font-bold flex-shrink-0 ${on?'text-white/80':'text-gray-400'}`}>{fmtR(p.rating)}</span>
                </button>
              );})}
              {filtered.length===0&&<p className="text-sm text-gray-400 py-4 text-center sm:col-span-2">No players match “{search}”.</p>}
            </div>

                <div key={ct.court} className="border border-gray-200 rounded-xl overflow-hidden">

                  </div>
                  <div className="divide-y divide-gray-100">
                    {ct.games.map(g=>{const k=`${ct.court}-${g.round}`; const sc=scores[k]||{}; return(
                      <div key={k} className="px-3 py-2.5 flex items-center gap-2 text-sm flex-wrap">
                        <span className="text-[11px] font-bold text-gray-400 w-7 flex-shrink-0">R{g.round}</span>
                        <span className="font-semibold text-gray-800 flex-1 min-w-[110px] text-right">{g.teamA.join(' & ')}</span>
                        <input value={sc.s1||''} onChange={e=>setScore(k,'s1',e.target.value)} inputMode="numeric" placeholder="—" className="w-11 text-center border border-gray-200 rounded-lg px-1 py-1.5 text-sm font-mono font-bold focus:outline-none focus:border-orange-400"/>
                        <span className="text-gray-300 font-bold">–</span>
                        <input value={sc.s2||''} onChange={e=>setScore(k,'s2',e.target.value)} inputMode="numeric" placeholder="—" className="w-11 text-center border border-gray-200 rounded-lg px-1 py-1.5 text-sm font-mono font-bold focus:outline-none focus:border-orange-400"/>
                        <span className="font-semibold text-gray-800 flex-1 min-w-[110px]">{g.teamB.join(' & ')}</span>
                        {Array.isArray(g.sitOut)&&g.sitOut.length>0&&<span className="text-[11px] text-gray-400 w-full text-center">sitting out: <span className="font-semibold text-gray-500">{g.sitOut.join(', ')}</span></span>}
                      </div>
                    );})}
                  </div>
                </div>
              ))}
            </div>
            {msg.text&&<div aria-live="polite" className={`mt-4 px-3 py-2 rounded-xl text-sm ${msg.type==='error'?'bg-red-50 text-red-600':msg.type==='ok'?'bg-green-50 text-green-700':'bg-blue-50 text-blue-700'}`}>{msg.text}</div>}
            {/* Publish toggle — show players who's playing */}
            <div className="mt-4 flex items-center justify-between gap-3 rounded-xl px-4 py-3 border" style={{borderColor:published?GREEN:'var(--border)',background:published?'rgba(16,185,129,0.06)':'#f9fafb'}}>
              <div className="min-w-0">
                <div className="text-sm font-bold flex items-center gap-1.5" style={{color:INK}}>👁 Show players who’s playing {published&&<span className="text-[11px] font-black px-2 py-0.5 rounded-full text-white" style={{background:GREEN}}>LIVE</span>}</div>
                <div className="text-xs text-gray-500">Publishes this line-up on the public “Next Graded Session” page everyone at the club can see.</div>
              </div>
              <button onClick={togglePublish} disabled={busy} role="switch" aria-checked={published} aria-label="Publish line-up for players" className="relative inline-flex h-7 w-12 flex-shrink-0 rounded-full transition-colors disabled:opacity-50" style={{background:published?GREEN:'#cbd5e1'}}>
                <span className={`inline-block h-6 w-6 transform rounded-full bg-white shadow transition-transform mt-0.5 ${published?'translate-x-5':'translate-x-0.5'}`}/>
              </button>
            </div>
            <div className="mt-3 flex gap-2 flex-wrap">
              <button onClick={()=>setSlipsOpen(true)} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white" style={{background:NAVY}}>🖨️ Print / PDF playslips</button>
              <button onClick={savePlan} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 disabled:opacity-50">Save plan</button>
              <button onClick={saveResults} disabled={busy} className="px-4 py-2.5 rounded-xl text-sm font-bold text-white disabled:opacity-50 ml-auto" style={{background:CORAL_DARK}}>Save results →</button>
            </div>
          </div>
        )}
      </main>
      {slipsOpen&&schedule&&<PlayslipsOverlay courts={schedule.courts} clubName={clubName} date={date} onClose={()=>setSlipsOpen(false)}/>}
    </div>
  );
}

/* ─── SOCIAL PAGE (members' read-only view) ──────────────────────
   Shows only PUBLISHED social sessions: upcoming line-ups with who's attending, past
   sessions with results (when the admin recorded scores), plus friendly participation

const SOCIAL_FORMATS={round_robin:'Round-robin',mixer:'Social mixer',king:'King of the court',ladder:'Ladder',mexicano:'Mexicano'};
// A proper pickleball paddle (rounded-rectangle face + short grip) with a holed ball.

function StatChip({icon,label,value,sub}){

}
function SocialSessionCard({s,past,guestSet,hideGuests}){
  const plan=s.plan||{};
  const disp=n=>(hideGuests&&guestSet&&guestSet.has(n))?'Guest':n; // honour guest-name privacy
  const isDyn=s.format!=='round_robin';
  const courtsAll=Array.isArray(plan.courts)?plan.courts:[];
  const roundsAll=Array.isArray(plan.rounds)?plan.rounds:[];
  const attNames=(plan.attendees||[]).map(a=>a.name);
  // The saved line-up (attendees) is the single source of truth for who's playing.
  // A generated schedule can go stale if the line-up shrank after the courts were
  // built — so drop any schedule that still references players who are no longer in
  // the line-up, rather than showing phantom names as if they'd signed up. If the
  // line-up is missing (older rows), fall back to whoever the schedule lists.
  const attSet=new Set(attNames);
  const courtsFresh=courtsAll.length>0&&courtsAll.every(ct=>(ct.players||[]).every(p=>attSet.has(p.name)));
  const roundsFresh=roundsAll.length>0&&roundsAll.every(rd=>(rd.games||[]).every(g=>[...(g.teamA||[]),...(g.teamB||[]),...(g.sitOut||[])].every(n=>attSet.has(n))));
  const attendees=attNames.length>0?attNames
    :courtsAll.length?[...new Set(courtsAll.flatMap(ct=>(ct.players||[]).map(p=>p.name)))]
    :roundsAll.length?[...new Set(roundsAll.flatMap(rd=>(rd.games||[]).flatMap(g=>[...(g.teamA||[]),...(g.teamB||[])])))]:[];
  const courts=attNames.length>0?(courtsFresh?courtsAll:[]):courtsAll;
  const rounds=attNames.length>0?(roundsFresh?roundsAll:[]):roundsAll;
  const scored=(s.scoring&&s.scoring.scored)!==false;
  const sortKey=s.format==='mexicano'?'points':'wins';
  const standings=(past&&scored)
    ? (isDyn?dynStandings(rounds,plan.dynScores||{},sortKey):(courts.length?computeStandings(courts,plan.scores||{}):[]))
    : [];
  const hasResults=standings.some(p=>p.games>0);
  const lineupCourts=isDyn
    ? (rounds.length?rounds[rounds.length-1].games.map(g=>({court:g.court,players:[...g.teamA,...g.teamB].map(n=>({name:n}))})):[])
    : courts;
  return(
    <div className="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
      <div className="px-4 py-3 flex items-center justify-between gap-2" style={{background:'#f8fafc'}}>
        <div className="min-w-0">
          <div className="font-black text-gray-800 truncate">{s.name||fmtFull(s.played_on)}</div>
          <div className="text-xs text-gray-500">{fmtFull(s.played_on)} · {SOCIAL_FORMATS[s.format]||s.format} · {attendees.length} playing</div>
        </div>
        {(()=>{ const st=s.status;
          const label=st==='complete'?'Final':st==='live'?'In progress':(past?'Played':'Upcoming');
          const style=st==='complete'?{background:'rgba(16,185,129,0.12)',color:'#047857'}:st==='live'?{background:'var(--coral-fill)',color:CORAL_DARK}:{background:'#eef2f7',color:'#475569'};
          return <span className="text-[11px] font-bold px-2 py-1 rounded-full flex-shrink-0" style={style}>{label}</span>;
        })()}
      </div>
      <div className="p-4 space-y-3">
        <SessionMeta loc={s.location} start={s.start_time} end={s.end_time} host={s.host} taken={attendees.length} capacity={s.capacity}/>
        {attendees.length>0&&(
          <div className="flex flex-wrap gap-1.5">
            {attendees.map(n=><span key={n} className="text-xs font-semibold px-2.5 py-1 rounded-full" style={{background:'#eef2f7',color:'#475569'}}>{disp(n)}</span>)}
          </div>
        )}
        {past&&hasResults&&(
          <details open={s.status==='complete'}>
            <summary className="cursor-pointer text-sm font-bold list-none flex items-center gap-1.5" style={{color:SOCIAL_DARK}}><span>🏅 Results{isDyn?` · ${s.format==='mexicano'?'ranked by points':'ranked by wins'}`:''}</span><span className="text-gray-300">▾</span></summary>
            <div className="overflow-x-auto mt-2">
              <table className="w-full text-sm"><thead><tr className="text-[11px] uppercase tracking-wide text-gray-400 text-left">
                <th className="py-1 pr-2">#</th><th className="py-1 pr-2">Player</th><th className="py-1 px-1.5 text-center">P</th><th className="py-1 px-1.5 text-center">W</th><th className="py-1 px-1.5 text-center">Diff</th><th className="py-1 px-1.5 text-center">Pts</th></tr></thead>
                <tbody>{standings.map((p,i)=>(<tr key={p.name} className="border-t border-gray-100">
                  <td className="py-1 pr-2 font-black tabular-nums" style={{color:i===0?SOCIAL_DARK:'#94a3b8'}}>{i+1}</td>
                  <td className="py-1 pr-2 font-semibold text-gray-800">{disp(p.name)}</td>
                  <td className="py-1 px-1.5 text-center text-gray-500 tabular-nums">{p.games}</td>
                  <td className="py-1 px-1.5 text-center font-bold tabular-nums" style={{color:GREEN}}>{p.wins}</td>
                  <td className="py-1 px-1.5 text-center tabular-nums" style={{color:p.diff>0?GREEN:p.diff<0?'#dc2626':'#94a3b8'}}>{p.diff>0?'+':''}{p.diff}</td>
                  <td className="py-1 px-1.5 text-center font-semibold tabular-nums" style={{color:INK}}>{p.pf}</td>
                </tr>))}</tbody>
              </table>
            </div>
          </details>
        )}
        {!past&&lineupCourts.length>0&&(
          <details>
            <summary className="cursor-pointer text-sm font-bold list-none flex items-center gap-1.5" style={{color:SOCIAL_DARK}}><span>📋{isDyn?`Round ${rounds.length} courts`:'Court line-up'}</span><span className="text-gray-300">▾</span></summary>
            <div className="grid sm:grid-cols-2 gap-2 mt-2">
              {lineupCourts.map(ct=>(
                <div key={ct.court} className="border border-gray-100 rounded-xl p-2.5">
                  <div className="text-xs font-black mb-1" style={{color:INK}}>Court {ct.court}</div>
                  <div className="flex flex-wrap gap-1">{(ct.players||[]).map(p=><span key={p.name} className="text-[11px] px-2 py-0.5 rounded-full" style={{background:'#eef2f7',color:'#475569'}}>{disp(p.name)}</span>)}</div>
                </div>
              ))}
            </div>
          </details>
        )}
      </div>
    </div>
  );
}
function SocialLanding({clubName,settings}){
  const[list,setList]=useState(null);
  const[err,setErr]=useState('');
  const[guestSet,setGuestSet]=useState(null);

    (async()=>{ try{ setGuestSet(new Set(await sbGuestNames())); }catch(e){ setGuestSet(new Set()); } })(); },[]);

  const disp=n=>(hideGuests&&guestSet&&guestSet.has(n))?'Guest':n;

  const record=React.useMemo(()=>socialLeaderboard(list||[],null),[list]);
  const players=record.map(p=>p.name).sort((a,b)=>a.localeCompare(b));

  return(
    <div className="space-y-6 max-w-3xl mx-auto fade">
      <div className="rounded-2xl p-6 text-white" style={{background:`linear-gradient(135deg,${NAVY},#2d4a7a)`}}>

        <h2 className="osw text-2xl font-bold uppercase tracking-wide">{clubName} Social</h2>

      {err&&<div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-2.5 text-sm text-amber-800">{err}</div>}
      {list===null&&<p className="text-sm text-gray-400 py-6 text-center">Loading…</p>}

      {/* Friendly participation stats */}
      {stats&&stats.sessionsCount>0&&(
        <div>
          <h3 className="text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">The club's social flavour</h3>
          <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
            <StatChip icon={<PaddleIcon/>} value={stats.totalGames} label="Games played" sub={`${stats.sessionsCount} session${stats.sessionsCount>1?'s':''}`}/>
            <StatChip icon="👥" value={stats.playersCount} label="Players involved"/>
            {stats.mostAttended&&<StatChip icon="⭐" value={stats.mostAttended.value} label="Most sessions" sub={stats.mostAttended.name}/>}
            {stats.mostPartners&&<StatChip icon="🤝" value={stats.mostPartners.value} label="Most partners" sub={stats.mostPartners.name}/>}
            {stats.biggest&&<StatChip icon="🎉" value={stats.biggest.n} label="Biggest night" sub={stats.biggest.name}/>}
            {stats.newFaces.length>0&&<StatChip icon="✨" value={stats.newFaces.length} label="New faces" sub="last 30 days"/>}
          </div>

      )}

      {/* My stats lookup */}
      {players.length>0&&(

  const[dynRounds,setDynRounds]=useState([]);    // dynamic formats: [{games:[{court,teamA,teamB}],sitOut:[]}]
  const[dynScores,setDynScores]=useState({});    // dynamic: `${roundIndex}-${court}` → {s1,s2}
  const[manageName,setManageName]=useState(null);const[manageRating,setManageRating]=useState('');const[manageGender,setManageGender]=useState('');const[manageBusy,setManageBusy]=useState(false);const[manageErr,setManageErr]=useState('');
  const[busy,setBusy]=useState(false); const[msg,setMsg]=useState({type:'',text:''});
  const[loadedPlan,setLoadedPlan]=useState(false);
  const[status,setStatus]=useState(session.status||'planned');
  const[published,setPublished]=useState(!!session.published);
  const[autoStatus,setAutoStatus]=useState('idle'); // idle | saving | saved | error
  const[editing,setEditing]=useState(false);
  const dragFrom=useRef(null);
  const hydrated=useRef(false); // don't auto-save until the saved plan has loaded in

  const loadRoster=useCallback(async()=>{
    setRosterErr('');
    try{ setRoster(await sbSocialRoster()); }
    catch(e){ setRosterErr(e.message||'Could not load the player list.'); setRoster([]); }
  },[]);
  useEffect(()=>{ loadRoster(); },[loadRoster]);

  // Reload the saved plan (attendees, courts, generated slips) for this session.
  useEffect(()=>{
    let cancel=false;
    (async()=>{
      try{
        const full=await sbSocialSession(session.id);
        if(cancel||!full) return;
        const plan=full.plan||{};
        const saved=Array.isArray(plan.attendees)?plan.attendees.map(a=>a.name):[];
        // ALWAYS pull the players who booked this social session, merged with any
        // saved guests — single source of truth, no racing effect.
        let bookedNames=[];
        try{ bookedNames=await sbBookedRoster('social',session.id); }catch(e){}
        if(cancel) return;
        setBooked(bookedNames);
        setOrder([...saved,...bookedNames.filter(n=>!saved.includes(n))]);
        if(plan.court_mode) setCourtMode(plan.court_mode);
        if(plan.scores) setScores(plan.scores);
        if(Array.isArray(plan.rounds)) setDynRounds(plan.rounds);
        if(plan.dynScores) setDynScores(plan.dynScores);
        if(full.status) setStatus(full.status);
        setPublished(!!full.published);
        if(Array.isArray(plan.courts)&&plan.courts.length){ setSchedule({ok:true,courts:plan.courts}); setCourts(String(plan.courts.length)); setLoadedPlan(true); }
      }catch(e){ /* nothing saved yet — start fresh */ }
      finally{ if(!cancel) setTimeout(()=>{hydrated.current=true;},0); } // enable auto-save only after load settles
    })();
    return()=>{cancel=true;};
  },[session.id]);

  const ratingOf=useCallback((name)=>{ const r=(roster||[]).find(p=>p.name===name); return (r&&r.initial_rdr!=null)?r.initial_rdr:null; },[roster]);
  const guestOf=useCallback((name)=>{ const r=(roster||[]).find(p=>p.name===name); return !!(r&&r.guest); },[roster]);
  const genderOf=useCallback((name)=>{ const r=(roster||[]).find(p=>p.name===name); return (r&&r.gender)||null; },[roster]);
  const pool=React.useMemo(()=>(roster||[]).map(p=>({name:p.name,rating:p.initial_rdr!=null?p.initial_rdr:null,guest:!!p.guest,gender:p.gender||null})),[roster]);
  const selectedSet=React.useMemo(()=>new Set(order),[order]);
  const available=pool.filter(p=>!selectedSet.has(p.name)&&p.name.toLowerCase().includes(search.trim().toLowerCase())&&(genderFilter==='all'||p.gender===genderFilter));

  const selCount=order.length;
  const range=selCount>=4?validCourtRange(selCount):null;
  const fit=selCount>=4?bestFitCourts(selCount):null;
  // Capacity is the online booking cap; the admin can add walk-ins above it, but
  // we flag the overage and offer a one-tap bump so the session number stays honest.
  const capNum=(session.capacity!=null&&session.capacity!=='')?Number(session.capacity):null;
  const overCapacity=capNum!=null?Math.max(0,selCount-capNum):0;
  const raiseCapacity=async()=>{ try{ const row=await sbUpdateSocial(session.id,{capacity:selCount}); onEdited&&onEdited(row||{capacity:selCount}); }catch(e){} };
  const courtsNum=parseInt(courts,10);
  const courtsValid=!isNaN(courtsNum)&&range&&courtsNum>=range[0]&&courtsNum<=range[1];
  // Which court(s) hold the extra player(s) when players don't divide evenly. Default
  // is the strongest courts first; the admin can move the +1 to any court.
  const[bigChoice,setBigChoice]=useState([]);
  const cRem=courtsValid?selCount%courtsNum:0;
  useEffect(()=>{
    if(!courtsValid) return;
    const rem=selCount%courtsNum;
    setBigChoice(prev=>(prev.length===rem&&prev.every(i=>i<courtsNum))?prev:Array.from({length:rem},(_,i)=>i));
  },[selCount,courtsNum,courtsValid]);
  const sizesArr=courtsValid?Array.from({length:courtsNum},(_,i)=>Math.floor(selCount/courtsNum)+(bigChoice.includes(i)?1:0)):null;
  const toggleBig=(i)=>setBigChoice(prev=>{ const rem=selCount%courtsNum; if(prev.includes(i)) return prev.length<=rem?prev:prev.filter(x=>x!==i); const next=[...prev,i]; while(next.length>rem) next.shift(); return next; });
  const fmtR=r=>r==null?'—':Number(r).toFixed(2);

  const add=(name)=>setOrder(o=>o.includes(name)?o:[...o,name]);
  const remove=(name)=>{
    setOrder(o=>o.filter(n=>n!==name));
    // If they were in the built schedule it's now stale — clear it so we never keep
    // (or auto-save) courts/rounds that don't match the line-up.
    setSchedule(sc=>sc&&(sc.courts||[]).some(ct=>(ct.players||[]).some(p=>p.name===name))?null:sc);
    setDynRounds(rs=>rs&&rs.some(rd=>(rd.games||[]).some(g=>[...(g.teamA||[]),...(g.teamB||[]),...(g.sitOut||[])].includes(name)))?[]:rs);
  };
  const addAllShown=()=>setOrder(o=>[...o,...available.map(p=>p.name).filter(n=>!o.includes(n))]);
  const clearAll=()=>{ setOrder([]); setSchedule(null); setDynRounds([]); };
  const move=(from,to)=>setOrder(o=>{ if(to<0||to>=o.length) return o; const n=[...o]; const [x]=n.splice(from,1); n.splice(to,0,x); return n; });
  // Auto-seed: strongest first (known RDR desc); non-ranked & guests after, alphabetically.
  const autoSeed=()=>setOrder(o=>[...o].sort((a,b)=>{
    const ra=ratingOf(a), rb=ratingOf(b);
    if(ra==null&&rb==null) return a.localeCompare(b);
    if(ra==null) return 1; if(rb==null) return -1;
    return rb-ra || a.localeCompare(b);
  }));

  const openManage=(name)=>{ setManageErr(''); setManageName(name); setManageRating(ratingOf(name)!=null?String(ratingOf(name)):''); setManageGender(genderOf(name)||''); };
  const saveManage=async(promote)=>{
    setManageErr('');
    const rt=manageRating.trim();
    if(promote&&rt===''){ setManageErr('A member needs a starting rating (2–8).'); return; }
    if(rt!==''&&(isNaN(Number(rt))||Number(rt)<2||Number(rt)>8)){ setManageErr('Rating must be between 2 and 8.'); return; }
    setManageBusy(true);
    try{
      const patch={}; if(rt!=='') patch.initial_rdr=Number(rt); if(promote) patch.guest=false;
      patch.gender=(manageGender==='male'||manageGender==='female'||manageGender==='other')?manageGender:null;
      await sbUpdatePlayer(manageName,patch);
      await loadRoster();
      setManageName(null); setManageRating('');
    }catch(e){ setManageErr(e.message||'Could not save — are you signed in as admin?'); }
    setManageBusy(false);
  };
  const addPlayer=async()=>{
    setAddErr('');
    const nm=newName.trim(); const rt=newRating.trim();
    if(!nm){ setAddErr('Enter a name.'); return; }
    if((roster||[]).some(p=>p.name.toLowerCase()===nm.toLowerCase())){ setAddErr('That player already exists — find them in the list below.'); return; }
    if(rt!==''&&(isNaN(Number(rt))||Number(rt)<2||Number(rt)>8)){ setAddErr('Rating (optional) must be between 2 and 8.'); return; }
    setAddBusy(true);
    try{
      await sbAddPlayer({name:nm,rating:rt===''?null:Number(rt),guest:newGuest,gender:newGender||null});
      await loadRoster();
      add(nm);
      setNewName(''); setNewRating(''); setNewGender('');
    }catch(e){ setAddErr(e.message||'Could not add — are you signed in as admin?'); }
    setAddBusy(false);
  };

  const generate=()=>{
    setGenErr(''); setMsg({type:'',text:''});
    if(schedule&&scoredCount>0&&!confirm(`Regenerating the courts will clear the ${scoredCount} score(s) you've already entered. Continue?`)) return;
    const players=order.map(n=>({name:n,rating:ratingOf(n),gender:genderOf(n)}));
    const seeded = courtMode==='balanced'?balancedSeed(players,courtsNum)
      : courtMode==='random'?randomSeed(players)
      : courtMode==='protect'?protectSeed(players,courtsNum)
      : courtMode==='mixed'?mixedSeed(players)
      : courtMode==='pairs'?keepPairsSeed(players,courtsNum,pairs)
      : players; // 'ability' = admin's order as-is (strongest first)
    const res=buildSchedule(seeded,courtsNum,targetGames?parseInt(targetGames,10):6,sizesArr,{mixed:courtMode==='mixed', pairs:courtMode==='pairs'?pairs:null});
    if(!res.ok){ setGenErr(res.error); setSchedule(null); return; }
    setSchedule(res); setScores({}); setLoadedPlan(false); // fresh courts → clear any stale scores
    setTimeout(()=>{const el=document.getElementById('soc-schedule'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'});},50);
  };

  const setScore=(k,which,val)=>setScores(s=>({...s,[k]:{...(s[k]||{}),[which]:val.replace(/[^0-9]/g,'')}}));
  const standings=React.useMemo(()=>schedule?computeStandings(schedule.courts,scores):[],[schedule,scores]);
  const scoredCount=Object.values(scores).filter(sc=>sc&&sc.s1!==''&&sc.s1!=null&&sc.s2!==''&&sc.s2!=null&&!isNaN(parseInt(sc.s1,10))&&!isNaN(parseInt(sc.s2,10))).length;

  // ── Dynamic formats (king / ladder / mexicano): round-by-round ──
  const isDynamic=session.format!=='round_robin';
  const isMixer=session.format==='mixer';         // meet-everyone social rotation (pre-generated, unscored)
  const mixerRoundCount=Math.min(8,Math.max(1,parseInt(targetGames,10)||6)); // cap at 8 games — a full night's play
  const dynSortKey=session.format==='mexicano'?'points':'wins';
  const isKing=session.format==='king';
  // King needs exactly 4 per court; global formats need at least 4·courts (extras sit & rotate).
  const dynCourtsValid=!isNaN(courtsNum)&&courtsNum>=1&&(isKing?(selCount===4*courtsNum):(selCount>=4*courtsNum));
  const dynFitCourts=Math.max(1,Math.floor(selCount/4));
  // Guided courts (mirrors graded): only offer counts that fit the chosen format, and
  // default to the best fit once players are chosen. Round-robin uses 4–6 per court;
  // dynamic formats use courts of 4 (king needs an exact multiple of 4).
  const courtOpts = !isDynamic ? courtOptions(selCount)
