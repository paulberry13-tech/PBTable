  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 24px; display:flex; flex-direction:column;\">\n\n    <!-- HEADER -->\n    <header style=\"display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px;\">\n      <div>\n        <div style=\"margin-bottom:14px;\">\n          <img src=\"b2cd9643-c046-4974-b4b4-499f8695ccf9\" alt=\"PBTable\" style=\"height:50px; width:auto; display:block; border-radius:8px;\">\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:2px; color:#FF6A2C; margin-bottom:4px;\">THE SIMPLE VERSION<\u002Fdiv>\n        <h1 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:800; font-size:37px; line-height:1.0; color:#0C1730; letter-spacing:-1px;\">How your RDR rating works<\u002Fh1>\n        <p style=\"margin:8px 0 0; font-size:15px; font-weight:600; color:#525C6B;\">A friendly, no-maths guide for everyone at the club.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"flex:0 0 auto; text-align:center; background:#fff; border:1.5px solid #E4E8EF; border-radius:10px; padding:10px 14px; box-shadow:0 3px 10px rgba(20,30,60,0.05);\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9px; font-weight:600; letter-spacing:1px; color:#8A93A2;\">YOUR RDR<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:700; color:#0C1730; line-height:1;\">5.4<\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#18B26B;\">▲ 0.12<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- GRID -->\n    <div style=\"flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; gap:11px;\">\n\n      <!-- 1 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04); display:flex; flex-direction:column;\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">01<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">What is it?<\u002Fh2>\n          <span style=\"font-size:21px;\">🎯<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.4; color:#525C6B;\">Your RDR is your skill rating at the club: one number, usually between 2 and 8. The higher the number, the stronger the player — and everyone's on the same scale.<\u002Fp>\n        <div style=\"margin-top:auto; display:flex; align-items:center; gap:7px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#0C1730;\">2<\u002Fspan>\n          <div style=\"flex:1; height:7px; border-radius:4px; background:linear-gradient(90deg,#D5DCE6,#0C1730);\"><\u002Fdiv>\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:700; color:#0C1730;\">8<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; justify-content:space-between; font-size:9px; font-weight:700; color:#9AA2B0; margin-top:3px;\"><span>NEWER<\u002Fspan><span>STRONGER<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 2 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">02<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">It's all about results<\u002Fh2>\n          <span style=\"font-size:21px;\">🏓<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#525C6B;\">Your rating comes purely from your games — who you played and how you did. No opinions, no committee, no favourites. Just what happens on court.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 3 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04); display:flex; flex-direction:column;\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">03<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">Win up, lose down<\u002Fh2>\n          <span style=\"font-size:21px;\">📊<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0 0 10px; font-size:12.5px; line-height:1.4; color:#525C6B;\">Every game gives your rating a little nudge. Win and it ticks up, lose and it dips. Play regularly and it settles at your real level.<\u002Fp>\n        <div style=\"margin-top:auto; display:flex; gap:8px;\">\n          <span style=\"flex:1; text-align:center; background:#E7F7EF; color:#0E8F53; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; padding:5px 0; border-radius:6px;\">▲ WIN<\u002Fspan>\n          <span style=\"flex:1; text-align:center; background:#FBEAE8; color:#C0392B; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; padding:5px 0; border-radius:6px;\">▼ LOSE<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- 4 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">04<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">Who you beat matters<\u002Fh2>\n          <span style=\"font-size:21px;\">⚖️<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#525C6B;\">Beat a stronger player and your rating jumps more. Lose to someone you'd usually beat and it costs a bit more. Beating much weaker players barely moves it.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 5 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">05<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">It's a team game<\u002Fh2>\n          <span style=\"font-size:21px;\">🤝<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#525C6B;\">In doubles, your team's strength is you and your partner combined. A win with a weaker partner against a strong pair is worth more — you carried more of the load.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 6 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">06<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">The score counts a little<\u002Fh2>\n          <span style=\"font-size:21px;\">🔢<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#525C6B;\">A comfy win nudges you a touch more than a nail-biter, and a heavy defeat stings a little more. But winning is what matters — no need to run up the score.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 7 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">07<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">New players settle in<\u002Fh2>\n          <span style=\"font-size:21px;\">🌱<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#525C6B;\">Just joined? Your rating takes a few sessions to find its level. Early games move it more while it's getting to know you, then it steadies down.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 8 -->\n      <div style=\"background:#fff; border:1.5px solid #E7EBF1; border-radius:8px; padding:13px 15px; box-shadow:0 2px 8px rgba(20,30,60,0.04);\">\n        <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:5px;\">\n          <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:15px; color:#FF6A2C;\">08<\u002Fspan>\n          <h2 style=\"margin:0; flex:1; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#0C1730;\">It updates every session<\u002Fh2>\n          <span style=\"font-size:21px;\">🔄<\u002Fspan>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#525C6B;\">After each club night's results go in, everyone's rating recalculates automatically. Check the leaderboard to see where you've landed.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- 9 full width -->\n      <div style=\"grid-column:1 / -1; background:#0C1730; border-radius:8px; padding:13px 18px; display:flex; align-items:center; gap:14px;\">\n        <span style=\"flex:0 0 auto; width:42px; height:42px; border-radius:10px; background:#FF6A2C; display:flex; align-items:center; justify-content:center; font-size:23px;\">🏠<\u002Fspan>\n        <div style=\"flex:1;\">\n          <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:2px;\">\n            <span style=\"font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; color:#FF8A55;\">09<\u002Fspan>\n            <h2 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:16px; color:#fff;\">It's your club's own rating<\u002Fh2>\n          <\u002Fdiv>\n          <p style=\"margin:0; font-size:12.5px; line-height:1.4; color:#C2C9D6;\">RDR is built from your club's own games — it reflects how you do <em>here<\u002Fem>, against the people you actually play. It's separate from DUPR (a global rating); you don't need a DUPR to have an RDR.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <!-- FOOTER -->\n    <footer style=\"margin-top:14px; display:flex; align-items:center; justify-content:space-between; gap:16px;\">\n      <p style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:17px; color:#0C1730;\">Play often, play anyone, and let your rating tell your story. 🏓<\u002Fp>\n      <span style=\"flex:0 0 auto; font-family:'IBM Plex Mono',monospace; font-size:10px; font-weight:600; color:#8A93A2; text-align:right;\">RDR = RALLY DOUBLES RATING<br>WANT THE DETAIL? READ ON →<\u002Fspan>\n    <\u002Ffooter>\n\n  <\u002Fsection>\n\n  <!-- ===================== PAGE 2 — UNDER THE HOOD ===================== -->\n  <section class=\"page\" style=\"background:#0C1730; padding:36px 38px; display:flex; flex-direction:column;\">\n\n    <div style=\"position:absolute; top:-90px; right:-90px; width:260px; height:260px; border-radius:50%; background:#FF6A2C; opacity:0.10;\"><\u002Fdiv>\n\n    <header style=\"position:relative; margin-bottom:18px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; letter-spacing:2px; color:#FF8A55; margin-bottom:6px;\">UNDER THE HOOD · OPTIONAL<\u002Fdiv>\n      <h2 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:800; font-size:34px; color:#fff; letter-spacing:-0.8px;\">For the curious 🔧<\u002Fh2>\n      <p style=\"margin:9px 0 0; font-size:14px; line-height:1.45; color:#AEB6C6; max-width:660px;\">Happy with the simple version? You can stop here — that's all you need. But if you like knowing how things tick, here's what's quietly going on behind your number. Still no maths, promise.<\u002Fp>\n    <\u002Fheader>\n\n    <div style=\"flex:1 1 auto; display:grid; grid-template-columns:1fr 1fr; gap:12px;\">\n\n      <!-- a -->\n      <div style=\"background:#15224A; border:1px solid #233566; border-radius:8px; padding:17px 18px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:7px;\">\n          <span style=\"font-size:20px;\">🔮<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:#fff; text-wrap:balance;\">Expected vs actual<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.46; color:#B6BECE;\">Before each game, the system works out the result it would <strong style=\"color:#fff;\">expect<\u002Fstrong> from the four ratings — a stronger pair is expected to win, and roughly by how much. Your rating then moves on the <strong style=\"color:#FF8A55;\">gap<\u002Fstrong> between what was expected and what really happened. A result that goes to form barely moves anyone; a genuine upset moves everyone more.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- b -->\n      <div style=\"background:#15224A; border:1px solid #233566; border-radius:8px; padding:17px 18px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:7px;\">\n          <span style=\"font-size:20px;\">⚖️<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:#fff; text-wrap:balance;\">It's a fair swap<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.46; color:#B6BECE;\">Rating is shared, not invented. Whatever the winners gain, the losers give up by the same amount. So the club's ratings stay balanced over time and don't quietly drift up or down for everyone.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- c -->\n      <div style=\"background:#15224A; border:1px solid #233566; border-radius:8px; padding:17px 18px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:7px;\">\n          <span style=\"font-size:20px;\">📏<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:#fff; text-wrap:balance;\">How big the move is<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.46; color:#B6BECE;\">Two things size each change: how <strong style=\"color:#fff;\">surprising<\u002Fstrong> the result was, and how <strong style=\"color:#fff;\">settled<\u002Fstrong> your rating already is. Newer or less-active players have a less certain rating, so theirs moves faster; long-standing players move in smaller, steadier steps.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- d -->\n      <div style=\"background:#15224A; border:1px solid #233566; border-radius:8px; padding:17px 18px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:7px;\">\n          <span style=\"font-size:20px;\">🎯<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:#fff; text-wrap:balance;\">Confidence grows with play<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.46; color:#B6BECE;\">Behind your number, the system also tracks how sure it is of it. The more you play — and the more varied your opponents — the more confident and stable your rating becomes. That's why your first few sessions feel swingy and later ones don't.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- e -->\n      <div style=\"background:#15224A; border:1px solid #233566; border-radius:8px; padding:17px 18px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:7px;\">\n          <span style=\"font-size:20px;\">🤝<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:#fff; text-wrap:balance;\">Teams and margins<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.46; color:#B6BECE;\">A team's strength is the average of its two players' ratings, and the winning margin feeds in too — but it's <strong style=\"color:#FF8A55;\">capped<\u002Fstrong>. An 11–0 thrashing doesn't count wildly more than a solid 11–4, so blowouts can't dominate.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- f -->\n      <div style=\"background:#15224A; border:1px solid #233566; border-radius:8px; padding:17px 18px; display:flex; flex-direction:column; justify-content:center;\">\n        <div style=\"display:flex; align-items:center; gap:9px; margin-bottom:7px;\">\n          <span style=\"font-size:20px;\">🌱<\u002Fspan>\n          <h3 style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15.5px; color:#fff; text-wrap:balance;\">Where new players start<\u002Fh3>\n        <\u002Fdiv>\n        <p style=\"margin:0; font-size:12.5px; line-height:1.46; color:#B6BECE;\">A brand-new player begins from a sensible starting estimate — or from the level of the players around them in their first games. Their real rating then emerges naturally over those opening sessions.<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n\n    <footer style=\"position:relative; margin-top:16px; background:#FF6A2C; border-radius:8px; padding:13px 18px; display:flex; align-items:center; gap:12px;\">\n      <span style=\"font-size:22px;\">🔥<\u002Fspan>\n      <p style=\"margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; color:#fff; line-height:1.35;\">The short version of all that: it's fair, it's balanced, and it always weighs the result against who was on court. Just keep playing — your rating takes care of itself.<\u002Fp>\n    <\u002Ffooter>\n\n  <\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>

</html>
